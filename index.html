<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FBSM — Система учёта продаж</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f3;--surface:#fff;--s2:#f0eeea;
  --text:#1a1a1a;--muted:#6b6b68;--border:#e0ded8;
  --blue:#185FA5;--bl:#E6F1FB;--bd:#0C447C;
  --green:#3B6D11;--gl:#EAF3DE;
  --amber:#BA7517;--al:#FAEEDA;
  --red:#A32D2D;--rl:#FCEBEB;
  --r:10px;--rs:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
.screen{display:none;min-height:100vh}.screen.active{display:block}
.aw{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.ac{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:2rem;width:100%;max-width:360px}
.brand{font-size:28px;font-weight:700;letter-spacing:2px;color:var(--bd);text-align:center}
.sub{font-size:13px;color:var(--muted);text-align:center;margin:4px 0 1.5rem}
.layout{display:flex;min-height:100vh}
.sb{width:220px;background:var(--bd);color:#fff;flex-shrink:0;display:flex;flex-direction:column}
.sb-logo{padding:1.25rem 1rem;font-size:18px;font-weight:700;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-user{padding:.75rem 1rem;font-size:12px;color:rgba(255,255,255,.6);border-bottom:1px solid rgba(255,255,255,.1)}
.sb-user strong{display:block;color:#fff;font-size:13px;margin-bottom:2px}
.ni{display:flex;align-items:center;gap:10px;padding:.75rem 1rem;font-size:14px;color:rgba(255,255,255,.75);cursor:pointer;border:none;background:none;width:100%;text-align:left;border-left:3px solid transparent}
.ni:hover{background:rgba(255,255,255,.08);color:#fff}
.ni.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:#fff}
.sb-bot{margin-top:auto;padding:1rem;border-top:1px solid rgba(255,255,255,.1)}
.main{flex:1;overflow-y:auto}
.mh{background:var(--surface);border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.mt{font-size:17px;font-weight:600}
.cnt{padding:1.5rem}
@media(max-width:640px){
  .layout{flex-direction:column}.sb{width:100%;flex-direction:row;flex-wrap:wrap}
  .sb-logo{flex:1}.sb-user{display:none}
  .ni{padding:.5rem .75rem;font-size:12px;border-left:none;border-bottom:3px solid transparent}
  .ni.active{border-bottom-color:#fff;border-left:none}
  .sb-bot{padding:.5rem}.cnt{padding:1rem}
}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:1.25rem;margin-bottom:1rem}
.ct{font-size:15px;font-weight:600;margin-bottom:1rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
.metric{background:var(--s2);border-radius:var(--rs);padding:1rem;text-align:center}
.mv{font-size:20px;font-weight:700;margin-top:4px;line-height:1}
.ml{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.btn:hover{background:var(--s2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.bp{background:var(--blue);color:#fff;border-color:var(--blue)}.bp:hover{background:var(--bd)}
.bd2{color:var(--red);border-color:var(--red)}.bd2:hover{background:var(--rl)}
.bsm{padding:5px 10px;font-size:12px}.bbl{width:100%;justify-content:center}
.fg{margin-bottom:.75rem}
.fl{font-size:13px;color:var(--muted);display:block;margin-bottom:4px;font-weight:500}
.fc{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--rs);background:var(--surface);color:var(--text);font-size:14px}
.fc:focus{outline:none;border-color:var(--blue)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media(max-width:400px){.fr{grid-template-columns:1fr}}
.pb{background:var(--s2);border-radius:100px;height:8px;overflow:hidden;margin:6px 0}
.pf{height:100%;border-radius:100px;transition:width .5s}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600}
.ts{background:var(--gl);color:var(--green)}.tw{background:var(--al);color:var(--amber)}
.td{background:var(--rl);color:var(--red)}.ti{background:var(--bl);color:var(--bd)}
.tw-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--s2);padding:8px 10px;text-align:left;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--s2)}
.alert{padding:10px 14px;border-radius:var(--rs);font-size:13px;margin-bottom:.75rem}
.as{background:var(--gl);color:var(--green)}.ae{background:var(--rl);color:var(--red)}.ai{background:var(--bl);color:var(--bd)}
.motiv{background:var(--bl);border:1px solid #B5D4F4;border-radius:var(--r);padding:1rem;margin-bottom:1rem;font-size:14px;color:var(--bd)}
.nav-g{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
  padding:14px 12px 5px;font-weight:700;opacity:.75}
.nav-g:first-child{padding-top:4px}
.rclock{font-size:38px;font-weight:700;letter-spacing:-1px;text-align:center;margin:.4rem 0}
.rsince{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:1rem}
.rnote{font-size:11.5px;color:var(--muted);margin-top:.6rem}
.zpr{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--border);font-size:13px;color:var(--muted)}
.zpr:last-child{border:none;font-weight:600;color:var(--text);font-size:14px}
.rank{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:600}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
.ovc{background:var(--surface);border-radius:var(--r);padding:1.5rem;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loader{position:fixed;inset:0;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;z-index:999;gap:10px;font-size:14px;color:var(--muted)}
.print-only{display:none}
@media print{.sb,.mh,.btn,.nav-item{display:none!important}.print-only{display:block}.cnt{padding:0}}
/* ══ ГРАФИК СМЕН (модуль sch*) ══ */
/* Селекторы намеренно вида «.sch td.xxx»: базовое правило .sch td
   имеет специфичность (0,1,1) и перебивало бы одиночные классы. */
.sch-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.sch{border-collapse:separate;border-spacing:0;font-size:12px;width:auto;min-width:100%}
.sch td,.sch th{padding:0;border:none}
.sch tbody tr:hover td{background:none}

.sch td.sch-name,.sch th.sch-name{position:sticky;left:0;z-index:2;background:var(--surface);
  min-width:200px;max-width:200px;padding:11px 16px;text-align:left;line-height:1.4;
  border-right:2px solid var(--border);border-bottom:1px solid var(--border)}
.sch thead th.sch-name{background:var(--s2);z-index:3;padding-top:9px;padding-bottom:9px}

.sch td.sch-day,.sch th.sch-day{width:38px;min-width:38px;
  border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.sch thead th.sch-day{background:var(--s2);padding:8px 0 7px;text-align:center}
.sch-dn{display:block;font-weight:700;font-size:11.5px;color:var(--text)}
.sch-dw{display:block;font-size:9.5px;color:var(--muted);margin-top:2px}
.sch td.sch-we{background:#faf8f4}
.sch thead th.sch-we{background:#eae2d6}
.sch thead th.sch-we .sch-dn{color:var(--amber)}

.sch td.sch-tot,.sch th.sch-tot{min-width:64px;text-align:center;background:var(--s2);
  font-weight:700;font-size:13px;border-bottom:1px solid var(--border);
  border-left:1px solid var(--border);padding:8px 6px}
.sch thead th.sch-tot{font-size:10.5px;color:var(--muted);letter-spacing:.4px;padding:9px 6px}

/* Клетка: цветная «плашка» с отступом от границ — это и даёт воздух */
.sch-cell{height:44px;padding:4px;display:flex;flex-direction:column;gap:3px;
  cursor:pointer;user-select:none}
.sch-cell.ro{cursor:default}
.sch-p{flex:1;display:flex;align-items:center;justify-content:center;border-radius:5px;
  font-weight:700;font-size:11px;line-height:1;letter-spacing:.2px;transition:box-shadow .12s}
.sch-cell:not(.ro):hover .sch-p{box-shadow:inset 0 0 0 2px var(--blue)}
.sch-cell:not(.ro):hover .sch-p:empty{background:var(--bl)}
.sch-f{height:4px;border-radius:2px;flex-shrink:0}
.sch-cell.extra .sch-p{box-shadow:inset 0 0 0 2px var(--blue);background:var(--bl)}
.sch-cell.noplan .sch-p{background:var(--s2);font-weight:600}

.sch tbody tr.sch-sum td{background:var(--s2);font-weight:600;font-size:11.5px;text-align:center;
  color:var(--muted);border-bottom:1px solid var(--border);padding:9px 0}
.sch tbody tr.sch-sum td.sch-name{background:var(--s2);font-weight:600;color:var(--muted);text-align:left}
.sch tbody tr.sch-sum:first-of-type td{border-top:2px solid var(--border)}

.sch-legend{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:1.1rem;padding:0 2px;
  font-size:12px;color:var(--muted);align-items:center}
.sch-dot{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}

.sch-opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 1.25rem}
.sch-opt{padding:10px 14px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);
  color:var(--text);cursor:pointer;font-size:13px;font-weight:500;text-align:left}
.sch-opt:hover{background:var(--s2)}
.sch-opt.sel{border-color:var(--blue);background:var(--bl);color:var(--bd);font-weight:600}
@media(max-width:640px){
  .sch td.sch-name,.sch th.sch-name{min-width:150px;max-width:150px;padding:9px 11px}
  .sch td.sch-day,.sch th.sch-day{width:34px;min-width:34px}
}
</style>

<div id="loader" class="loader"><div class="spin"></div> Загрузка...</div>

<div id="screen-login" class="screen">
  <div class="aw"><div class="ac">
    <div class="brand">FBSM</div>
    <div class="sub">Система учёта продаж</div>
    <div id="lerr" class="alert ae" style="display:none"></div>
    <div class="fg"><label class="fl">Выберите имя</label>
      <select id="lname" class="fc"><option value="">— выберите —</option></select>
    </div>
    <div class="fg"><label class="fl">Пароль</label>
      <input type="password" id="lpass" class="fc" placeholder="Введите пароль">
    </div>
    <button class="btn bp bbl" onclick="doLogin()">Войти</button>
  </div></div>
</div>

<div id="screen-app" class="screen">
  <div class="layout">
    <div class="sb">
      <div class="sb-logo">FBSM</div>
      <div id="sb-ver" style="padding:.4rem 1rem;font-size:10.5px;color:rgba(255,255,255,.35)"></div>
      <div class="sb-user"><strong id="sb-name">—</strong><span id="sb-shop">—</span></div>
      <div id="sb-nav"></div>
      <div class="sb-bot">
        <button class="btn bsm bbl" style="color:#fff;border-color:rgba(255,255,255,.3);background:transparent" onclick="doLogout()">Выйти</button>
      </div>
    </div>
    <div class="main">
      <div class="mh"><span class="mt" id="main-title">—</span><span id="main-badge"></span></div>
      <div class="cnt" id="content"></div>
    </div>
  </div>
</div>

<script>
const API='https://qeehxcnnuzuwskznhdyg.supabase.co/functions/v1/api';
const SUPABASE_ANON_KEY='sb_publishable_YPJerpA53QDpCgt69qB1Iw_3Ay0CaRY';
// Список магазинов — один на всю программу и берётся из справочника
// сотрудников. Раньше он был здесь константой, а в базе жил свой список
// точек: пока они совпадали, всё работало, но новый магазин пришлось бы
// заводить в двух местах, и однажды его завели бы в одном.
let SHOPS=['Караганда','Алматы','Асфендиярова','Манаса','Республика'];
// Список подразделений задаётся в «Параметрах», а не собирается из карточек
// сотрудников. Иначе новую точку нельзя выбрать, пока в ней некому работать,
// а работать некому, пока её нельзя выбрать. Точки из карточек добавляются
// к списку, а не заменяют его: заведённый человек не должен потеряться.
function refreshShops(){
  const listed=String(PARAMS.shopsList||'').split(',').map(s=>s.trim()).filter(Boolean);
  const fromUsers=(USERS||[]).map(u=>u.shop).filter(Boolean).sort((a,b)=>a.localeCompare(b));
  // Порядок — как в списке: он же задаёт порядок колонок в дашборде и
  // строк в сводке. Магазины впереди, Outlet и интернет-магазин в конце —
  // вперемешку их читать неудобно. Меняется перетаскиванием строк в поле.
  const all=[...new Set(listed.concat(fromUsers))];
  if(all.length) SHOPS=all;
}
const APP_VERSION='2026-08-06 · 7';
let CU=null,PARAMS={},USERS=[],_sales=[],_plans=[];

// ══ API (Supabase Edge Function) ══
// Интерфейс (названия action и параметры) сохранён таким же, каким был
// у Apps Script — вся остальная логика программы работает без изменений.
function delay(ms){return new Promise(res=>setTimeout(res,ms));}

async function callEdgeFn(action,data={},attempt=1){
  try{
    const r=await fetch(API,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+SUPABASE_ANON_KEY,
        'apikey':SUPABASE_ANON_KEY,
      },
      // Токен входа прикладываем ко всем запросам — по нему сервер узнаёт,
      // кто спрашивает, и решает, можно ли. До этого сервер отвечал всем
      // одинаково, а роль проверялась только в браузере и подменялась
      // через консоль за десять секунд.
      body:JSON.stringify({action,token:window._authToken||null,...data}),
    });
    const j=await r.json();
    // Сессия кончилась или её нет — возвращаем на вход, а не показываем
    // непонятную ошибку посреди работы.
    if(j&&j.authError){ sessionLost(j.error||'Сессия истекла'); throw new Error('AUTH'); }
    // Отказ по правам — не сбой связи: повторять его бессмысленно,
    // а человеку нужно прочитать причину, а не «сервер не отвечает».
    if(j.error){ const err=new Error(j.error); if(r.status===403)err.denied=true; throw err; }
    return j;
  }catch(e){
    if(e&&e.message==='AUTH')throw e;
    if(e&&e.denied){ L(false); throw e; }
    if(attempt<3){
      await delay(800*attempt);
      return callEdgeFn(action,data,attempt+1);
    }
    // Раньше ошибка просто улетала наверх, а её никто не ловил: оверлей
    // «Загрузка» оставался висеть навсегда, и человек не понимал,
    // сохранились данные или нет. Гасим оверлей и показываем причину.
    L(false);
    const msg='Сервер не отвечает. Данные не сохранены — попробуйте ещё раз или обновите страницу.';
    showFatal(msg+' ('+e.message+')');
    throw new Error(msg);
  }
}

// Сессия кончилась (12 часов) или страница открыта со старой версии.
// Возвращаем на экран входа с понятным текстом — иначе человек увидел бы
// отказ посреди работы и не понял, что делать.
function sessionLost(text){
  window._authToken=null; CU=null;
  L(false);
  showScreen('login');
  const err=document.getElementById('lerr');
  if(err){err.textContent=text+'. Войдите заново.';err.style.display='block';}
}

// Единая плашка об ошибке поверх интерфейса. Сама гаснет через 8 секунд.
function showFatal(text){
  let box=document.getElementById('fatal');
  if(!box){
    box=document.createElement('div');
    box.id='fatal';
    box.style.cssText='position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:1000;'
      +'max-width:520px;background:var(--rl);color:var(--red);border:1px solid var(--red);'
      +'border-radius:var(--r);padding:12px 16px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.15)';
    document.body.appendChild(box);
  }
  box.textContent=text;
  box.style.display='block';
  clearTimeout(box._t);
  box._t=setTimeout(()=>{box.style.display='none'},8000);
}
async function api(action,data={}){ return callEdgeFn(action,data); }
async function apiPost(action,data={}){ return callEdgeFn(action,data); }

// ══ UTILS ══
const fmt=n=>Math.round(n||0).toLocaleString('ru-RU')+'₸';
const fmtN=n=>Math.round(n||0).toLocaleString('ru-RU');
function fmtUpdatedAt(iso){
  if(!iso) return 'Данные ещё не загружались — нажми «Обновить данные»';
  try{
    const d=new Date(iso);
    return 'Данные обновлены: '+d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  }catch(e){return '';}
}
// Дата по МЕСТНОМУ времени. Через toISOString() было бы UTC, а Казахстан
// UTC+5 — с полуночи до 5 утра функция возвращала вчерашний день, и ночная
// смена записывалась не в те сутки.
function today(){
  const n=new Date();
  return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
}
// Экранирование пользовательских данных перед вставкой в innerHTML.
// Имена сотрудников заводит управляющий — без этого имя вида
// <img src=x onerror=...> выполнялось бы у всех, кто открыл страницу.
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// JSON внутрь HTML-атрибута onclick='...'. Апостроф в фамилии (О'Нил)
// иначе разрывает атрибут и кнопка перестаёт работать.
const escAttr=o=>esc(JSON.stringify(o));
// Для подстановки простой строки в атрибут: escAttr сериализует объект
// и в кавычки не годится.
const escAttr2=v=>esc(String(v==null?'':v));

// Проверка ввода продаж. Раньше не было никакой: проходили отрицательные
// суммы (портили факт магазина и премию всей смене), экспонента 1e12,
// дробные тенге и даты из прошлого века.
const MAX_DAY_SALES=50000000;   // потолок дневной выручки одного продавца
function validateEntry({date,sales,checks,units,returns}){
  if(!date)return'Выберите дату';
  const d=new Date(date+'T00:00:00');
  if(isNaN(d))return'Некорректная дата';
  const now=new Date(today()+'T00:00:00');
  if(d>now)return'Дата в будущем — так нельзя';
  const limit=new Date(now); limit.setMonth(limit.getMonth()-3);
  if(d<limit)return'Дата старше трёх месяцев. Обратитесь к управляющему';
  const nums={'Сумма продаж':sales,'Чеки':checks,'Единицы':units,'Возврат':returns};
  for(const k in nums){
    const v=nums[k];
    if(!isFinite(v))return k+': не число';
    if(v<0)return k+': отрицательное значение';
    if(v>MAX_DAY_SALES)return k+': слишком большое значение';
  }
  if(!Number.isInteger(checks)||!Number.isInteger(units))return'Чеки и единицы — целые числа';
  if(checks===0&&sales>0)return'Указана выручка, но ноль чеков';
  if(sales===0&&checks>0)return'Указаны чеки, но нулевая выручка';
  return null;
}

// Базовые параметры сетки продавца (использовались как магические числа
// в старом коде — теперь одно место истины, аналогично MGR_DEFAULTS ниже).
// Подписи ролей — одно место истины вместо четырёх копий карты.
const ROLE_LABELS={admin:'Гл. Админ',manager:'Управляющий',seller:'Продавец',
  accountant:'Бухгалтер',runner:'Раннер',whhead:'Зав. складом',
  store:'Кладовщик',immgr:'Менеджер ИМ',streamer:'Стример'};

// ══ ДОЛЖНОСТИ С ОТМЕТКОЙ ВРЕМЕНИ И ОКЛАДОМ ══
// mark — как человек отмечает день: clock — приход и уход, sales —
//   подтверждением своих продаж, как продавец.
// pay  — за что платим: shift — за смену по ставке, oklad — месячный
//   оклад, делённый на норму смен и умноженный на отработанные.
// Держим одной таблицей, чтобы пятая должность заводилась строкой здесь,
// а не правкой в дюжине мест.
const POSITIONS={
  runner:  {label:'Раннер',      plural:'Раннеры',       icon:'🏃',
            mark:'clock', pay:'shift', rateKey:'runnerRate', rateDef:6000},
  whhead:  {label:'Зав. складом',plural:'Заведующие складом', icon:'📦',
            mark:'clock', pay:'shift', rateKey:'whRate',     rateDef:15000},
  store:   {label:'Кладовщик',   plural:'Кладовщики',    icon:'📦',
            mark:'clock', pay:'shift', rateKey:'storeRate',  rateDef:12500},
  immgr:   {label:'Менеджер ИМ', plural:'Менеджеры интернет-магазина', icon:'🌐',
            mark:'clock', pay:'oklad', okladKey:'imOklad',   okladDef:500000, normKey:'imNorm'},
  streamer:{label:'Стример',     plural:'Стримеры',      icon:'🎥',
            mark:'sales', pay:'oklad', okladKey:'streamOklad', okladDef:300000, normKey:'streamNorm',
            pctKey:'streamPct', pctDef:0.05}
};
// Должности, которые отмечают приход и уход. Порядок задаёт порядок блоков
// в начислении.
const CLOCK_ROLES=Object.keys(POSITIONS).filter(r=>POSITIONS[r].mark==='clock');
// Должности, которые подтверждают продажи: продавец и стример.
const SALES_ROLES=['seller','streamer'];
const isClockRole=r=>CLOCK_ROLES.indexOf(r)>=0;
// Кто вообще стоит в графике и в табеле.
const STAFF_ROLES=['seller','manager','streamer'].concat(CLOCK_ROLES);

// Норма смен месяца. От неё считается оклад стримера и менеджера ИМ.
// В коротком месяце бухгалтер меняет это одно число в параметрах.
function okladNorm(role){
  const c=role&&POSITIONS[role];
  return (c&&parseFloat(PARAMS[c.normKey]))||parseFloat(PARAMS.okladNorm)||22;
}
function okladPay(shifts,role){
  const c=POSITIONS[role]; if(!c||c.pay!=='oklad')return 0;
  const ok=parseFloat(PARAMS[c.okladKey])||c.okladDef;
  const norm=okladNorm(role);
  return norm>0?ok/norm*shifts:0;
}
// Смены, вписанные бухгалтером, важнее расчётных: программа могла ошибиться,
// а человек — забыть отметиться. Пусто — считает программа.
function effShifts(adj,computed){
  const v=adj&&adj.corrected_shifts;
  return (v===null||v===undefined||v==='')?computed:(parseFloat(v)||0);
}
// Торговая ли точка. Склад и офис продаж не делают, и в сводке, рейтинге
// и планах им делать нечего. Всё, чего нет в списке, торгует — так новый
// магазин заработает сам, и забыть про него нельзя.
function nonTradeShops(){
  return String(PARAMS.nonTradeShops||'Склад Пушкина,Офис')
    .split(',').map(s=>s.trim()).filter(Boolean);
}
const isTradeShop=sh=>nonTradeShops().indexOf(sh)<0;
// Должность по идентификатору: смены одного человека нельзя считать
// по ставке другого, а в общих списках роль под рукой не всегда.
function roleOf(uid){ return ((USERS||[]).find(u=>String(u.id)===String(uid))||{}).role||'runner'; }
// Итоги по записям продаж за период. Этот подсчёт был скопирован дословно
// в шести местах: дашборд, история, история продавцов, рейтинг, сводка,
// начисление. Правка в одном из них разъехалась бы с остальными.
// net — выручка за вычетом возвратов, не ниже нуля.
function sumEntries(ents){
  let sales=0,checks=0,units=0,returns=0;
  (ents||[]).forEach(e=>{sales+=+e.sales;checks+=+e.checks;units+=+e.units;returns+=+(e.returns||0)});
  return {sales,checks,units,returns,net:Math.max(0,sales-returns)};
}
const SELLER_DEFAULTS={rate:6000,shifts:15,base:0.01,p80:0.005,p100:0.015,p140:0.03,bMag:10000,bKpi:10000,avgNorm:15000,uptNorm:2.5};

// Общее ядро расчёта ЗП — "лестница" бонусов 80/100/140% и KPI,
// на которой строятся все варианты (прогноз / факт / с корректировкой,
// для продавца и для управляющего). Различия между вызывающими функциями
// передаются через params/opts, а не дублируют формулы заново.
//
// opts:
//   defaults     — объект с дефолтными значениями ставок (SELLER_DEFAULTS/MGR_DEFAULTS)
//   hasShopBonus — есть ли отдельный бонус за план магазина (да у продавца, нет у управляющего)
//   capUpt       — ограничивать ли uptNorm потолком 100 (сохранено как в оригинале:
//                  прогнозная calcZP этого не делала, остальные — делали)
//   capAvgAt     — потолок для avgNorm, или null если без ограничения (сохранено:
//                  у управляющего исторически стоял потолок 999999, у продавца — нет)
function computeZPCore(amountForTiers,avgAmount,checks,units,pct,p,opts){
  const d=opts.defaults;
  const rate=parseFloat(p.rate)||d.rate;
  const base=amountForTiers*(parseFloat(p.base)||d.base);
  const a80=pct>=0.8?amountForTiers*(parseFloat(p.p80)||d.p80):0;
  const a100=pct>=1?amountForTiers*(parseFloat(p.p100)||d.p100):0;
  const a140=pct>=1.4?amountForTiers*(parseFloat(p.p140)||d.p140):0;

  const avg=checks>0?avgAmount/checks:0;
  const upt=checks>0?units/checks:0;
  const avgN=opts.capAvgAt!=null?Math.min(parseFloat(p.avgNorm)||d.avgNorm,opts.capAvgAt):(parseFloat(p.avgNorm)||d.avgNorm);
  const uptNraw=parseFloat(p.uptNorm)||d.uptNorm;
  const uptN=opts.capUpt?Math.min(uptNraw,100):uptNraw;
  const bk1=avg>=avgN?(parseFloat(p.bKpi)||d.bKpi):0;
  const bk2=upt>=uptN?(parseFloat(p.bKpi)||d.bKpi):0;

  const bMag=opts.hasShopBonus?(opts.shopBonusOn?(parseFloat(p.bMag)||d.bMag):0):0;

  const base_total=rate*opts.shifts+base+a80+a100+a140+bMag+bk1+bk2;
  const result={oklad:rate*opts.shifts,base,a80,a100,a140,bk1,bk2,total:base_total,avg,upt};
  if(opts.hasShopBonus) result.bMag=bMag;
  return result;
}

function calcZP(sales,checks,units,pct,p){
  p=p||PARAMS;
  const shifts=parseFloat(p.shifts)||SELLER_DEFAULTS.shifts;
  // Фактические смены = количество дней с продажами (передаётся отдельно)
  // В прогнозе используем норму смен
  return computeZPCore(sales,sales,checks,units,pct,p,{
    defaults:SELLER_DEFAULTS,shifts,hasShopBonus:true,shopBonusOn:pct>=1,
    capUpt:false,capAvgAt:null, // как в оригинале: прогноз без ограничения uptNorm
  });
}

function calcZPActual(sales,checks,units,pct,actualShifts,shopPlanMet,p){
  if(typeof shopPlanMet==='object'&&shopPlanMet!==null&&!p){p=shopPlanMet;shopPlanMet=undefined;}
  p=p||PARAMS;
  const shopBonusOn=shopPlanMet!==undefined?shopPlanMet:(pct>=1);
  return computeZPCore(sales,sales,checks,units,pct,p,{
    defaults:SELLER_DEFAULTS,shifts:actualShifts,hasShopBonus:true,shopBonusOn,
    capUpt:true,capAvgAt:null,
  });
}

// ЗП с корректировкой перед начислением: скорректированная сумма продаж
// влияет ТОЛЬКО на % от продаж и пороговые бонусы (80/100/140%,бонус плана),
// а KPI (средний чек, UPT) считаются от РЕАЛЬНЫХ данных — они не меняются.
function calcZPCorrected(realSales,checks,units,correctedSales,plan,actualShifts,shopPlanMet,p){
  p=p||PARAMS;
  const salesForTiers=(correctedSales!==null&&correctedSales!==undefined&&correctedSales!=='')
    ?parseFloat(correctedSales):realSales;
  const pct=plan>0?salesForTiers/plan:0;
  const shopBonusOn=shopPlanMet!==undefined?shopPlanMet:(pct>=1);
  const r=computeZPCore(salesForTiers,realSales,checks,units,pct,p,{
    defaults:SELLER_DEFAULTS,shifts:actualShifts,hasShopBonus:true,shopBonusOn,
    capUpt:true,capAvgAt:null,
  });
  r.pctUsed=pct;r.salesForTiers=salesForTiers;
  return r;
}

// Аналог для управляющих — то же общее ядро computeZPCore, но без
// бонуса за план магазина (у управляющего его нет) и со своими
// дефолтными ставками (MGR_DEFAULTS определён ниже в файле).
function calcMgrZPCorrected(realFact,checks,units,correctedFact,plan,shifts,p){
  p=p||MGR_PARAMS;
  const factForTiers=(correctedFact!==null&&correctedFact!==undefined&&correctedFact!=='')
    ?parseFloat(correctedFact):realFact;
  const pct=plan>0?factForTiers/plan:0;
  const sh=shifts!==undefined?shifts:(parseFloat(p.shifts)||MGR_DEFAULTS.shifts);
  const r=computeZPCore(factForTiers,realFact,checks,units,pct,p,{
    defaults:MGR_DEFAULTS,shifts:sh,hasShopBonus:false,shopBonusOn:false,
    capUpt:true,capAvgAt:999999,
  });
  r.pctUsed=pct;r.factForTiers=factForTiers;
  return r;
}

  const r=_plans.find(p=>String(p.uid)===String(uid)&&normMk(p.mk)===normMk(mk));

function monthsOpts(past=6,future=0){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth();
  const cur=y+'-'+String(m+1).padStart(2,'0');
  let html='';
  for(let i=future;i>=1;i--){
    const d=new Date(y,m+i,1);
    const mk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    html+=`<option value="${mk}">${d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</option>`;
  }
  html+=`<option value="${cur}" selected>${n.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</option>`;
  for(let i=1;i<past;i++){
    const d=new Date(y,m-i,1);
    const mk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    html+=`<option value="${mk}">${d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</option>`;
  }
  return html;
}

window.doLogin=async function(){
  const id=document.getElementById('lname').value;
  const pass=document.getElementById('lpass').value;
  const err=document.getElementById('lerr');
  err.style.display='none';
  if(!id){err.textContent='Выберите имя';err.style.display='block';return}
  // Пароль проверяется НА СЕРВЕРЕ. Раньше сверка шла здесь, в браузере,
  // а значит getUsers обязан был присылать пароли всех сотрудников —
  // любой продавец видел пароль администратора через F12.
  let user=null;
  L(true);
  const r=await api('login',{id,pass});
  L(false);
  if(!r||r.ok!==true){
    err.textContent=(r&&r.reason)||'Неверное имя или пароль';
    err.style.display='block';return;
  }
  user=r.user; window._authToken=r.token;
  document.getElementById('lpass').value='';
  CU=user;
  document.getElementById('sb-name').textContent=CU.name;
  document.getElementById('sb-shop').textContent=CU.shop||'Администратор';

  [_plans,PARAMS]=await Promise.all([api('getPlans',{}),api('getParams')]);
  await loadClosed(true);   // какие месяцы уже закрыты бухгалтером
  _sales=[]; // подгружается отдельно на каждой странице, отфильтровано по месяцу
  L(false);
  setupSidebar();showScreen('app');
}

       :`<button class="ni" id="n-${i.fn}" onclick="${i.fn}()"><span style="width:20px">${i.ic}</span>${i.l}</button>`
  ).join('');

  else pgReport();
}

window.calcScen=function(){

}

// Когда последний раз забирали данные из 1С и закрыт ли уже день.
// Продавцу важно понимать, свежие перед ним цифры или обмен отвалился
// час назад: иначе он подтвердит неполный день и будет считать,
// что программа его обсчитала.
async function syncInfo(date){
  const out={at:null,ok:true,closed:null};
  try{
    const st=await schFetch('/sync_state?select=at,ok,src_at&key=eq.onec');
    if(Array.isArray(st)&&st.length){ out.at=st[0].at; out.ok=st[0].ok!==false; out.srcAt=st[0].src_at||null; }
  }catch(e){}
  try{
    const d=await schFetch('/onec_days?select=is_closed&date=eq.'+date);
    if(Array.isArray(d)&&d.length) out.closed=!!d[0].is_closed;
  }catch(e){}
  return out;
}

// Строка «данные из 1С на 19:42» + предупреждение про незакрытый день
function syncNote(info){
  if(!info.at) return '';
  // Показываем время САМОЙ 1С, а не нашего обмена. Наш ходит каждые 15 минут
  // и потому всегда выглядит свежим, а копия 1С обновляется раз в час —
  // выходило, что программа обещает свежие данные, которым почти час.
  const t=new Date(info.srcAt||info.at);
  const mins=Math.round((Date.now()-t.getTime())/60000);
  const clock=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
  // Обмен раз в 15 минут, 1С обновляется раз в час. Два часа тишины — сбой.
  const ours=Math.round((Date.now()-new Date(info.at).getTime())/60000);
  const stale=!info.ok||ours>30||mins>120;
  let h='<div style="font-size:11.5px;color:var(--muted);margin-top:.6rem">'
    +(stale?'⚠️ ':'')+'Данные из 1С на '+clock
    +(info.srcAt?' — 1С обновляет их раз в час, продажи последнего часа сюда ещё не попали':'')
    +(stale?' · обмен давно не проходил, покажите это управляющему':'')+'</div>';
  if(info.closed===false) h+='<div style="font-size:11.5px;color:var(--amber);margin-top:.25rem">'
    +'День в 1С ещё не закрыт — сумма может дорасти. Уточнение программа '
    +'подтянет сама, переподтверждать не нужно.</div>';
  return h;
}

// '2026-07-31' → «пятница, 31 июля». Дата в карточке подтверждения
// должна читаться с одного взгляда: человек подтверждает конкретный день,
// а не «сегодня» вообще — задним числом это особенно важно.
function dayLabel(d){
  const p=d.split('-');
  return new Date(+p[0],+p[1]-1,+p[2])
    .toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
}
// «31 июля, пятница» — день недели отдельно, чтобы не ломать падеж
// в обороте «продажи за 31 июля»
function dayFull(d){
  const p=d.split('-');
  const w=new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('ru-RU',{weekday:'long'});
  return dayLabel(d)+', '+w;
}

// Страница сама подтягивает свежие цифры, пока открыта. Обмен идёт раз
// в 15 минут, но человек держит вкладку открытой всю смену и на статичную
// страницу смотрит как на живую — так и рождается «показывает те же
// продажи, что и два часа назад».
let _enterTimer=null;
function enterAutoRefresh(){
  if(_enterTimer) return;
  _enterTimer=setInterval(()=>{
    if(_page!=='pgEnter'||document.hidden) return;
    // Не мешаем, пока человек жмёт «Подтвердить»
    if(document.querySelector('#content button[disabled]')) return;
    pgEnter(true);
  },120000);

window.saveEntry=async function(){
  const date=document.getElementById('ed').value;
  const sales=parseFloat(document.getElementById('es').value)||0;
  const checks=parseInt(document.getElementById('ec').value)||0;
  const units=parseInt(document.getElementById('eu').value)||0;
  const returns=parseFloat(document.getElementById('er')?.value)||0;
  const shut=closedGuard(date);
  if(shut){sayClosed(shut,'emsg');return}
  const bad=validateEntry({date,sales,checks,units,returns});
  if(bad){
    const m=document.getElementById('emsg');
    if(m){m.style.cssText='';m.className='alert ae';m.textContent='⛔ '+bad}else alert(bad);
    return;
  }
  // ГРАФИК: не даём вводить продажи, пока график на месяц не заполнен
  L(true);
  const selfSt=await schGuardSelf(CU.id,date);
  if(selfSt.st==='block'){
    L(false);
    const m0=document.getElementById('emsg');
    const txt='⛔ Вас нет в графике на '+date
      +(selfSt.why&&selfSt.why!=='нет'?' — стоит «'+selfSt.why+'»':'')
      +'. Попросите управляющего поставить смену — после этого продажи сохранятся.';
    if(m0){m0.style.cssText='';m0.className='alert ae';m0.textContent=txt}else alert(txt);
    return;
  }
  const schSt=await schGuard(CU.shop);
  await apiPost('saveSale',{uid:CU.id,date,sales,checks,units,returns});
  logAction('saveSale',CU.name,date,{sales,checks,units,returns});
  // ГРАФИК: помечаем факт смены. Ошибка здесь не должна ломать сохранение продаж.
  schMarkActual(CU.id,date,CU.shop).catch(e=>schMarkFailed(CU.id,date,e.message));
  _sales=await api('getSales',{uid:CU.id});
  L(false);
  const m=document.getElementById('emsg');
  m.style.cssText='';
  if(schSt.st==='soft'){
    schSayGuard(schSt,true,date);   // сохранено, но график впереди дырявый
  }else{
    m.className='alert as';m.textContent=`✓ Сохранено за ${date}`;
  }
  document.getElementById('es').value='';
  document.getElementById('ec').value='';
  document.getElementById('eu').value='';
  document.getElementById('er').value='';
  setTimeout(()=>{m.textContent='';m.style.cssText=''},schSt.st==='soft'?7000:3000);
}

window.loadHist=async function(){
  const mk=document.getElementById('hm').value;
  const body=document.getElementById('hbody');
  body.innerHTML='<div class="spin" style="margin:1rem auto;display:block"></div>';
  L(true);
  _sales=await api('getSales',{uid:CU.id});
  let pend=[];
  try{
    pend=await schFetch('/sales_pending?select=*&uid=eq.'+encodeURIComponent(CU.id)
      +'&order=date.desc')||[];
  }catch(e){}
  L(false);

  // Сводим подтверждённое и ждущее в один список по датам месяца
  const byDate={};
  getEntriesFor(CU.id,mk).forEach(e=>{byDate[normDate(e.date)]={done:e}});
  pend.filter(r=>normDate(r.date).startsWith(mk)).forEach(r=>{
    const d=normDate(r.date);
    (byDate[d]=byDate[d]||{}).wait=r.confirmed_at?null:r;
    if(r.confirmed_at)(byDate[d]=byDate[d]||{}).confirmedAt=r.confirmed_at;
  });
  const dates=Object.keys(byDate).sort().reverse();
  if(!dates.length){body.innerHTML='<div style="color:var(--muted)">Записей за этот месяц нет</div>';return}

  const S=sumEntries(getEntriesFor(CU.id,mk));
  const waiting=dates.filter(d=>byDate[d].wait).length;
  // Править продажи может только бухгалтер и главный администратор —
  // на случай спешки в день выдачи зарплаты. Продавцу и управляющему
  // цифры менять нельзя: они приходят из 1С.
  const mayEdit=CU.role==='accountant'||CU.role==='admin';

  let h='';
  if(waiting) h+='<div class="alert" style="background:var(--al);color:var(--amber)">'
    +'⏳ Не подтверждено дней: <b>'+waiting+'</b>. Пока не подтвердите — они не идут в зарплату.</div>';
  h+='<div class="g4" style="margin-bottom:1rem">'
    +'<div class="metric"><div class="ml">Продажи</div><div class="mv">'+fmt(S.net)+'</div></div>'
    +'<div class="metric"><div class="ml">Чеков</div><div class="mv">'+fmtN(S.checks)+'</div></div>'
    +'<div class="metric"><div class="ml">Позиций</div><div class="mv">'+fmtN(S.units)+'</div></div>'
    +'<div class="metric"><div class="ml">Смен</div><div class="mv">'
      +fmtSh(schShifts(CU.id,getEntriesFor(CU.id,mk)))+'</div></div></div>';
  h+='<div class="tw-wrap"><table><tr><th>Дата</th><th>Продажи</th><th>Возврат</th><th>Итого</th>'
    +'<th>Чеков</th><th>Позиций</th><th>Ср. чек</th><th>Статус</th></tr>';
  dates.forEach(d=>{
    const r=byDate[d], e=r.done, w=r.wait;
    // Если день ждёт подтверждения — показываем цифры из 1С: именно они
    // применятся при нажатии кнопки, даже если запись уже есть.
    const src=w||e;
    const sales=+((src||{}).sales||0), ret=+((src||{}).returns||0);
    const ch=+((src||{}).checks||0), un=+((src||{}).units||0);
    const net=Math.max(0,sales-ret);
    let st;
    if(w) st='<button class="btn bsm bp" onclick="confirmDay(\''+d+'\',this)">Подтвердить</button>';
    else if(e&&String(e.source||'')==='1c') st='<span class="tag ts">подтверждено</span>';
    else st='<span class="tag ti">внесено вручную</span>';
    h+='<tr'+(w?' style="background:var(--al)"':'')+'>'
      +'<td>'+d+'</td><td>'+fmt(sales)+'</td>'
      +'<td style="color:var(--red)">'+(ret>0?'−'+fmt(ret):'—')+'</td>'
      +'<td><b>'+fmt(net)+'</b></td><td>'+fmtN(ch)+'</td><td>'+fmtN(un)+'</td>'
      +'<td>'+(ch>0?fmt(net/ch):'—')+'</td><td>'+st+'</td></tr>';
  });
  h+='</table></div>';
  if(!mayEdit) h+='<div style="font-size:12px;color:var(--muted);margin-top:.75rem">'
    +'Цифры приходят из 1С и не редактируются. Если что-то не сходится — скажите управляющему.</div>';
  body.innerHTML=h;
}

window.loadRating=async function(){
  const mk=document.getElementById('rm').value;

  L(true);
  const bundle=await api('getBundle',{mk});

  L(false);

  // Сводки/Начисления, где управляющий видит только свой магазин).
  const sellers=USERS.filter(u=>u.role==='seller');
  const rows=sellers.map(u=>{
    const entries=getEntriesFor(u.id,mk);
    const {checks:tc,units:tu,returns:tr,net:ts}=sumEntries(entries);
    const avg=tc>0?ts/tc:0;
    const upt=tc>0?tu/tc:0;
    const plan=getPlan(u.id,mk);
    const pct=plan>0?ts/plan:0;
    return{id:u.id,name:u.name,shop:u.shop,ts,avg,upt,pct,isMe:u.id===CU.id};
  });
  if(sortBy==='avg') rows.sort((a,b)=>b.avg-a.avg);

  else rows.sort((a,b)=>b.ts-a.ts);

    html+=`<tr ${trStyle}>

      <td>${esc(r.name)}${r.isMe?" <span class='tag ti'>Вы</span>":""}</td>

  });

  document.getElementById('rbody').innerHTML=html;

window.loadReport=async function(forceRefresh){
  const mk=document.getElementById('repMk').value;
  L(true);
  const bundle=await api('getBundle',{mk,needShopStats:1,forceRefresh:forceRefresh?1:0});
  _sales=bundle.sales;_plans=bundle.plans;PARAMS=bundle.params;window._shopStats=bundle.shopStats;
  L(false);
  const uaEl=document.getElementById('repUpdatedAt');
  if(uaEl) uaEl.textContent=fmtUpdatedAt(bundle.shopStatsUpdatedAt);
  const sellers=getVisibleSellers();
  await schLoadWeights(mk,sellers.map(u=>u.id)); // ГРАФИК: коэффициенты смен

  const byShop={};
  sellers.forEach(u=>{
    if(!byShop[u.shop])byShop[u.shop]=[];
    const ents=getEntriesFor(u.id,mk);
    const {checks:tc,units:tu,returns:tr,net:ts}=sumEntries(ents);
    const actualShifts=schShifts(u.id,ents);
    const plan=getPlan(u.id,mk);
    const pct=plan>0?ts/plan:0;
    const ss=(window._shopStats||{})[u.shop]||{pct:0,plan:0};
    const shopMet=ss.plan>0&&ss.fact>=ss.plan;
    const zp=calcZPActual(ts,tc,tu,pct,actualShifts,shopMet);
    byShop[u.shop].push({...u,ts,tc,tu,plan,pct,zp:zp.total,actualShifts,shopMet,shopPlan:ss.plan,shopFact:ss.fact,shopPct:ss.pct});
  });
  // Shop plan summary block
  let html='';
  const shopStatsFiltered = CU.role==='manager' ? Object.fromEntries(Object.entries(window._shopStats||{}).filter(([s])=>s===CU.shop)) : (window._shopStats||{});
  const shopSummaryRows=Object.keys(shopStatsFiltered);
  if(shopSummaryRows.length>0){
    html+=`<div class="card" style="margin-bottom:1rem">
      <div class="ct">План / Факт по магазинам</div>
      <div class="tw-wrap"><table>
        <tr><th>Магазин</th><th>Консультанты</th><th>Остальное</th><th>Итого факт</th><th>План</th><th>%</th></tr>
        ${Object.entries(shopStatsFiltered).map(([shop,ss])=>`<tr>
          <td><b>${shop}</b></td>
          <td>${fmt(ss.consultants!==undefined?ss.consultants:ss.fact)}</td>
          <td>${fmt(ss.other||0)}</td>
          <td><b>${fmt(ss.fact)}</b></td>
          <td>${ss.plan?fmt(ss.plan):"—"}</td>
          <td style="color:${barCol(ss.pct)};font-weight:700">${ss.plan?Math.round(ss.pct*100)+"%":"—"}</td>
        </tr>`).join("")}
      </table></div>
    </div>`;
  }
  Object.entries(byShop).forEach(([shop,rows])=>{
    rows.sort((a,b)=>b.pct-a.pct);
    let shopTotal=0;
    html+=`<div class="card"><div class="ct">${shop}</div>
      <div class="tw-wrap"><table>
      <tr><th>Продавец</th><th>Продажи</th><th>План</th><th>%</th><th>Смен</th><th>Ср.чек</th><th>UPT</th><th>ЗП</th><th>Ранг</th></tr>`;
    rows.forEach(r=>{
      shopTotal+=r.ts;
      const avg=r.tc>0?r.ts/r.tc:0;const upt=r.tc>0?r.tu/r.tc:0;
      html+=`<tr>
        <td>${esc(r.name)}</td><td>${fmt(r.ts)}</td><td>${r.plan?fmt(r.plan):'—'}</td>
        <td style="color:${barCol(r.pct)};font-weight:700">${Math.round(r.pct*100)}%</td>
        <td>${fmtSh(r.actualShifts)}</td>
        <td>${avg>0?fmt(avg):'—'}</td><td>${upt>0?upt.toFixed(2):'—'}</td>
        <td style="font-weight:700;color:var(--blue)">${fmt(r.zp)}</td>
        <td>${rankChip(r.pct)}</td>
      </tr>`;
    });
    html+=`</table></div>
      <div style="font-size:13px;color:var(--muted);margin-top:8px">Итого продаж: <b style="color:var(--text)">${fmt(shopTotal)}</b></div>
    </div>`;
  });
  document.getElementById('repBody').innerHTML=html||'<div style="color:var(--muted)">Нет данных</div>';
  renderNotConfirmed();
}

// Массовое подтверждение смен — для тех же случаев, что и массовое
// подтверждение продаж: пока люди привыкают отмечаться, в конце месяца
// кто-то должен закрыть хвосты одним движением. Только гл. админ.
window.confirmAllShifts=async function(){
  const mk=document.getElementById('payMk').value;
  const shut=closedGuard(mk); if(shut){alert('🔒 '+shut);return}
  let rows=[];
  try{
    rows=await schFetch('/runner_shifts?select=uid,date,ended_at&status=eq.pending'
      +'&date=gte.'+mk+'-01&date=lte.'+mk+'-31')||[];
  }catch(e){ alert('Не удалось получить смены: '+e.message); return; }
  if(!rows.length){ alert('Смен на проверке за этот месяц нет'); return; }
  const noEnd=rows.filter(r=>!r.ended_at).length;
  if(!confirm('Подтвердить смен: '+rows.length+' за '+mk+'?'
    +(noEnd?'\n\nИз них не закрыто (нет ухода): '+noEnd+' — они будут подтверждены, но оплачены нулём.':'')
    +'\n\nКасается раннеров, склада и менеджера интернет-магазина.'))return;
  L(true);
  let ok=0, failed=0;
  for(const r of rows){
    try{
      await schFetch('/runner_shifts?uid=eq.'+encodeURIComponent(r.uid)
        +'&date=eq.'+normDate(r.date),
        {method:'PATCH',body:JSON.stringify({status:'ok',
          decided_at:new Date().toISOString(),
          decided_by:CU.name+' (подтверждено массово)'})});
      ok++;
    }catch(e){ failed++; }
  }
  L(false);
  logAction('confirmAllShifts',CU.name,mk,{ok,failed});

// Пока месяц считается, его можно переключить ещё раз. Тогда две загрузки
// идут одновременно и на экран попадает та, что финишировала последней, —
// а это не обязательно выбранный месяц. Отсюда и «начисление не обновилось,
// помогает переключить туда-обратно». Метка поколения гасит опоздавших.
// Секундомер по этапам. Пока он есть, «долго грузится» перестаёт быть
// ощущением и становится числом: видно, какой именно шаг съедает время.
// Итог виден в шапке начисления, разбивка — в консоли браузера.
let _tmr=null;
function tmrStart(){ _tmr={t0:performance.now(),last:performance.now(),steps:[]}; }
function tmrMark(name){
  if(!_tmr)return;
  const now=performance.now();
  _tmr.steps.push([name,Math.round(now-_tmr.last)]);
  _tmr.last=now;
}
function tmrEnd(){
  if(!_tmr)return 0;
  const total=Math.round(performance.now()-_tmr.t0);
  console.log('Начисление: '+total+' мс = '+_tmr.steps.map(x=>x[0]+' '+x[1]).join(', '));
  const el=document.getElementById('payTiming');
  if(el){
    el.textContent='загружено за '+(total/1000).toFixed(1)+' с';
    el.title=_tmr.steps.map(x=>x[0]+': '+x[1]+' мс').join(String.fromCharCode(10));
  }
  _tmr=null; return total;
}

// ══════════════════════════════════════════════════════════
//  РАННЕР
//  Платим за отработанное время, а не за продажи. Смена — 8 часов
//  и стоит 6 000 ₸; отработал меньше — пропорционально с шагом
//  15 минут, больше — всё равно одна смена.
// ══════════════════════════════════════════════════════════
const RUNNER_DEFAULTS={rate:6000,hours:8,step:15};
// Длина смены и шаг округления общие для всех повременных должностей:
// разными они не бывают, а настройка под несуществующий случай мешает.
function runnerCfg(role){
  const c=POSITIONS[role||'runner']||POSITIONS.runner;
  return {
    rate: parseFloat(PARAMS[c.rateKey])   || c.rateDef || 0,
    oklad:parseFloat(PARAMS[c.okladKey])  || c.okladDef|| 0,
    pct:  parseFloat(PARAMS[c.pctKey])    || c.pctDef  || 0,
    hours:parseFloat(PARAMS.runnerHours)  || RUNNER_DEFAULTS.hours,
    step: parseFloat(PARAMS.runnerStepMin)|| RUNNER_DEFAULTS.step,
    pay:c.pay, mark:c.mark, label:c.label, plural:c.plural, icon:c.icon
  };
}
// Минуты между отметками, округлённые к БЛИЖАЙШЕМУ шагу.
// К ближайшему, а не вниз: опоздание на семь минут не должно стоить
// денег, но и лишних восьми минут дарить незачем.
function runnerMinutes(r){
  if(!r||!r.started_at||!r.ended_at)return 0;
  const ms=new Date(r.ended_at)-new Date(r.started_at);
  if(!(ms>0))return 0;
  const step=runnerCfg().step;
  return Math.round(ms/60000/step)*step;
}
// Больше полной смены не платим: смена одна, сколько бы человек ни пробыл.
function runnerShare(min){ return Math.min(1,min/(runnerCfg().hours*60)); }
// Итог по списку смен. Раньше этот подсчёт был выписан в истории, в своей
// ЗП, в начислении и в графике — четыре копии одной арифметики про деньги.
function runnerTotals(rows,role){
  const cfg=runnerCfg(role);
  const t={min:0,pay:0,shifts:0,full:0,part:0,waiting:0,waitPay:0,days:{}};
  (rows||[]).forEach(r=>{
    if(r.status==='rejected')return;
    const m=runnerMinutes(r), sh=runnerShare(m), pay=runnerPay(m,role);
    t.min+=m; t.pay+=pay;
    // Окладнику день засчитывается целиком: он не почасовик, и уход на час
    // раньше не должен стоить ему доли оклада. Почасовому — по времени.
    // Забыл отметить уход — день всё равно его: оплата не зависит от часов,
    // а требовать вторую кнопку под угрозой потери дня оклада — нечестно.
    t.shifts+=cfg.pay==='shift'?sh:((m>0||r.started_at)?1:0);
    t.days[normDate(r.date)]=m;
    if(sh>=1)t.full++; else if(m>0)t.part++;
    if(r.status==='pending'){t.waiting++; t.waitPay+=pay}
  });
  if(cfg.pay==='oklad'){ t.pay=okladPay(t.shifts,role); }
  return t;
}
function runnerPay(min,role){
  const cfg=runnerCfg(role);
  return cfg.pay==='shift'?runnerShare(min)*cfg.rate:okladPay(min>0?1:0,role||'runner');
}
function hhmm(min){
  const m=Math.max(0,Math.round(min));
  return Math.floor(m/60)+' ч '+String(m%60).padStart(2,'0')+' мин';
}
function clockOf(ts){
  if(!ts)return '—';
  const d=new Date(ts);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

async function runnerFetch(uid,from,to){
  let q='/runner_shifts?select=*&uid=eq.'+encodeURIComponent(uid);
  if(from)q+='&date=gte.'+from;
  if(to)  q+='&date=lte.'+to;
  try{ return await schFetch(q+'&order=date.desc')||[]; }catch(e){ return []; }
}

window.pgRunner=async function(){
  nav('pgRunner');setTitle('Смена');setBadge('');
  setContent('<div style="padding:2rem;text-align:center"><div class="spin"></div></div>');
  const today_=today();
  const rows=await runnerFetch(CU.id,schAddDays(today_,-7),today_);
  const mine=rows.find(r=>normDate(r.date)===today_)||null;
  // Незакрытая смена за прошлый день важнее сегодняшней кнопки: пока
  // она висит, новую начинать нельзя — иначе два открытых дня подряд.
  const stuck=rows.find(r=>!r.ended_at&&normDate(r.date)!==today_)||null;
  const cfg=runnerCfg(CU.role);

  if(stuck){
    setContent('<div class="card" style="max-width:520px;border-color:var(--amber)">'
      +'<div class="ct">⚠️ Не закрыта смена за '+dayFull(normDate(stuck.date))+'</div>'
      +'<div class="alert" style="background:var(--al);color:var(--amber);font-size:12.5px">'
      +'Вы начали смену в '+clockOf(stuck.started_at)+' и не завершили её. '
      +'Закройте её, тогда можно будет начать новую.</div>'
      +'<button class="btn bp bbl" onclick="runnerEnd(this,\''+normDate(stuck.date)+'\')">'
      +'■ Завершить смену за '+dayLabel(normDate(stuck.date))+'</button>'
      +'<div id="rmsg" style="margin-top:8px"></div></div>');
    return;
  }

  let h='';
  if(!mine){
    h='<div class="card" style="max-width:520px">'
      +'<div class="ct">'+dayFull(today_)+'</div>'
      +'<div class="rclock" style="color:var(--muted)">— : —</div>'
      +'<div class="rsince">Смена ещё не начата</div>'
      +'<button class="btn bbl" style="background:var(--green);color:#fff;border-color:var(--green);'
      +'padding:1.15rem;font-size:16px;font-weight:600" onclick="runnerStart(this)">▶ Начать смену</button>'
      +'<div id="rmsg" style="margin-top:8px"></div>'
      +'<div class="rnote">Нажмите, когда пришли. Время отметится само.</div></div>';
  }else if(!mine.ended_at){
    h='<div class="card" style="max-width:520px;border-color:var(--green)">'
      +'<div class="ct">'+dayFull(today_)+'</div>'
      +'<div class="rclock" id="rtick" style="color:var(--green)">…</div>'
      +'<div class="rsince" id="rsince">с '+clockOf(mine.started_at)+'</div>'
      +'<div class="zpr"><span>Полная смена с</span><b>'
        +clockOf(new Date(new Date(mine.started_at).getTime()+cfg.hours*3600000))+'</b></div>'
      +'<div class="zpr"><span>Заработано сейчас</span><b id="rpay">—</b></div>'
      +'<button class="btn bbl" style="background:var(--red);color:#fff;border-color:var(--red);'
      +'padding:1.15rem;font-size:16px;font-weight:600;margin-top:1rem" '
      +'onclick="runnerEnd(this)">■ Завершить смену</button>'
      +'<div id="rmsg" style="margin-top:8px"></div>'
      +'<div class="rnote">Если забудете завершить — программа закроет смену сама '
      +'через '+cfg.hours+' часов и отправит день управляющему на проверку.</div></div>';
  }else{
    const min=runnerMinutes(mine);
    h='<div class="card" style="max-width:520px">'
      +'<div class="ct">✓ Смена за '+dayFull(today_)+' закрыта</div>'
      +'<div class="zpr"><span>Пришёл</span><b>'+clockOf(mine.started_at)+'</b></div>'
      +'<div class="zpr"><span>Ушёл</span><b>'+clockOf(mine.ended_at)+'</b></div>'
      +'<div class="zpr"><span>Отработано</span><b>'+hhmm(min)
        +(runnerShare(min)>=1?' → полная смена':'')+'</b></div>'
      +'<div class="zpr"><span>Начислено за день</span><b>'+fmt(Math.round(runnerPay(min,CU.role)))+'</b></div>'
      +'<button class="btn bbl" style="margin-top:1rem" onclick="runnerEditDlg(\''+today_+'\')">'
      +'✎ Поправить время</button>'
      +'<div id="rmsg" style="margin-top:8px"></div>'
      +'<div class="rnote">Правка уйдёт управляющему на проверку. В зарплату день '
      +'попадёт сразу, но пока не подтвердят — сумма ещё может измениться.</div></div>';
  }
  setContent(h);

  if(mine&&!mine.ended_at){
    const tick=()=>{
      const el=document.getElementById('rtick');
      if(!el){clearInterval(_runTimer);_runTimer=null;return}
      const raw=(Date.now()-new Date(mine.started_at))/60000;
      el.textContent=hhmm(raw);
      // Бегущую сумму округляем тем же шагом, что и при закрытии смены:
      // иначе человек весь день видит одно число, а получит другое.
      const pay=document.getElementById('rpay');
      if(pay)pay.textContent=fmt(Math.round(runnerPay(Math.round(raw/cfg.step)*cfg.step,CU.role)));
    };
    tick();
    _runTimer=setInterval(tick,30000);
  }
}

window.runnerStart=async function(btn){
  if(btn)btn.disabled=true;
  const now=new Date().toISOString(), date=today();
  L(true);
  try{
    await schFetch('/runner_shifts',{method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify([{uid:String(CU.id),date,started_at:now,orig_started_at:now,
        src:'self',status:'ok',updated_at:now}])});
  }catch(e){
    L(false);if(btn)btn.disabled=false;
    document.getElementById('rmsg').innerHTML='<div class="alert ae">Не удалось отметиться: '+esc(e.message)+'</div>';
    return;
  }
  L(false);
  pgRunner();
}

window.runnerEnd=async function(btn,date){
  const d=date||today();
  if(btn)btn.disabled=true;
  const now=new Date().toISOString();
  L(true);
  try{
    await schFetch('/runner_shifts?uid=eq.'+encodeURIComponent(CU.id)+'&date=eq.'+d,
      {method:'PATCH',body:JSON.stringify({ended_at:now,orig_ended_at:now,updated_at:now})});
    // Смена закрыта — в графике появляется факт, как у продавца после
    // подтверждения продаж.
    schMarkActual(CU.id,d,CU.shop,'runner').catch(e=>schMarkFailed(CU.id,d,e.message));
  }catch(e){
    L(false);if(btn)btn.disabled=false;
    document.getElementById('rmsg').innerHTML='<div class="alert ae">Не удалось завершить: '+esc(e.message)+'</div>';
    return;
  }
  L(false);
  pgRunner();
}


// ── ИСТОРИЯ ВЫХОДОВ РАННЕРА ──
// Дни, где по графику смена стояла, а отметки нет, показываем красным
// и даём добавить: программа не знает, что человек приходил, если он
// не нажал кнопку, — угадывать за него нельзя, а напомнить нужно.
function runnerStatusTag(r){
  if(r.status==='pending') return '<span class="tag tw">на проверке</span>';
  if(r.status==='rejected')return '<span class="tag td">не засчитан</span>';
  if(r.src==='auto')       return '<span class="tag tw">закрыто автоматом</span>';
  if(r.src==='manager')    return '<span class="tag ts">вписал управляющий</span>';
  return '<span class="tag ts">зачтено</span>';
}

window.loadRunnerHist=async function(){
  const mk=document.getElementById('rhm').value;
  const body=document.getElementById('rhbody');
  body.innerHTML='<div class="spin" style="margin:1rem auto;display:block"></div>';
  const from=mk+'-01', to=mk+'-31';
  const rows=await runnerFetch(CU.id,from,to);
  let plan=[];
  try{
    plan=await schFetch('/schedule?select=date,planned_point,actual_point&uid=eq.'
      +encodeURIComponent(CU.id)+'&date=gte.'+from+'&date=lte.'+to)||[];
  }catch(e){}

  const byDate={};
  rows.forEach(r=>byDate[normDate(r.date)]={row:r});
  // День с планом, но без отметки — только если он уже прошёл: ругаться
  // на завтрашнюю смену незачем.
  plan.forEach(pl=>{
    const d=normDate(pl.date);
    if(pl.planned_point&&!byDate[d]&&d<today()) byDate[d]={missing:true};
  });
  const dates=Object.keys(byDate).sort().reverse();
  if(!dates.length){body.innerHTML='<div style="color:var(--muted)">Выходов за этот месяц нет</div>';return}

  const T=runnerTotals(dates.map(d=>byDate[d].row).filter(Boolean),CU.role);
  const tMin=T.min, tPay=T.pay, tShifts=T.shifts, waiting=T.waiting;
  const miss=dates.filter(d=>byDate[d].missing).length;

  let h='';
  if(miss) h+='<div class="alert" style="background:var(--rl);color:var(--red)">'
    +'За '+miss+' дн. смена по графику была, а отметки нет. Добавьте время — '
    +'управляющий подтвердит.</div>';
  if(waiting) h+='<div class="alert" style="background:var(--al);color:var(--amber)">'
    +'⏳ Ждут проверки управляющего: '+waiting+' дн. В зарплату они уже вошли, '
    +'но сумма ещё может измениться.</div>';
  h+='<div class="g4" style="margin-bottom:1rem">'
    +'<div class="metric"><div class="ml">Смен</div><div class="mv">'+fmtSh(Math.round(tShifts*100)/100)+'</div></div>'
    +'<div class="metric"><div class="ml">Часов</div><div class="mv">'+hhmm(tMin)+'</div></div>'
    +'<div class="metric"><div class="ml">Начислено</div><div class="mv">'+fmt(Math.round(tPay))+'</div></div>'
    +'<div class="metric"><div class="ml">Ставка за смену</div><div class="mv">'+fmt(runnerCfg(CU.role).rate)+'</div></div>'
    +'</div>';
  h+='<div class="tw-wrap"><table><tr><th>Дата</th><th>Пришёл</th><th>Ушёл</th>'
    +'<th>Часов</th><th>Начислено</th><th>Статус</th><th></th></tr>';
  dates.forEach(d=>{
    const c=byDate[d];
    if(c.missing){
      h+='<tr style="background:var(--rl)"><td>'+dayLabel(d)+'</td>'
        +'<td colspan="4" style="color:var(--red)">по графику смена была, отметки нет</td>'
        +'<td></td><td><button class="btn bsm" onclick="runnerEditDlg(\''+d+'\')">+ добавить</button></td></tr>';
      return;
    }
    const r=c.row, m=runnerMinutes(r);
    const bg=r.status==='pending'?' style="background:var(--al)"'
            :r.status==='rejected'?' style="background:var(--rl)"':'';
    h+='<tr'+bg+'><td>'+dayLabel(d)+'</td>'
      +'<td>'+clockOf(r.started_at)+'</td>'
      +'<td>'+(r.ended_at?clockOf(r.ended_at):'<span style="color:var(--amber)">не закрыта</span>')+'</td>'
      +'<td>'+(m?hhmm(m):'—')+'</td>'
      +'<td><b>'+(r.status==='rejected'?'—':fmt(Math.round(runnerPay(m,CU.role))))+'</b></td>'
      +'<td>'+runnerStatusTag(r)+'</td>'
      +'<td><button class="btn bsm" onclick="runnerEditDlg(\''+d+'\')">✎</button></td></tr>';
  });
  h+='</table></div>';
  // Вписать пропущенный день. Нужно на входе в режим: люди начинают
  // отмечаться не с первого числа, а дни им уже отработаны. Запись
  // уходит управляющему на подтверждение — сама себе смену не поставишь.
  const lastDay=mk+'-'+String(daysInMk(mk)).padStart(2,'0');
  const maxD=[lastDay,today()].sort()[0];
  h+='<div style="border-top:1px dashed var(--border);margin-top:1rem;padding-top:1rem">'
    +'<div style="font-size:13px;margin-bottom:.5rem"><b>Забыли отметиться?</b> '
    +'Впишите день — управляющий его подтвердит.</div>'
    +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    +'<input type="date" id="rh-add" class="fc" style="width:auto" '
    +'min="'+mk+'-01" max="'+maxD+'" value="'+maxD+'">'
    +'<button class="btn bsm bp" onclick="runnerAddDay()">Вписать день</button>'
    +'<span id="rh-add-msg" style="font-size:12px;color:var(--red)"></span>'
    +'</div></div>';
  h+='<div style="font-size:12px;color:var(--muted);margin-top:.75rem">'
    +'Смена '+runnerCfg(CU.role).hours+' ч стоит '+fmt(runnerCfg(CU.role).rate)+'. Отработал меньше — '
    +'платим по времени с шагом '+runnerCfg(CU.role).step+' мин, больше — всё равно одна смена.</div>';
  body.innerHTML=h;
}

window.runnerAddDay=function(){
  const el=document.getElementById('rh-add'), msg=document.getElementById('rh-add-msg');

  if(msg)msg.textContent='';
  if(!d){ if(msg)msg.textContent='Выберите дату'; return; }

  const shut=closedGuard(d);
  if(shut){ if(msg)msg.textContent=shut; return; }
  runnerEditDlg(d);
}

// '2026-08-04' + '09:30' → метка времени по местным часам
function atTime(date,hm){
  if(!hm)return null;
  const [h,m]=hm.split(':').map(Number);
  const p=date.split('-').map(Number);
  return new Date(p[0],p[1]-1,p[2],h,m,0,0);
}

window.runnerSaveEdit=async function(date,btn){
  const msg=document.getElementById('re-msg');
  const hin=document.getElementById('re-in').value, hout=document.getElementById('re-out').value;
  if(!hin){msg.innerHTML='<span style="color:var(--red)">Укажите время прихода</span>';return}
  const st=atTime(date,hin);
  let en=hout?atTime(date,hout):null;
  // Ушёл раньше, чем пришёл — значит смена перевалила за полночь.
  if(en&&en<=st) en=new Date(en.getTime()+86400000);
  if(en&&(en-st)>16*3600000){
    msg.innerHTML='<span style="color:var(--red)">Больше 16 часов — проверьте время</span>';return;
  }
  if(btn)btn.disabled=true;
  L(true);
  const now=new Date().toISOString();
  const body={uid:String(CU.id),date,started_at:st.toISOString(),
    ended_at:en?en.toISOString():null,src:'runner',status:'pending',
    note:document.getElementById('re-note').value.trim()||null,
    edited_at:now,edited_by:CU.name,updated_at:now};
  try{
    await schFetch('/runner_shifts',{method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates'},body:JSON.stringify([body])});
    if(en) schMarkActual(CU.id,date,CU.shop,'runner').catch(()=>{});
    logAction('runnerEdit',CU.name,date,{s:hin,e:hout});
  }catch(e){
    L(false);if(btn)btn.disabled=false;
    msg.innerHTML='<span style="color:var(--red)">Не удалось: '+esc(e.message)+'</span>';return;
  }
  L(false);
  document.querySelectorAll('.ov').forEach(o=>o.remove());
  if(_page==='pgRunnerHist')loadRunnerHist(); else pgRunner();
}

// ── ПРОВЕРКА ПРАВОК РАННЕРА ──
// Раннер правит своё время сам, но каждая правка попадает сюда.
// Деньги при этом не ждут: день уже в зарплате, проверка лишь решает,
// останется он таким или изменится.



// Решение управляющего. Смысл каждого:
//   ok       — согласен с тем, что стоит сейчас
//   revert   — вернуть время, записанное программой
//   rejected — день не засчитывать вовсе
window.runnerDecide=async function(uid,date,what,btn){
  const shut=closedGuard(date);
  if(shut){alert('🔒 '+shut);return}
  if(what==='rejected'&&!confirm('Не засчитывать день '+dayLabel(date)+'?\n\n'
    +'Он пропадёт из зарплаты раннера.'))return;
  if(btn)btn.disabled=true;
  L(true);
  const now=new Date().toISOString();
  let body={status:'ok',decided_at:now,decided_by:CU.name,updated_at:now};
  if(what==='revert'){
    let r=null;
    try{
      const rows=await schFetch('/runner_shifts?select=*&uid=eq.'+encodeURIComponent(uid)+'&date=eq.'+date);
      r=rows&&rows[0];
    }catch(e){}
    if(!r||!r.orig_started_at){L(false);alert('Возвращать не к чему: своей отметки в этот день не было');return}
    body.started_at=r.orig_started_at;
    body.ended_at=r.orig_ended_at;
    body.src='self';
  }
  if(what==='rejected') body.status='rejected';
  try{
    await schFetch('/runner_shifts?uid=eq.'+encodeURIComponent(uid)+'&date=eq.'+date,
      {method:'PATCH',body:JSON.stringify(body)});
    // Не засчитали день — убираем и отметку в графике, иначе смена
    // останется закрашенной, хотя её не признали.
    if(what==='rejected'){
      await schFetch('/schedule?uid=eq.'+encodeURIComponent(uid)+'&date=eq.'+date
        +'&actual_source=eq.runner',
        {method:'PATCH',body:JSON.stringify({actual_point:null,actual_source:null})});
    }
    logAction('runnerDecide',uid,date,{what});
  }catch(e){
    L(false);if(btn)btn.disabled=false;alert('Не удалось: '+e.message);return;
  }
  L(false);
  loadPayroll();
}

// ── СТРИМЕР В НАЧИСЛЕНИИ ──
// Оклад по норме смен плюс доля от личных продаж. Ни планов, ни порогов,
// ни KPI: условия у стримера свои, и мерить его сеткой продавца нечестно.
function streamerPayrollHtml(mk,adjMap){
  const users=(CU.role==='admin'||CU.role==='accountant')
    ? USERS.filter(u=>u.role==='streamer')
    : USERS.filter(u=>u.role==='streamer'&&u.shop===CU.shop);
  if(!users.length)return '';
  const cfg=runnerCfg('streamer');
  let h='<div class="card"><div class="ct">'+cfg.icon+' '+cfg.plural+' — '
    +fmt(cfg.oklad)+' оклад при норме '+fmtSh(okladNorm('streamer'))+' смен и '
    +(cfg.pct*100).toFixed(2).replace(/\.?0+$/,'')+'% от личных продаж</div>'
    +'<div class="tw-wrap"><table><tr><th>Сотрудник</th><th>Магазин</th><th>Смен</th>'
    +'<th>Продажи</th><th>Оклад</th><th>% от продаж</th><th>Начислено</th>'
    +'<th>Премия</th><th>Удержания</th><th>К выплате</th><th></th></tr>';
  users.forEach(u=>{
    const ents=getEntriesFor(u.id,mk);
    const sales=sumEntries(ents).net;
    const adj=adjMap[u.id]||{};
    const shifts=effShifts(adj,schShifts(u.id,ents));
    const oklad=okladPay(shifts,'streamer');
    const pct=cfg.pct*sales;
    const accrued=oklad+pct;
    const ded=(+adj.advance||0)+(+adj.pension||0)+(+adj.ipn||0)+(+adj.vosms||0)+(+adj.fines||0);
    const bonus=+adj.bonus||0;
    const payout=Math.round(accrued)-ded+bonus;
    window._payrollRows.push({kind:'clock',role:cfg.label,name:u.name,shop:u.shop,
      shifts,hours:0,accrued:Math.round(accrued),
      advance:+adj.advance||0,pension:+adj.pension||0,ipn:+adj.ipn||0,
      vosms:+adj.vosms||0,fines:+adj.fines||0,
      bonus,bonusNote:adj.bonus_note||'',payout});
    h+='<tr><td><b>'+esc(u.name)+'</b></td><td>'+esc(u.shop||'—')+'</td>'
      +'<td>'+fmtSh(Math.round(shifts*100)/100)+'</td>'
      +'<td>'+fmt(sales)+'</td><td>'+fmt(Math.round(oklad))+'</td>'
      +'<td>'+fmt(Math.round(pct))+'</td><td>'+fmt(Math.round(accrued))+'</td>'
      +'<td>'+(bonus>0?fmt(bonus):'—')+'</td>'
      +'<td style="color:var(--red)">'+(ded>0?'−'+fmt(ded):'—')+'</td>'

// ── РАННЕРЫ В НАЧИСЛЕНИИ ──
// Отдельным блоком, потому что сетка у них другая: ни планов, ни процентов,
// ни KPI. Штрафы, авансы и премии — те же, что у всех.
async function runnerPayrollHtml(mk,adjMap){
  // Раннер, зав. складом, кладовщик и менеджер ИМ отмечаются одинаково,
  // поэтому и считаются одним кодом. Но таблица у каждого своя: ставки
  // разные, и складывать их в одну колонку значило бы врать.
  const pick=r=>(CU.role==='admin'||CU.role==='accountant')
    ? USERS.filter(u=>u.role===r)
    : USERS.filter(u=>u.role===r&&u.shop===CU.shop);
  const groups=CLOCK_ROLES.map(r=>({role:r,users:pick(r)})).filter(g=>g.users.length);
  if(!groups.length)return '';
  const runners=groups.reduce((a,g)=>a.concat(g.users),[]);
  let all=[];
  try{
    all=await schFetch('/runner_shifts?select=*&uid=in.'
      +encodeURIComponent(schInList(runners.map(u=>u.id)))
      +'&date=gte.'+mk+'-01&date=lte.'+mk+'-31')||[];
  }catch(e){}

  let out='';
  groups.forEach(g=>{ out+=clockGroupHtml(g.role,g.users,all,mk,adjMap); });
  // Спорные дни — одной таблицей на всех: решать их в четырёх местах
  // значит не решить ни в одном.
  const pend=all.filter(r=>r.status==='pending');
  if(pend.length&&(CU.role==='manager'||CU.role==='admin'))
    out+='<div class="card">'+runnerPendingTableHtml(pend,runners)+'</div>';
  return out;
}

// Одна повременная должность: таблица начисления по ней.
function clockGroupHtml(role,users,all,mk,adjMap){
  const cfg=runnerCfg(role);
  let h='<div class="card"><div class="ct">'+cfg.icon+' '+cfg.plural+' — '
    +(cfg.pay==='shift'
        ? fmt(cfg.rate)+' за смену ('+cfg.hours+' ч)'
        : fmt(cfg.oklad)+' оклад при норме '+fmtSh(okladNorm(role))+' смен')+'</div>';
  let waitTotal=0, waitPay=0;
  const rows=users.map(u=>{
    const T=runnerTotals(all.filter(r=>String(r.uid)===String(u.id)),role);
    const adj=adjMap[u.id]||{};
    // Смены, вписанные бухгалтером, важнее расчётных.
    const sh=effShifts(adj,T.shifts);
    const min=T.min, wait=T.waiting;
    const pay=cfg.pay==='shift'?sh*cfg.rate:okladPay(sh,role);
    waitTotal+=wait; waitPay+=T.waitPay;
    const ded=(+adj.advance||0)+(+adj.pension||0)+(+adj.ipn||0)+(+adj.vosms||0)+(+adj.fines||0);
    const bonus=+adj.bonus||0;
    const payout=Math.round(pay)-ded+bonus;
    window._payrollRows.push({kind:'clock',role:cfg.label,name:u.name,shop:u.shop,
      // Смены НЕ округляем: в Excel по ним считается формула, и 2,69
      // вместо 2,6875 разошлось бы с программой на пятнадцать тенге.
      shifts:sh,hours:min/60,accrued:Math.round(pay),
      advance:+adj.advance||0,pension:+adj.pension||0,ipn:+adj.ipn||0,vosms:+adj.vosms||0,fines:+adj.fines||0,
      bonus,bonusNote:adj.bonus_note||'',payout});
    return {u,sh,min,pay,wait,adj,ded,bonus,payout};
  });

  if(waitTotal) h+='<div class="alert" style="background:var(--al);color:var(--amber)">'
    +'⏳ Не подтверждено дней: <b>'+waitTotal+'</b> на '+fmt(Math.round(waitPay))+'. '
    +'Они уже в суммах ниже — выплату не тормозим, но после проверки суммы могут измениться. '
    +'</div>';

  h+='<div class="tw-wrap"><table><tr><th>'+cfg.label+'</th><th>Магазин</th><th>Смен</th><th>Часов</th>'
    +'<th>Начислено</th><th>Премия</th><th>Удержания</th><th>К выплате</th><th></th></tr>';
  rows.forEach(r=>{
    h+='<tr'+(r.wait?' style="background:var(--al)"':'')+'>'
      +'<td><b>'+esc(r.u.name)+'</b>'
        +(r.wait?' <span class="tag tw">'+r.wait+' дн. на проверке</span>':'')+'</td>'
      +'<td>'+esc(r.u.shop||'—')+'</td>'
      +'<td>'+fmtSh(Math.round(r.sh*100)/100)+'</td>'
      +'<td>'+hhmm(r.min)+'</td>'
      +'<td>'+fmt(Math.round(r.pay))+'</td>'
      +'<td>'+(r.bonus>0?fmt(r.bonus):'—')+'</td>'
      +'<td style="color:var(--red)">'+(r.ded>0?'−'+fmt(r.ded):'—')+'</td>'
      +'<td style="font-weight:700;font-size:15px;color:var(--blue)">'+fmt(r.payout)+'</td>'
      +'<td style="white-space:nowrap">'
      +'<button class="btn bsm" title="Корректировка" onclick=\'openAdjust('
        +escAttr({uid:r.u.id,name:r.u.name,mk,realSales:0,role:role})+')\'>💵</button>'
      +'</td></tr>';
  });
  h+='</table></div>'
    +'<div style="font-size:12px;color:var(--muted);margin-top:.75rem">'
    +(cfg.pay==='shift'
        ? 'Полная смена — '+cfg.hours+' ч. Отработал меньше — платим по времени с шагом '
          +cfg.step+' мин, больше — всё равно одна смена.'
        : 'Оклад '+fmt(cfg.oklad)+' делится на норму '+fmtSh(okladNorm())
          +' смен и умножается на отработанные. Отмеченный день считается целым.')
    +' Дни, которые управляющий не засчитал, в суммы не входят.</div>';
  h+='</div>';
  return h;
}


// Спорные дни раннеров: правки, добавленные задним числом и смены,
// которые программа закрыла сама.
function runnerPendingTableHtml(rows,runners){
  if(!rows.length)return '';
  const byId={}; runners.forEach(u=>byId[u.id]=u);
  let h='<div style="border-top:1px solid var(--border);margin-top:1.25rem;padding-top:1rem">'
    +'<div class="ct">Разобрать спорные дни</div>'
    +'<div class="tw-wrap"><table><tr><th>Раннер</th><th>Дата</th><th>Было</th><th>Стало</th>'
    +'<th>Часов</th><th>Что случилось</th><th></th></tr>';
  rows.sort((a,b)=>String(b.date).localeCompare(String(a.date))).forEach(r=>{
    const u=byId[r.uid]||{name:r.uid};
    const d=normDate(r.date);
    const had=r.orig_started_at
      ? clockOf(r.orig_started_at)+' – '+(r.orig_ended_at?clockOf(r.orig_ended_at):'не закрыл')
      : 'отметки не было';
    const now=clockOf(r.started_at)+' – '+(r.ended_at?clockOf(r.ended_at):'не закрыта');
    const why=r.src==='auto'?'закрыто автоматом'
            :r.orig_started_at?'правка раннера':'добавил задним числом';
    const min=runnerMinutes(r);
    h+='<tr style="background:var(--al)">'
      +'<td>'+esc(u.name)+'</td><td>'+dayLabel(d)+'</td>'
      +'<td style="color:var(--muted);text-decoration:line-through">'+had+'</td>'
      +'<td style="color:var(--amber);font-weight:600">'+now+'</td>'
      +'<td>'+(min?hhmm(min):'—')+'<div style="font-size:11px;color:var(--muted)">'
        +fmt(Math.round(runnerPay(min,roleOf(r.uid))))+'</div></td>'
      +'<td>'+why+(r.note?'<div style="font-size:11px;color:var(--muted)">'+esc(r.note)+'</div>':'')+'</td>'
      +'<td style="white-space:nowrap">'
      +'<button class="btn bsm bp" title="Согласен" onclick="runnerDecide(\''+r.uid+'\',\''+d+'\',\'ok\',this)">✓</button> '
      +(r.orig_started_at&&r.orig_ended_at
        ?'<button class="btn bsm" title="Вернуть время, которое записалось само" '
         +'onclick="runnerDecide(\''+r.uid+'\',\''+d+'\',\'revert\',this)">↩ как было</button> ':'')
      +'<button class="btn bsm" title="Вписать своё время" '
      +'onclick="runnerOwnDlg(\''+r.uid+'\',\''+d+'\')">✎ своё</button> '
      +'<button class="btn bsm bd2" title="День не засчитать" '
      +'onclick="runnerDecide(\''+r.uid+'\',\''+d+'\',\'rejected\',this)">✕</button>'
      +'</td></tr>';
  });
  h+='</table></div>'
    +'<div style="font-size:12px;color:var(--muted);margin-top:.6rem">'
    +'«↩ как было» возвращает время, которое программа записала сама. '
    +'«✎ своё» — вписать, сколько человек действительно был. '
    +'«✕» — день не засчитывается вовсе. Любое решение попадает в журнал.</div></div>';
  return h;
}

// ── ПОДПИСЬ ГРАФИКА ──
// Ничего не блокирует. Нужна ровно для того, чтобы было видно,
// смотрел ли график живой человек, прежде чем платить по нему.
async function loadSignatures(mk){
  try{ return await schFetch('/schedule_signatures?select=*&mk=eq.'+mk)||[]; }
  catch(e){ return []; }
}
// Правка графика после подписи её не отменяет, но и молчать нельзя:
// подпись под устаревшими данными хуже отсутствия подписи.
async function schChangedAfter(mk,shop,since){
  try{
    const r=await schFetch('/schedule?select=uid&shop=eq.'+encodeURIComponent(shop)
      +'&date=gte.'+mk+'-01&date=lte.'+mk+'-31&updated_at=gt.'+encodeURIComponent(since)+'&limit=1');
    return Array.isArray(r)&&r.length>0;
  }catch(e){ return false; }
}

// В начислении — только состояние подписи. Подписывают в графике, глядя
// на клетки: подпись под столбцом сумм ничего не проверяет.
// Кто из магазинов не подписал график за месяц. Считаем один раз
// за отрисовку начисления: дальше эта карта нужна каждой шапке магазина.
let _unsignedShops=null;
async function loadUnsigned(mk){
  _unsignedShops=null;
  // Пока месяц идёт, подписывать нечего — и ругаться незачем.
  if(!mkEnded(mk))return;
  const sigs=await loadSignatures(mk);
  const has={}; sigs.forEach(x=>has[x.shop]=true);
  _unsignedShops={};
  const signable=SHOPS.filter(sh=>USERS.some(u=>u.role==='manager'&&u.shop===sh));
  signable.forEach(sh=>{if(!has[sh])_unsignedShops[sh]=true});
}
function unsignedMark(shop){
  return _unsignedShops&&_unsignedShops[shop]
    ? ' <span class="tag td" title="График за этот месяц никто не подписал">'
      +'⚠️ график не подписан</span>' : '';
}

async function signatureWarnHtml(mk){
  const shops=(CU.role==='manager')?[CU.shop]
    :SHOPS.filter(sh=>USERS.some(u=>u.role==='manager'&&u.shop===sh));
  const sigs=await loadSignatures(mk);
  const by={}; sigs.forEach(x=>by[x.shop]=x);
  const unsigned=shops.filter(sh=>!by[sh]);
  let h='<div class="card"><div class="ct">✍️ Подпись графика за '
    +new Date(mk+'-01').toLocaleDateString('ru-RU',{month:'long',year:'numeric'})+'</div>';
  if(unsigned.length) h+='<div class="alert" style="background:var(--al);color:var(--amber)">'
    +'⚠️ График не подписан: <b>'+unsigned.join(', ')+'</b>. '
    +'Выплату это не задерживает, но подтвердить его кто-то должен — '
    +'<a href="#" onclick="pgSchedule();return false" style="color:var(--bd)">открыть график →</a></div>';
  h+='<div class="tw-wrap"><table><tr><th>Магазин</th><th>Подпись</th></tr>';
  for(const sh of shops){
    const g=by[sh];
    let cell='<span style="color:var(--amber)">не подписан</span>';
    if(g){
      const stale=await schChangedAfter(mk,sh,g.signed_at);
      cell='<span class="tag ts">подписан</span> '+esc(g.signed_by)+', '
        +new Date(g.signed_at).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})
        +' '+clockOf(g.signed_at)
        +(stale?'<div style="font-size:11px;color:var(--amber)">после этого график менялся</div>':'');
    }
    h+='<tr><td>'+esc(sh)+'</td><td>'+cell+'</td></tr>';
  }
  h+='</table></div></div>';
  return h;
}

window.schSign=async function(mk,shop,on,btn){
  if(CU.role!=='manager'&&CU.role!=='admin'){alert('Подписывать может управляющий или главный администратор');return}
  if(!on&&!confirm('Снять подпись с графика «'+shop+'»?'))return;
  if(btn)btn.disabled=true;
  L(true);
  try{
    if(on){
      await schFetch('/schedule_signatures',{method:'POST',
        headers:{'Prefer':'resolution=merge-duplicates'},
        body:JSON.stringify([{mk,shop,signed_at:new Date().toISOString(),signed_by:CU.name}])});
    }else{
      await schFetch('/schedule_signatures?mk=eq.'+mk+'&shop=eq.'+encodeURIComponent(shop),
        {method:'DELETE'});
    }
    logAction(on?'schSign':'schUnsign',null,shop,{mk});
  }catch(e){
    L(false);if(btn)btn.disabled=false;alert('Не удалось: '+e.message);return;
  }
  L(false);
  if(_page==='pgPayroll')loadPayroll(); else pgSchedule();
}

let _rpt={date:null,shop:null,row:null,tasks:[],returns:[],check:{}};

// Факт магазина за день из обмена с 1С
async function rptFact(shop,date){
  try{
    const r=await schFetch('/shop_sales?select=fact,checks,units&shop=eq.'
      +encodeURIComponent(shop)+'&date=eq.'+date);
    return (r&&r[0])||null;
  }catch(e){ return null; }
}
// Накопление за месяц и план магазина — чтобы показать процент,
// как показывала таблица.
async function rptMonth(shop,date){
  const mk=date.slice(0,7);
  let fact=0;
  try{
    const rows=await schFetch('/shop_sales?select=fact&shop=eq.'+encodeURIComponent(shop)
      +'&date=gte.'+mk+'-01&date=lte.'+date)||[];
    rows.forEach(r=>fact+=+r.fact||0);
  }catch(e){}
  const plan=(_plans||[]).find(p=>p.uid==='shop_'+shop&&p.mk===mk);
  return {fact,plan:plan?+plan.amount||0:0};
}
// Сколько человек по графику стоит в этот день
function rptStaff(shop,date){
  return USERS.filter(u=>u.shop===shop&&STAFF_ROLES.indexOf(u.role)>=0)
    .filter(u=>{const r=_sch[u.id+'|'+date];return r&&(r.planned_point||r.actual_point)}).length;
}

function rptCalc(){
  const rev=parseFloat(String(document.getElementById('rp-rev').value).replace(/\s/g,''))||0;
  const chk=parseInt(document.getElementById('rp-chk').value)||0;
  const vis=parseInt(document.getElementById('rp-vis').value)||0;
  document.getElementById('rp-avg').value=chk>0?fmtN(Math.round(rev/chk)):'—';
  document.getElementById('rp-conv').textContent=vis>0?((chk/vis)*100).toFixed(1)+'%':'—';
}

function rptRenderCheck(){
  let h='',done=0,total=0;
  RPT_SECTIONS.forEach(sec=>{
    h+='<div style="margin-top:.75rem;font-size:12px;font-weight:700;color:'+sec.color+'">'
      +sec.icon+' '+esc(sec.title)+'</div>';
    sec.items.forEach(it=>{
      total++;
      const st=_rpt.check[it.id]||{};
      if(st.checked)done++;
      h+='<div style="padding:.5rem 0;border-bottom:1px dashed var(--border)">'
        +'<label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:13px">'
        +'<input type="checkbox" '+(st.checked?'checked':'')+' style="margin-top:3px"'
        +' onchange="rptCheck(\''+it.id+'\',this.checked)">'
        +'<span>'+esc(it.text)+'</span></label>'
        +'<input type="text" class="fc" style="margin-top:4px;font-size:12.5px" '
        +'placeholder="'+escAttr2(it.ph)+'" value="'+escAttr2(st.note||'')+'" '
        +'oninput="rptNote(\''+it.id+'\',this.value)"></div>';
    });
  });
  document.getElementById('rp-check').innerHTML=h;
  const c=document.getElementById('rp-cnt');
  if(c)c.textContent='— отмечено '+done+' из '+total;
}
window.rptCheck=function(id,v){
  (_rpt.check[id]=_rpt.check[id]||{}).checked=v;
  const done=Object.values(_rpt.check).filter(x=>x.checked).length;
  let total=0; RPT_SECTIONS.forEach(s=>total+=s.items.length);
  const c=document.getElementById('rp-cnt');
  if(c)c.textContent='— отмечено '+done+' из '+total;
}
window.rptNote=function(id,v){ (_rpt.check[id]=_rpt.check[id]||{}).note=v; }

  document.getElementById('rp-tasks').innerHTML=_rpt.tasks.map((t,i)=>

    +'<div class="fg" style="flex:2"><input type="text" class="fc" placeholder="что нужно сделать" '
