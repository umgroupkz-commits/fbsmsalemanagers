    +'<div class="fg" style="flex:2"><input type="text" class="fc" placeholder="результат" '

window.rptSubmit=async function(btn){
  const msg=document.getElementById('rp-msg');
  const shut=closedGuard(_rpt.date);
  if(shut){msg.className='alert ae';msg.textContent='🔒 '+shut;return}
  const vis=parseInt(document.getElementById('rp-vis').value);
  if(!vis&&vis!==0){
    msg.className='alert ae';msg.textContent='Укажите посетителей — счётчик 1С не знает';
    document.getElementById('rp-vis').focus();return;
  }
  if(btn){btn.disabled=true;btn.textContent='⏳ Отправка…'}
  const rev=parseFloat(String(document.getElementById('rp-rev').value).replace(/\s/g,''))||0;
  const body={
    date:_rpt.date, shop:_rpt.shop,
    author_uid:String(CU.id), author_name:CU.name, author_role:CU.role,
    revenue:rev,
    checks:parseInt(document.getElementById('rp-chk').value)||0,
    units:parseInt(document.getElementById('rp-unt').value)||0,
    visitors:vis,
    staff_count:parseInt(document.getElementById('rp-staff').value)||0,
    staff_comment:document.getElementById('rp-staff-note').value.trim()||null,
    incidents:document.getElementById('rp-inc').value.trim()||null,
    tasks:_rpt.tasks, returns:_rpt.returns, checklist:_rpt.check,
    updated_at:new Date().toISOString(), updated_by:CU.name
  };
  L(true);
  try{
    // Отчёт не уходит в Битрикс сразу: обмен с 1С мог ещё не принести
    // итоговые цифры дня. Ставим отметку «просили отправить», письмо
    // уйдёт из ближайшего обмена — уже по окончательной выручке.
    body.send_requested_at=new Date().toISOString();
    body.send_requested_by=CU.name;
    await schFetch('/shop_reports',{method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates'},body:JSON.stringify([body])});
    // Управляющему отчёт заменяет отметку смены: своих продаж он
    // не подтверждает, а на работе в этот день был.
    if(CU.role==='manager') schMarkActual(CU.id,_rpt.date,CU.shop,'report').catch(()=>{});
    logAction('shopReport',CU.name,_rpt.date,{shop:_rpt.shop});
  }catch(e){
    L(false);if(btn){btn.disabled=false;btn.textContent='📤 Отправить отчёт'}
    msg.className='alert ae';msg.textContent='Не отправилось: '+e.message;return;
  }
  L(false);
  pgShopReport(_rpt.date);
}



// Сторож на стыке двух учётов. Оклад считается по дням с продажами,
// табель — по отметкам в графике. Пока они сходятся, об этом можно
// не думать; как разойдутся — бухгалтер получит две разные цифры смен
// и не поймёт, какой верить. Поэтому проверяем каждый раз.
async function payrollVsSchedule(mk,sellers){
  if(!sellers.length)return '';
  const ids=sellers.map(u=>u.id);
  let sch=[];
  try{
    sch=await schFetch('/schedule?select=uid,date&actual_point=not.is.null&uid=in.'
      +encodeURIComponent(schInList(ids))+'&date=gte.'+mk+'-01&date=lte.'+mk+'-31')||[];
  }catch(e){ return ''; }
  const marked=new Set(sch.map(r=>r.uid+'|'+normDate(r.date)));

  const bad=[];
  sellers.forEach(u=>{
    const days=getEntriesFor(u.id,mk).filter(e=>!isReturnOnly1c(e));
    const miss=days.filter(e=>!marked.has(u.id+'|'+normDate(e.date)));
    if(miss.length)bad.push({name:u.name,days:miss.map(e=>normDate(e.date))});
  });
  if(!bad.length)return '';

  const total=bad.reduce((s,b)=>s+b.days.length,0);
  return '<div class="alert" style="background:var(--al);color:var(--amber)">'
    +'⚠️ Оплаченных дней без отметки в графике: <b>'+total+'</b>. '
    +'В табеле их не будет, и он разойдётся с начислением. '
    +bad.map(b=>esc(b.name)+' — '+schDatesLabel(b.days)).join('; ')
    +'</div>';
}

window.loadReportHist=async function(){
  const mk=document.getElementById('rh-mk').value;
  const shEl=document.getElementById('rh-shop');
  const shop=shEl?shEl.value:CU.shop;
  const body=document.getElementById('rh-body');
  body.innerHTML='<div class="spin" style="margin:1rem auto;display:block"></div>';
  let q='/shop_reports?select=*&date=gte.'+mk+'-01&date=lte.'+mk+'-31&order=date.desc';
  if(shop)q+='&shop=eq.'+encodeURIComponent(shop);
  else if(rptShops().length===1)q+='&shop=eq.'+encodeURIComponent(CU.shop);
  let rows=[];
  try{ rows=await schFetch(q)||[]; }catch(e){}
  // Пропущенные дни видно сразу: отчёт, которого нет, — это тоже факт.
  // Спрашиваем не с начала времён, а с даты, когда начали работать всерьёз:
  // иначе список пропусков будет в основном про дни настройки, и на него
  // перестанут смотреть.
  const shopsShown=shop?[shop]:rptShops();
  const from=[mk+'-01',(PARAMS.reportsFrom||'2026-08-10')].sort().pop();
  const last=mk+'-'+String(daysInMk(mk)).padStart(2,'0');
  const till=[last,today()].sort()[0];
  const want=[];
  for(let d=from;d<=till;d=schAddDays(d,1))want.push(d);
  const have=new Set((rows||[]).map(r=>r.shop+'|'+normDate(r.date)));
  const missBy={};
  shopsShown.forEach(sh=>{
    const m=want.filter(d=>!have.has(sh+'|'+d));
    if(m.length)missBy[sh]=m;
  });
  const missTotal=Object.values(missBy).reduce((a,b)=>a+b.length,0);
  const expect=shopsShown.length*want.length;

  let miss='';
  if(missTotal){
    miss='<div class="alert" style="background:var(--al);color:var(--amber);display:block">'
      +'📋 Отчётов не хватает: <b>'+missTotal+'</b>'
      +(want.length?' (считаем с '+from+')':'')+'. '
      +Object.keys(missBy).map(sh=>esc(sh)+' — '+schDatesLabel(missBy[sh])).join('; ')
      +'</div>';
  }
  if(!rows.length){
    body.innerHTML=miss+'<div style="color:var(--muted)">За этот месяц отчётов нет</div>';return;
  }

  let h=miss+'<div class="g4" style="margin-bottom:1rem">'
    +'<div class="metric"><div class="ml">Отчётов</div><div class="mv">'+rows.length+'</div></div>'
    +'<div class="metric"><div class="ml">Ожидалось</div><div class="mv">'+expect+'</div></div>'
    +'<div class="metric"><div class="ml">Посетителей</div><div class="mv">'
      +fmtN(rows.reduce((s,r)=>s+(+r.visitors||0),0))+'</div></div>'
    +'<div class="metric"><div class="ml">Выручка в отчётах</div><div class="mv">'
      +fmt(rows.reduce((s,r)=>s+(+r.revenue||0),0))+'</div></div></div>';
  h+='<div class="tw-wrap"><table><tr><th>Дата</th><th>Магазин</th><th>Заполнил</th>'
    +'<th>Выручка</th><th>Чеков</th><th>Посет.</th><th>Чек-лист</th><th>Битрикс</th><th></th></tr>';
  rows.forEach(r=>{
    const cl=r.checklist||{};
    const done=Object.values(cl).filter(x=>x&&x.checked).length;
    const tot=RPT_SECTIONS.reduce((a,s)=>a+s.items.length,0);
    const col=done>=tot*0.9?'var(--green)':done>=tot*0.6?'var(--amber)':'var(--red)';
    h+='<tr><td>'+dayLabel(normDate(r.date))+'</td><td>'+esc(r.shop)+'</td>'
      +'<td>'+esc(r.author_name)+'<div style="font-size:11px;color:var(--muted)">'
        +(ROLE_LABELS[r.author_role]||r.author_role)+'</div></td>'
      +'<td>'+fmt(+r.revenue||0)+'</td><td>'+(+r.checks||0)+'</td><td>'+(+r.visitors||0)+'</td>'
      +'<td style="color:'+col+';font-weight:600">'+done+' из '+tot+'</td>'
      +'<td>'+(r.bitrix_sent_at?'<span class="tag ts">ушёл</span>'
        :r.bitrix_error?'<span class="tag td" title="'+escAttr2(r.bitrix_error)+'">ошибка</span>'
        :r.send_requested_at?'<span class="tag tw">ждёт обмена</span>'
        :'<span class="tag ti">не отправлен</span>')+'</td>'
      +'<td><button class="btn bsm" onclick="rptView(\''+normDate(r.date)+'\',\''+esc(r.shop)+'\')">'
      +'посмотреть</button></td></tr>';
  });
  h+='</table></div>';
  body.innerHTML=h;
}

//  То, что считалось формулами в Google-таблице. Выручка, чеки

// Метрики одного набора дней. Считаются одинаково везде — иначе
// «средний чек» на двух вкладках разъедется.
function dashAgg(sales,reps,plan){
  let rev=0,chk=0,unt=0,vis=0,retQ=0,retS=0;
  // Возвраты берём из 1С, а не из отчёта: в отчёте их вбивают руками,
  // и две цифры об одном и том же неизбежно разъедутся.
  sales.forEach(s=>{
    rev+=+s.fact||0; chk+=+s.checks||0; unt+=+s.units||0;
    retS+=+s.returns_amount||0; retQ+=+s.returns_receipts||0;
  });
  reps.forEach(r=>{ vis+=+r.visitors||0; });
  return {rev,chk,unt,vis,retQ,retS,plan,
    pct:plan>0?rev/plan*100:0,
    avg:chk>0?rev/chk:0,
    conv:vis>0?chk/vis*100:0,
    upt:chk>0?unt/chk:0,
    days:sales.length, reports:reps.length};
}
function pctCell(v){
  const c=v>=100?'var(--green)':v>=70?'var(--amber)':'var(--red)';
  const bg=v>=100?'var(--gl)':v>=70?'var(--al)':'var(--rl)';
  return '<td style="text-align:center;font-weight:700;color:'+c+';background:'+bg+'">'
    +(v?v.toFixed(1):'0.0')+'%</td>';
}

window.dashRender=async function(){
  const body=document.getElementById('d2-body');
  const wrap=document.getElementById('d2-shopwrap');
  if(wrap)wrap.style.display=_dash.view==='year'?'':'none';
  body.innerHTML='<div class="spin" style="margin:2rem auto;display:block"></div>';

  const shops=rptShops();
  const yearMode=_dash.view==='year';
  const from=yearMode?schAddDays(_dash.mk+'-01',-365).slice(0,7)+'-01':_dash.mk+'-01';
  const to=_dash.mk+'-31';
  let sales=[],reps=[],plans=[];
  try{ sales=await schFetch('/shop_sales?select=date,shop,fact,checks,units,'
    +'returns_amount,returns_receipts&date=gte.'+from+'&date=lte.'+to)||[]; }catch(e){}
  try{ reps=await schFetch('/shop_reports?select=date,shop,visitors&date=gte.'+from
    +'&date=lte.'+to)||[]; }catch(e){}
  try{ plans=await api('getPlans',{})||[]; }catch(e){}
  const planOf=(shop,mk)=>{
    const p=plans.find(x=>x.uid==='shop_'+shop&&x.mk===mk);
    return p?+p.amount||0:0;
  };

  const ROWS=[
    ['💰 Выручка',      a=>fmt(a.rev)],
    ['🎯 % плана',      null],
    ['🧾 Ср. чек',      a=>fmt(Math.round(a.avg))],
    ['👥 Конверсия',    a=>a.conv?a.conv.toFixed(1)+'%':'—'],
    ['📦 Ед. товара',   a=>fmtN(a.unt)],
    ['📊 UPT',          a=>a.upt?a.upt.toFixed(1):'—'],
    ['🧾 Чеков',        a=>fmtN(a.chk)],
    ['📋 Отчётов',      a=>a.reports],
    ['↩️ Возвраты, чеков', a=>a.retQ||'—'],
    ['↩️ Возвраты, ₸',  a=>a.retS?fmt(a.retS):'—'],
  ];

  let h='';
  if(!yearMode){
    // ── магазины за месяц ──
    const cols=shops.map(sh=>({sh,a:dashAgg(
      sales.filter(x=>x.shop===sh&&normDate(x.date).startsWith(_dash.mk)),
      reps.filter(x=>x.shop===sh&&normDate(x.date).startsWith(_dash.mk)),
      planOf(sh,_dash.mk))}));
    const totPlan=shops.reduce((s,sh)=>s+planOf(sh,_dash.mk),0);
    const tot=dashAgg(sales.filter(x=>normDate(x.date).startsWith(_dash.mk)),
      reps.filter(x=>normDate(x.date).startsWith(_dash.mk)),totPlan);

    h+='<div class="card"><div class="ct">📊 '+
      new Date(_dash.mk+'-01').toLocaleDateString('ru-RU',{month:'long',year:'numeric'})+'</div>'
      +'<div class="tw-wrap"><table><tr><th>Показатель</th>'
      +cols.map(c=>'<th style="text-align:center">'+esc(c.sh)+'</th>').join('')
      +'<th style="text-align:center;background:var(--gl)">по сети</th></tr>';
    ROWS.forEach(([label,fn])=>{
      h+='<tr><td><b>'+label+'</b></td>';
      cols.forEach(c=>{ h+=fn?'<td style="text-align:center">'+fn(c.a)+'</td>':pctCell(c.a.pct); });
      h+=fn?'<td style="text-align:center;background:var(--gl);font-weight:700">'+fn(tot)+'</td>'
           :pctCell(tot.pct);
      h+='</tr>';
    });
    h+='<tr><td><b>📋 План</b></td>'
      +cols.map(c=>'<td style="text-align:center;color:var(--muted)">'
        +(c.a.plan?fmt(c.a.plan):'—')+'</td>').join('')
      +'<td style="text-align:center;background:var(--gl)">'+(totPlan?fmt(totPlan):'—')+'</td></tr>';
    h+='</table></div></div>';
  }else{
    // ── один магазин, 12 месяцев ──
    const sh=_dash.shop;
    const mks=[];
    const [y,m]=_dash.mk.split('-').map(Number);
    for(let i=0;i<12;i++){
      const d=new Date(y,m-1-i,1);
      mks.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
    }
    h+='<div class="card"><div class="ct">📅 '+esc(sh)+' — 12 месяцев</div>'
      +'<div class="tw-wrap"><table><tr><th>Месяц</th><th>Выручка</th><th>План</th><th>% плана</th>'
      +'<th>Ср. чек</th><th>Чеков</th><th>Посет.</th><th>Конв.</th><th>Ед.</th><th>UPT</th>'
      +'<th>Возвр. чеков</th><th>Возвр. ₸</th><th>Отчётов</th></tr>';
    mks.forEach(mk=>{
      const a=dashAgg(sales.filter(x=>x.shop===sh&&normDate(x.date).startsWith(mk)),
        reps.filter(x=>x.shop===sh&&normDate(x.date).startsWith(mk)),planOf(sh,mk));
      h+='<tr><td><b>'+new Date(mk+'-01').toLocaleDateString('ru-RU',{month:'long',year:'numeric'})+'</b></td>'
        +'<td>'+fmt(a.rev)+'</td><td style="color:var(--muted)">'+(a.plan?fmt(a.plan):'—')+'</td>'
        +pctCell(a.pct)
        +'<td>'+fmt(Math.round(a.avg))+'</td><td>'+fmtN(a.chk)+'</td><td>'+fmtN(a.vis)+'</td>'
        +'<td>'+(a.conv?a.conv.toFixed(1)+'%':'—')+'</td>'
        +'<td>'+fmtN(a.unt)+'</td><td>'+(a.upt?a.upt.toFixed(1):'—')+'</td>'
        +'<td>'+(a.retQ||'—')+'</td><td>'+(a.retS?fmt(a.retS):'—')+'</td>'
        +'<td>'+a.reports+'</td></tr>';
    });

function buildShopPlansTable(){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth();
  const months=[];
  for(let i=-1;i<5;i++){const d=new Date(y,m+i,1);months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));}
  let html=`<table><tr><th>Магазин</th>${months.map(mk=>`<th>${mk}</th>`).join('')}</tr>`;
  SHOPS.filter(isTradeShop).forEach(shop=>{
    const uid='shop_'+shop;
    html+=`<tr><td>${shop}</td>`;
    months.forEach(mk=>{const p=getPlan(uid,mk);html+=`<td style="font-size:12px">${p?fmtN(p):'—'}</td>`;});
    html+='</tr>';
  });
  return html+'</table>';
}

function buildPlansTable(sellers){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth();
  const months=[];
  for(let i=-1;i<5;i++){const d=new Date(y,m+i,1);months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));}
  let html=`<table><tr><th>Продавец</th>${months.map(mk=>`<th>${mk}</th>`).join('')}</tr>`;
  sellers.forEach(u=>{
    html+=`<tr><td>${esc(u.name)}</td>`;
    months.forEach(mk=>{const p=getPlan(u.id,mk);html+=`<td style="font-size:12px">${p?fmtN(p):'—'}</td>`;});
    html+='</tr>';
  });
  return html+'</table>';
}

window.savePosParams=async function(role){
  const m=document.getElementById('pmsg-'+role);
  const c=POSITIONS[role], g=id=>document.getElementById('pp-'+role+'-'+id);
  const np={};
  if(c.pay==='shift'){
    np[c.rateKey]=parseFloat(g('rate').value)||c.rateDef;
    if(np[c.rateKey]<=0){ m.className='alert ae';m.textContent='Ставка должна быть больше нуля';return; }
  }else{
    np[c.okladKey]=parseFloat(g('oklad').value)||c.okladDef;
    np[c.normKey]=parseFloat(g('norm').value)||22;
    if(np[c.normKey]<=0){ m.className='alert ae';m.textContent='Норма смен должна быть больше нуля';return; }
  }
  if(role==='streamer'){
    np[c.pctKey]=parseFloat(document.getElementById('pp-streamer-pct').value)||0;
    if(np[c.pctKey]<0||np[c.pctKey]>1){
      m.className='alert ae';
      m.textContent='Доля задаётся числом от 0 до 1: 0,05 — это 5%';return; }
  }
  L(true);
  try{ await apiPost('saveParams',np); }
  catch(e){ L(false);m.className='alert ae';m.textContent='Не сохранилось: '+e.message;return; }
  PARAMS={...PARAMS,...np};
  L(false);
  logAction('savePosParams',c.label,null,np);
  m.className='alert as';m.textContent='✓ Сохранено';
  setTimeout(()=>m.textContent='',3000);
}

// Подразделения. Убрать точку, в которой кто-то числится, нельзя: человек
// остался бы без места, а его смены — без магазина.
window.saveUnits=async function(){
  const m=document.getElementById('pmsg-units');
  const clean=s=>s.split(/[\n,]/).map(x=>x.trim()).filter(Boolean);
  const units=[...new Set(clean(document.getElementById('pp-units').value))];
  const nont=[...new Set(clean(document.getElementById('pp-nontrade').value))];
  if(!units.length){ m.className='alert ae';m.textContent='Список не может быть пустым';return; }
  const busy=[...new Set(USERS.map(u=>u.shop).filter(Boolean))].filter(s=>units.indexOf(s)<0);
  if(busy.length){
    m.className='alert ae';
    m.textContent='Нельзя убрать: там числятся люди — '+busy.join(', ');return;
  }
  const stray=nont.filter(s=>units.indexOf(s)<0);
  if(stray.length){
    m.className='alert ae';
    m.textContent='В неторговых указано то, чего нет в списке: '+stray.join(', ');return;
  }
  const np={shopsList:units.join(','),nonTradeShops:nont.join(',')};
  L(true);
  try{ await apiPost('saveParams',np); }
  catch(e){ L(false);m.className='alert ae';m.textContent='Не сохранилось: '+e.message;return; }
  PARAMS={...PARAMS,...np}; refreshShops();
  L(false);
  logAction('saveUnits',null,null,np);
  m.className='alert as';
  m.textContent='✓ Подразделений: '+units.length+', из них неторговых: '+nont.length;
  setTimeout(()=>m.textContent='',4000);
}

const MGR_DEFAULTS={rate:30000,shifts:22,base:0.005,p80:0.0025,p100:0.0025,p140:0.005,bKpi:20000,avgNorm:15000,uptNorm:2.5};
// Норма смен управляющего. Раньше в начислении стояло зашитое 22, а на
// странице «Моя ЗП» — настраиваемый параметр: стоило поменять норму в
// «Параметрах», и два экрана показали бы разные оклады.
const mgrShifts=()=>parseFloat(MGR_PARAMS.shifts)||MGR_DEFAULTS.shifts;
let MGR_PARAMS={...MGR_DEFAULTS};

function getMgrRank(p){
  if(p>=1.4)return{lbl:'Император',ic:'👑',col:'#BA7517',bg:'#FAEEDA'}
  if(p>=1.0)return{lbl:'Сёгун',ic:'🏯',col:'#185FA5',bg:'#E6F1FB'}
  if(p>=0.8)return{lbl:'Полководец',ic:'⚜️',col:'#3B6D11',bg:'#EAF3DE'}
  if(p>=0.5)return{lbl:'Советник',ic:'📜',col:'#533F2E',bg:'#F1EFE8'}
  return{lbl:'Чиновник',ic:'🎌',col:'#888780',bg:'#F1EFE8'}
}
function mgrChip(p){const r=getMgrRank(p);return '<span class="rank" style="background:'+r.bg+';color:'+r.col+'">'+r.ic+' '+r.lbl+'</span>';}
function mgrMotiv(p){
  if(p>=1.4)return'👑 Император! Магазин покорил 140%+. Абсолютная победа!';
  if(p>=1.2)return'🏯 Сёгун в силе! До звания Императора — один рывок!';
  if(p>=1.0)return'🏯 План выполнен! Каждый процент сверх — это дополнительный бонус!';
  if(p>=0.8)return'⚜️ Полководец! Следующая цель — 100% и звание Сёгуна!';
  if(p>=0.5)return'📜 Советник держит курс! До Полководца — рукой подать.';
  return'🎌 Путь Чиновника начался. Магазин набирает обороты.';
}
function calcMgrZP(fact,checks,units,pct,shifts,p){
  p=p||MGR_PARAMS;
  const sh=shifts!==undefined?shifts:(parseFloat(p.shifts)||MGR_DEFAULTS.shifts);
  return computeZPCore(fact,fact,checks,units,pct,p,{
    defaults:MGR_DEFAULTS,shifts:sh,hasShopBonus:false,shopBonusOn:false,
    capUpt:true,capAvgAt:999999,
  });
}

window.pgMgrDash=async function(forceRefresh){
  nav('pgMgrDash');setTitle('Моя зарплата');setBadge('');
  setContent('<div style="padding:2rem;text-align:center"><div class="spin"></div></div>');
  L(true);
  var mk=curMk();
  var bundle=await api('getBundle',{mk:mk,needShopStats:1,needMgrParams:1,forceRefresh:forceRefresh?1:0});
  window._shopStats=bundle.shopStats;_plans=bundle.plans;
  window._mgrUpdatedAt=bundle.shopStatsUpdatedAt;
  MGR_PARAMS=Object.assign({},MGR_DEFAULTS,bundle.mgrParams);
  L(false);

  var ss=(window._shopStats||{})[CU.shop]||{fact:0,consultants:0,other:0,plan:0,pct:0};
  var shopFact=ss.fact;
  var shopPlan=ss.plan;
  var pct=shopPlan>0?shopFact/shopPlan:0;
  var normShifts=parseFloat(MGR_PARAMS.shifts)||22;

  // Get shop KPI from seller entries
  var sellers=USERS.filter(function(u){return u.role==='seller'&&u.shop===CU.shop;});
  var sellerIds=sellers.map(function(u){return u.id;});
  var entries=_sales.filter(function(s){return sellerIds.indexOf(s.uid)>=0&&normDate(s.date).startsWith(mk);});
  var tc=0,tu=0;
  entries.forEach(function(e){tc+=+e.checks;tu+=+e.units;});

  var zp=calcMgrZP(shopFact,tc,tu,pct,normShifts);
  setBadge(mgrChip(pct));

  // Stages
  var stages='';
  [{p:0.8,lbl:'80% — Полководец',col:'#BA7517'},{p:1,lbl:'100% — Сёгун',col:'#185FA5'},{p:1.4,lbl:'140% — Император',col:'#639922'}]
  .forEach(function(st){
    var need=Math.max(0,shopPlan*st.p-shopFact);
    var bar=Math.min(100,shopPlan>0?shopFact/(shopPlan*st.p)*100:0);
    var sz=calcMgrZP(shopPlan>0?shopPlan*st.p:shopFact,tc,tu,st.p,normShifts);
    stages+='<div style="margin-bottom:14px">'
      +'<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">'
      +'<span style="color:'+st.col+';font-weight:600">'+st.lbl+'</span>'
      +'<span style="color:var(--muted)">'+(need>0?'ещё '+fmt(need):'✓ Выполнено')+'</span></div>'
      +'<div class="pb"><div class="pf" style="width:'+bar+'%;background:'+st.col+'"></div></div>'
      +'<div style="font-size:12px;color:'+st.col+';margin-top:3px">ЗП при этом уровне: <b>'+fmt(sz.total)+'</b></div>'
      +'</div>';
  });

  // ZP breakdown
  var zpHtml='';
  [['Оклад ('+normShifts+' смен x '+fmt(parseFloat(MGR_PARAMS.rate)||30000)+')',zp.oklad],
   ['% от продаж магазина',zp.base],['Доб.% 80%',zp.a80],['Доб.% 100%',zp.a100],
   ['Доб.% 140%',zp.a140],['Бонус KPI (ср.чек)',zp.bk1],['Бонус KPI (UPT)',zp.bk2],
   ['ИТОГО',zp.total]
  ].forEach(function(row){zpHtml+='<div class="zpr"><span>'+row[0]+'</span><span>'+fmt(row[1])+'</span></div>';});

  // Daily target
  var now=new Date();
  var dLeft=daysInMk(mk)-now.getDate();
  var daily='';
  if(shopPlan>0&&dLeft>0){
    [{p:1,l:'100%'},{p:1.4,l:'140%'}].forEach(function(t){
      var need=Math.max(0,shopPlan*t.p-shopFact);
      daily+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px">'
        +'<span>До '+t.l+' плана</span><b>'+(need>0?fmt(need/dLeft)+'/день':'✓ Готово')+'</b></div>';
    });
    daily+='<div style="font-size:11px;color:var(--muted);margin-top:6px">Осталось дней: '+dLeft+'</div>';
  } else {
    daily='<span style="color:var(--muted);font-size:13px">'+(shopPlan===0?'План магазина не установлен':'Месяц завершён')+'</span>';
  }

  var avg=tc>0?shopFact/tc:0;
  var upt=tc>0?tu/tc:0;
  var avgN=Math.min(parseFloat(MGR_PARAMS.avgNorm)||15000,999999);
  var uptN=Math.min(parseFloat(MGR_PARAMS.uptNorm)||2.5,100);

  var html='<div class="motiv" style="background:var(--al);border-color:#DDB870;color:var(--amber)">'+mgrMotiv(pct)+'</div>';
  html+='<div class="g4" style="margin-bottom:1rem">';
  html+='<div class="metric"><div class="ml">Факт магазина</div><div class="mv" style="font-size:17px">'+fmt(shopFact)+'</div></div>';
  html+='<div class="metric"><div class="ml">Выполнение</div><div class="mv" style="color:'+barCol(pct)+'">'+Math.round(pct*100)+'%</div></div>';
  html+='<div class="metric"><div class="ml">ЗП сейчас</div><div class="mv" style="font-size:17px;color:var(--blue)">'+fmt(zp.total)+'</div></div>';
  html+='<div class="metric"><div class="ml">План магазина</div><div class="mv" style="font-size:17px">'+(shopPlan>0?fmt(shopPlan):'—')+'</div></div>';
  html+='</div>';
  html+='<div class="g2">';
  html+='<div class="card" style="margin:0"><div class="ct">Прогресс к целям</div>'+stages+'</div>';
  html+='<div class="card" style="margin:0"><div class="ct">Расшифровка ЗП</div>'+zpHtml+'</div>';
  html+='</div>';
  html+='<div class="g2" style="margin-top:1rem">';
  html+='<div class="card" style="margin:0"><div class="ct">KPI магазина</div>';
  html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
  html+='<div><div style="font-size:11px;color:var(--muted)">Средний чек</div>';
  html+='<div style="font-size:20px;font-weight:700">'+fmt(avg)+'</div>';
  html+='<div style="font-size:11px;color:var(--muted)">норма: '+fmt(avgN)+'</div></div>';
  html+='<div>'+(avg>=avgN?'<span class="tag ts">Бонус +'+fmt(parseFloat(MGR_PARAMS.bKpi)||20000)+'</span>':'<span class="tag tw">ещё '+fmt(avgN-avg)+'</span>')+'</div>';

  html+='</div></div>';
  html+='<div class="card" style="margin:0"><div class="ct">Нужно в день до конца месяца</div>';
  html+=daily;
  html+='<hr style="margin:12px 0;border:none;border-top:1px solid var(--border)">';
  html+='<div style="font-size:13px;font-weight:600;margin-bottom:8px">Рассчитать ЗП по % выполнения</div>';
  html+='<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">';
  html+='<input type="number" id="mgr-scen-pct" class="fc" style="width:100px" placeholder="%" value="100" min="0">';
  html+='<span style="color:var(--muted);font-size:13px">%</span>';

  html+='<div id="mgr-scen-result" style="font-size:14px;font-weight:600;color:var(--blue)"></div>';
  html+='</div></div>';
  html+='<div style="display:flex;align-items:center;gap:10px;margin-top:1rem">';
  html+='<button class="btn bsm" onclick="pgMgrDash(true)" title="Обновить факт магазина из отчётов">🔄 Обновить данные</button>';
  html+='<span style="font-size:12px;color:var(--muted)">'+fmtUpdatedAt(window._mgrUpdatedAt)+'</span>';
  html+='</div>';
  setContent(html);
  window._mgrDash={shopFact:shopFact,shopPlan:shopPlan,pct:pct,tc:tc,tu:tu,normShifts:normShifts};
};

window.calcMgrScen=function(){
  var pctVal=parseFloat(document.getElementById('mgr-scen-pct').value)||0;

  document.getElementById('mgr-scen-result').textContent='ЗП при '+Math.round(pctVal)+'%: '+fmt(z.total);
};

// ── Экспорт начислений в Excel ────────────────────────────────────
// Выгружается не итог, а весь расчёт: каждая сумма — живая формула
// Excel, ссылающаяся на исходные данные и ставки в том же файле.
// Бухгалтер может пересчитать и проверить любую цифру, не заходя в
// программу. Четыре листа: Свод / Продавцы / Управляющие / Параметры.

// Номер колонки → буква (0→A, 26→AA)
function xlCol(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26}return s}
const XL_MONEY='#,##0 ₸',XL_PCT='0.0%',XL_RATE='0.000%';

// Записать формулу с числовым форматом
function xlF(ws,addr,formula,z){ws[addr]={t:'n',f:formula,z:z||XL_MONEY}}
function xlZ(ws,addr,z){if(ws[addr])ws[addr].z=z}

window.exportPayrollExcel=function(){
  const all=window._payrollRows||[];
  if(all.length===0){alert('Нет данных для экспорта. Сначала открой начисление ЗП.');return;}
  if(typeof XLSX==='undefined'){alert('Библиотека Excel не загрузилась. Обнови страницу.');return;}
  const mk=document.getElementById('payMk')?document.getElementById('payMk').value:curMk();
  const sellers=all.filter(r=>r.kind==='seller');
  const mgrs=all.filter(r=>r.kind==='manager');
  const runs=all.filter(r=>r.kind==='clock');
  const wb=XLSX.utils.book_new();
  const R0=5; // первая строка данных на листах расчёта

  // ══ ЛИСТЫ РАСЧЁТА ═════════════════════════════════════════════
  // Каждая денежная ячейка — формула от исходных данных и ставок,
  // которые лежат в той же строке слева. Зашитых сумм нет ни одной:
  // бухгалтер меняет ставку — пересчитывается вся строка.
  const KEYS=['name','shop','realSales','sales','plan','pct','shifts','rate','oklad',
    'kBase','vBase','k80','v80','k100','v100','k140','v140','commTotal',
    'checks','units','avg','avgNorm','kpiRate','vKpi1','upt','uptNorm','vKpi2'];
  const KEYS_SHOP=['shopMet','bMagRate','vMag'];
  const KEYS_TAIL=['bonusTotal','accrued','extraBonus','bonusNote','advance','pension','ipn','vosms','fines','payout'];
  const FORMULA_KEYS=['pct','oklad','vBase','v80','v100','v140','commTotal',
    'avg','vKpi1','upt','vKpi2','vMag','bonusTotal','accrued','payout'];
  const HEAD={
    name:'Сотрудник',shop:'Магазин',
    realSales:'Продажи реальные',sales:'Продажи для расчёта',plan:'План',pct:'% выполнения',
    shifts:'Смен',rate:'Ставка за смену',oklad:'ОКЛАД',
    kBase:'База, ставка',vBase:'База, ₸',
    k80:'Порог 80%, ставка',v80:'Доплата 80%, ₸',
    k100:'Порог 100%, ставка',v100:'Доплата 100%, ₸',
    k140:'Порог 140%, ставка',v140:'Доплата 140%, ₸',
    commTotal:'ИТОГО % ОТ ПРОДАЖ',
    checks:'Чеков',units:'Единиц',
    avg:'Средний чек',avgNorm:'Норма ср. чека',kpiRate:'Ставка премии KPI',vKpi1:'ПРЕМИЯ за ср. чек',
    upt:'UPT',uptNorm:'Норма UPT',vKpi2:'ПРЕМИЯ за UPT',
    shopMet:'План магазина',bMagRate:'Ставка премии за магазин',vMag:'ПРЕМИЯ за план магазина',
    bonusTotal:'ИТОГО ПРЕМИИ',accrued:'НАЧИСЛЕНО',
    extraBonus:'Разовая премия',bonusNote:'За что премия',
    advance:'Аванс',pension:'Пенсия',ipn:'ИПН',vosms:'ВОСМС',fines:'Штрафы',payout:'К ВЫПЛАТЕ'};

  const detail=(rows,sheet,isMgr)=>{
    if(!rows.length)return null;
    const keys=KEYS.concat(isMgr?[]:KEYS_SHOP).concat(KEYS_TAIL);
    const C={};keys.forEach((k,i)=>C[k]=xlCol(i));
    const aoa=[[(isMgr?'РАСЧЁТ ЗП · УПРАВЛЯЮЩИЕ · ':'РАСЧЁТ ЗП · ПРОДАВЦЫ · ')+mk],
      ['Каждая сумма — формула. Меняешь исходные данные или ставку слева — пересчитывается вся строка.'],[],
      keys.map(k=>HEAD[k])];
    rows.forEach(r=>aoa.push(keys.map(k=>{
      if(FORMULA_KEYS.includes(k))return null;   // заполнится формулой ниже
      if(k==='shopMet')return r.shopMet?'да':'нет';
      if(k==='kpiRate')return r.bKpiRate;
      return r[k]!==undefined?r[k]:null;
    })));
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    rows.forEach((r,i)=>{
      const n=i+R0,a=k=>C[k]+n;
      xlF(ws,a('pct'),      'IF('+a('plan')+'>0,'+a('sales')+'/'+a('plan')+',0)',XL_PCT);
      xlF(ws,a('oklad'),    a('shifts')+'*'+a('rate'));
      xlF(ws,a('vBase'),    a('sales')+'*'+a('kBase'));
      xlF(ws,a('v80'),      'IF('+a('pct')+'>=0.8,'+a('sales')+'*'+a('k80')+',0)');
      xlF(ws,a('v100'),     'IF('+a('pct')+'>=1,'+a('sales')+'*'+a('k100')+',0)');
      xlF(ws,a('v140'),     'IF('+a('pct')+'>=1.4,'+a('sales')+'*'+a('k140')+',0)');
      xlF(ws,a('commTotal'),a('vBase')+'+'+a('v80')+'+'+a('v100')+'+'+a('v140'));
      // KPI считаются от РЕАЛЬНЫХ продаж — корректировка на них не влияет
      xlF(ws,a('avg'),      'IF('+a('checks')+'>0,'+a('realSales')+'/'+a('checks')+',0)');
      xlF(ws,a('vKpi1'),    'IF('+a('avg')+'>='+a('avgNorm')+','+a('kpiRate')+',0)');
      xlF(ws,a('upt'),      'IF('+a('checks')+'>0,'+a('units')+'/'+a('checks')+',0)','0.00');
      xlF(ws,a('vKpi2'),    'IF('+a('upt')+'>='+a('uptNorm')+','+a('kpiRate')+',0)');
      if(isMgr){
        xlF(ws,a('bonusTotal'),a('vKpi1')+'+'+a('vKpi2'));
      }else{
        xlF(ws,a('vMag'),      'IF('+a('shopMet')+'="да",'+a('bMagRate')+',0)');
        xlF(ws,a('bonusTotal'),a('vKpi1')+'+'+a('vKpi2')+'+'+a('vMag'));
      }
      xlF(ws,a('accrued'),  a('oklad')+'+'+a('commTotal')+'+'+a('bonusTotal'));
      xlF(ws,a('payout'),   a('accrued')+'+'+a('extraBonus')+'-'+a('advance')+'-'+a('pension')+'-'+a('ipn')+'-'+a('vosms')+'-'+a('fines'));
      ['realSales','sales','plan','rate','avgNorm','kpiRate','extraBonus','advance','pension','ipn','vosms','fines']
        .concat(isMgr?[]:['bMagRate']).forEach(k=>xlZ(ws,a(k),XL_MONEY));
      ['kBase','k80','k100','k140'].forEach(k=>xlZ(ws,a(k),XL_RATE));
    });
    const t=rows.length+R0;
    ws[C.name+t]={t:'s',v:'ИТОГО'};
    ['realSales','sales','plan','oklad','vBase','v80','v100','v140','commTotal',
      'vKpi1','vKpi2','bonusTotal','accrued','extraBonus','advance','pension','ipn','vosms','fines','payout']
      .concat(isMgr?[]:['vMag'])
      .forEach(k=>xlF(ws,C[k]+t,'SUM('+C[k]+R0+':'+C[k]+(t-1)+')'));
    xlF(ws,C.shifts+t,'SUM('+C.shifts+R0+':'+C.shifts+(t-1)+')','0.0');
    ws['!ref']='A1:'+C.payout+t;
    ws['!cols']=keys.map((k,i)=>({wch:i<2?24:Math.max(12,Math.min(22,HEAD[k].length+3))}));
    ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:keys.length-1}},{s:{r:1,c:0},e:{r:1,c:keys.length-1}}];
    ws['!freeze']={xSplit:'2',ySplit:'4'};
    XLSX.utils.book_append_sheet(wb,ws,sheet);
    return C;
  };
  const Cs=detail(sellers,'Продавцы',false);
  const Cm=detail(mgrs,'Управляющие',true);

  // ══ СВОД — все числа ссылаются на листы расчёта ════════════════
  const ordered=sellers.concat(mgrs);
  const sv=[['СВОД НАЧИСЛЕНИЙ · '+mk],
    ['Каждое число — ссылка на лист расчёта. Правится там, здесь пересчитывается само.'],[],
    ['Сотрудник','Роль','Магазин','Смен','Оклад','% от продаж','ПРЕМИИ','НАЧИСЛЕНО','Разовая премия','Аванс','Пенсия','ИПН','ВОСМС','Штрафы','К ВЫПЛАТЕ']];
  ordered.forEach(r=>sv.push([r.name,r.role,r.shop,null,null,null,null,null,null,null,null,null,null,null,null]));
  const wsSv=XLSX.utils.aoa_to_sheet(sv);
  ordered.forEach((r,i)=>{
    const n=i+R0,isM=r.kind==='manager';
    const C=isM?Cm:Cs;
    if(!C)return;
    const src="'"+(isM?'Управляющие':'Продавцы')+"'!";
    const k=(isM?i-sellers.length:i)+R0;   // строка этого человека на листе расчёта
    xlF(wsSv,'D'+n,src+C.shifts+k,'0.0');
    xlF(wsSv,'E'+n,src+C.oklad+k);
    xlF(wsSv,'F'+n,src+C.commTotal+k);
    xlF(wsSv,'G'+n,src+C.bonusTotal+k);
    xlF(wsSv,'H'+n,'E'+n+'+F'+n+'+G'+n);
    xlF(wsSv,'I'+n,src+C.extraBonus+k);
    xlF(wsSv,'J'+n,src+C.advance+k);
    xlF(wsSv,'K'+n,src+C.pension+k);
    xlF(wsSv,'L'+n,src+C.ipn+k);
    xlF(wsSv,'M'+n,src+C.vosms+k);
    xlF(wsSv,'N'+n,src+C.fines+k);
    xlF(wsSv,'O'+n,'H'+n+'+I'+n+'-J'+n+'-K'+n+'-L'+n+'-M'+n+'-N'+n);
  });
  const tr=ordered.length+R0;
  wsSv['A'+tr]={t:'s',v:'ИТОГО'};
  ['D','E','F','G','H','I','J','K','L','M','N','O'].forEach(c=>
    xlF(wsSv,c+tr,'SUM('+c+R0+':'+c+(tr-1)+')',c==='D'?'0.0':XL_MONEY));
  wsSv['!ref']='A1:O'+tr;
  wsSv['!cols']=[{wch:26},{wch:14},{wch:15},{wch:8},{wch:13},{wch:14},{wch:13},{wch:14},{wch:15},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:15}];
  wsSv['!merges']=[{s:{r:0,c:0},e:{r:0,c:14}},{s:{r:1,c:0},e:{r:1,c:14}}];
  XLSX.utils.book_append_sheet(wb,wsSv,'Свод');

  // ══ ПАРАМЕТРЫ ═════════════════════════════════════════════════
  const s0=sellers[0]||{},m0=mgrs[0]||{};
  const pr=[['ПАРАМЕТРЫ РАСЧЁТА · '+mk],[],
    ['Показатель','Продавец','Управляющий'],
    ['Ставка за смену',s0.rate!==undefined?s0.rate:'—',m0.rate!==undefined?m0.rate:'—'],
    ['Базовый % от продаж',s0.kBase!==undefined?s0.kBase:'—',m0.kBase!==undefined?m0.kBase:'—'],
    ['Доплата при 80% плана',s0.k80!==undefined?s0.k80:'—',m0.k80!==undefined?m0.k80:'—'],
    ['Доплата при 100% плана',s0.k100!==undefined?s0.k100:'—',m0.k100!==undefined?m0.k100:'—'],
    ['Доплата при 140% плана',s0.k140!==undefined?s0.k140:'—',m0.k140!==undefined?m0.k140:'—'],
    ['Премия за план магазина',s0.bMagRate!==undefined?s0.bMagRate:'—','нет'],
    ['Премия за KPI (каждая)',s0.bKpiRate!==undefined?s0.bKpiRate:'—',m0.bKpiRate!==undefined?m0.bKpiRate:'—'],
    ['Норма среднего чека',s0.avgNorm!==undefined?s0.avgNorm:'—',m0.avgNorm!==undefined?m0.avgNorm:'—'],
    ['Норма UPT',s0.uptNorm!==undefined?s0.uptNorm:'—',m0.uptNorm!==undefined?m0.uptNorm:'—'],
    [],
    ['Как считаются смены'],
    ['Смены продавца — дни с записями о продажах (в том числе нулевыми), взвешенные'],
    ['по типу смены из графика: полная = 1, полсмены = 0,5, стажировка = 1.'],
    ['У управляющего смены фиксированы: 22.'],
    [],
    ['Нюанс корректировки'],
    ['Если сумма продаж скорректирована вручную, от неё считаются только % и пороги 80/100/140.'],
    ['Средний чек и UPT всегда считаются от РЕАЛЬНЫХ продаж.']];
  const wsP=XLSX.utils.aoa_to_sheet(pr);
  [4,9,10,11].forEach(n=>{xlZ(wsP,'B'+n,XL_MONEY);xlZ(wsP,'C'+n,XL_MONEY)});
  [5,6,7,8].forEach(n=>{xlZ(wsP,'B'+n,XL_RATE);xlZ(wsP,'C'+n,XL_RATE)});
  wsP['!cols']=[{wch:44},{wch:16},{wch:16}];
  wsP['!merges']=[{s:{r:0,c:0},e:{r:0,c:2}}];
  // Раннеры отдельным листом: у них нет ни планов, ни процентов,
  // и мешать их со сложным листом продавцов бессмысленно.
  if(runs.length){
    const cfg=runnerCfg('runner');
    const aoa=[['ПОВРЕМЕННЫЕ ДОЛЖНОСТИ · '+mk],[],
      ['Часов в смене',cfg.hours,'Шаг округления, мин',cfg.step,'Норма смен для окладов',okladNorm()],[],
      ['Сотрудник','Должность','Магазин','Смен','Часов','Начислено','Премия','Обоснование',
       'Аванс','Пенсия','ИПН','ВОСМС','Штрафы','К выплате']];
    runs.forEach(r=>aoa.push([r.name,r.role||'',r.shop||'',r.shifts,Math.round(r.hours*100)/100,
      r.accrued,r.bonus||0,r.bonusNote||'',r.advance||0,r.pension||0,r.ipn||0,r.vosms||0,r.fines||0,0]));
    const wsR=XLSX.utils.aoa_to_sheet(aoa);
    const R=6; // первая строка данных
    runs.forEach((r,i)=>{
      const row=R+i;
      // Начислено = смены × ставка. Ставка лежит в B3, бухгалтер меняет её —
      // пересчитывается весь лист.
      // Начислено не формулой: ставка у каждой должности своя, а у окладных
      // это вообще оклад по норме. Формула бы врала на смешанном листе.
      xlF(wsR,'N'+row,'F'+row+'+G'+row+'-I'+row+'-J'+row+'-K'+row+'-L'+row+'-M'+row);
      xlZ(wsR,'D'+row,'0.####');
      ['F','G','I','J','K','L','M'].forEach(c=>xlZ(wsR,c+row,XL_MONEY));
    });
    const tot=R+runs.length;
    wsR['A'+tot]={t:'s',v:'ИТОГО'};
    ['D','F','G','I','J','K','L','M','N'].forEach(c=>
      xlF(wsR,c+tot,'SUM('+c+R+':'+c+(tot-1)+')',c==='D'?'0.####':XL_MONEY));
    wsR['!cols']=[{wch:24},{wch:16},{wch:14},{wch:8},{wch:9},{wch:12},{wch:11},{wch:22},
                  {wch:11},{wch:11},{wch:11},{wch:11},{wch:11},{wch:13}];
    XLSX.utils.book_append_sheet(wb,wsR,'Повременные');
  }
  XLSX.utils.book_append_sheet(wb,wsP,'Параметры');

  XLSX.writeFile(wb,'FBSM_Начисления_'+mk+'.xlsx');
}

// ══════════════════════════════════════════════════════════════════
// МОДУЛЬ «ГРАФИК СМЕН»
// ------------------------------------------------------------------
// Полностью изолирован от расчёта ЗП: все функции с префиксом sch*,
// данные лежат в отдельных таблицах (schedule / schedule_points /
// shift_types) и читаются напрямую через PostgREST, минуя Edge
// Function. Ни computeZPCore, ни calcZP* не затрагиваются.
//
// В ячейке графика ДВА слоя:
//   planned_point — что поставили заранее (ПЛАН)
//   actual_point  — что проставилось по вводу продаж (ФАКТ)
// Раздельно специально: иначе автоотметка затирала бы план и
// невыход стал бы невидимым.
// ══════════════════════════════════════════════════════════════════
const SB_REST=API.replace('/functions/v1/api','/rest/v1');
const SCH_DOW=['вс','пн','вт','ср','чт','пт','сб'];
let SCH_POINTS=[],SCH_TYPES=[],_sch={},_schMk=null,_schShop=null;
// Какие подразделения показаны в графике. Гл. админу их обычно нужно
// несколько сразу — офис, склад и Outlet, например, — а не одно из
// списка. Выбор запоминается: возвращаться к нему каждый раз мучительно.
let _schPicked=null, _schBodyId='sch-body', _schAlertId='sch-alert';
function schPickKey(){ return 'fbsm.sched.shops.'+((CU&&CU.id)||'x'); }
function schPicked(){
  const all=schShops();
  if(_schPicked===null){
    let saved=null;
    try{ saved=JSON.parse(localStorage.getItem(schPickKey())||'null'); }catch(e){}
    _schPicked=Array.isArray(saved)?saved.filter(x=>all.indexOf(x)>=0):null;
  }
  // Пока человек не выбрал сам — показываем всё. Гл. админу иначе видна
  // одна точка из девяти, и вновь заведённый склад выглядит так, будто
  // сотрудники в график не встали. Управляющему и продавцу выбирать
  // всё равно не из чего: у них одно подразделение.
  if(!_schPicked||!_schPicked.length) _schPicked=all.slice();
  // Порядок — как в списке подразделений, а не как нащёлкали.
  return all.filter(x=>_schPicked.indexOf(x)>=0);
}
window.schShopPick=function(shop,on){
  const cur=new Set(schPicked());
  on?cur.add(shop):cur.delete(shop);
  _schPicked=[...cur];
  if(!_schPicked.length){ _schPicked=[shop]; const el=document.getElementById('schp-'+cssId(shop)); if(el)el.checked=true; }
  try{ localStorage.setItem(schPickKey(),JSON.stringify(_schPicked)); }catch(e){}
  schRender();
}
window.schShopPickAll=function(mode){
  const all=schShops();
  _schPicked = mode==='all' ? all.slice() : all.filter(isTradeShop);
  try{ localStorage.setItem(schPickKey(),JSON.stringify(_schPicked)); }catch(e){}
  pgSchedule();
}
// id из названия точки: в нём бывают пробелы и дефисы.
const cssId=s=>String(s).replace(/[^a-zA-Zа-яА-Я0-9]/g,'_');

// Чтение идёт напрямую в базу публичным ключом — он на то и публичный.
// Запись — только через сервер: ключ лежит в исходнике страницы, и пока
// таблицы были открыты, им можно было поправить чужой график, дописать
// себе часы или открыть закрытый месяц. Перехватываем в одном месте,
// чтобы правило было одно, а не двадцать три.
async function schFetch(path,opts={}){
  const m=(opts.method||'GET').toUpperCase();
  if(m!=='GET'){
    return api('dbWrite',{path,method:m,body:opts.body||null});
  }
  const r=await fetch(SB_REST+path,{...opts,headers:{
    'Content-Type':'application/json',
    'Authorization':'Bearer '+SUPABASE_ANON_KEY,
    'apikey':SUPABASE_ANON_KEY,
    ...(opts.headers||{}),
  }});
  if(!r.ok)throw new Error('График: '+(await r.text()).slice(0,180));
  if(r.status===204)return null;
  const t=await r.text();
  return t?JSON.parse(t):null;
}

async function schLoadRefs(){
  if(SCH_POINTS.length)return;
  const [p,t]=await Promise.all([
    schFetch('/schedule_points?select=*&active=is.true&order=sort'),
    schFetch('/shift_types?select=*&order=sort'),
  ]);
  SCH_POINTS=p||[];SCH_TYPES=t||[];
}
const schPoint=c=>SCH_POINTS.find(p=>p.code===c);
const schType =c=>SCH_TYPES.find(t=>t.code===c)||SCH_TYPES[0];
// У каждого магазина ровно одна торговая точка. Склад привязки не имеет.
const schPointOfShop=s=>SCH_POINTS.find(p=>p.shop===s);
// Для выбора доступны все точки того же города — так работает подмена
// между точками (плюс склад, он в том же городе).
function schPointsForShop(shop){
  const own=schPointOfShop(shop);
  if(own) return SCH_POINTS.filter(p=>p.city===own.city);
  // Своей точки у подразделения нет — склад, офис, интернет-магазин.
  // Показывать им точки чужих городов бессмысленно: под складом
  // появлялись итоги по всем магазинам сети.
  return SCH_POINTS.filter(p=>p.shop===shop);
}
// Точка нужна там, где она есть. У склада её нет, и требовать выбрать
// несуществующее — значит не дать поставить смену вовсе.
function schNeedsPoint(t,shop){
  return !!(t&&t.needs_point) && schPointsForShop(shop||_schShop).length>0;
}
function schIsWe(d){const n=new Date(d+'T00:00:00').getDay();return n===0||n===6}
function schMonthRange(mk){return[mk+'-01',mk+'-'+String(daysInMk(mk)).padStart(2,'0')]}
function schInList(arr){return'('+arr.map(v=>'"'+String(v).replace(/"/g,'')+'"').join(',')+')'}

async function schLoad(mk,uids){
  if(!uids.length)return{};
  const [a,b]=schMonthRange(mk);
  const rows=await schFetch('/schedule?select=*&date=gte.'+a+'&date=lte.'+b
    +'&uid=in.'+encodeURIComponent(schInList(uids)));
  const map={};
  (rows||[]).forEach(r=>{map[r.uid+'|'+normDate(r.date)]=r});
  return map;
}

// ── ВЕС СМЕНЫ → ОКЛАДНАЯ ЧАСТЬ ────────────────────────────────────
// Окладная часть = ставка × сумма весов отработанных смен.
// Вес берётся из типа смены в графике: полная = 1, полсмены = 0.5.
//
// Дни по-прежнему определяются записями о продажах (в т.ч. нулевыми) —
// график только уточняет, полная это была смена или половина.
//
// Если день в графике не отмечен ИЛИ график недоступен — вес 1,
// то есть ровно прежнее поведение. Модуль не может урезать оклад
// из-за собственной поломки.
let _schW={};
function schShiftWeight(uid,date){
  const r=_schW[uid+'|'+normDate(date)];
  if(!r)return 1;
  const t=schType(r.shift_type);
  // Отпуск/больничный, но продажи введены — данные противоречат друг
  // другу. Считаем как обычную смену, в пользу сотрудника.
  return(t&&t.counts_as_shift)?(+t.k||1):1;
}
// День, где нет ни продаж, ни чеков, а есть только возврат, И запись
// пришла из 1С — это НЕ смена. 1С относит возврат к продавцу исходной
// продажи, а не к тому, кто в этот день стоял за кассой: человек мог
// вообще не работать.
//
// Для записей, внесённых руками, правило не действует: раз человек сам
// открыл программу и внёс день — он на работе был.
function isReturnOnly1c(e){
  return String(e.source||'')==='1c'
    && (+e.sales||0)===0 && (+e.checks||0)===0 && (+(e.returns||0))>0;
}
function schShifts(uid,ents){
  return ents.reduce((s,e)=>s+(isReturnOnly1c(e)?0:schShiftWeight(uid,e.date)),0);
}
async function schLoadWeights(mk,uids){
  try{await schLoadRefs();_schW=await schLoad(mk,uids)}
  catch(e){_schW={};console.warn('График недоступен, все смены считаются полными:',e)}
}
// 12 → "12", 12.5 → "12,5"
const fmtSh=n=>Number.isInteger(n)?String(n):String(Math.round(n*10)/10).replace('.',',');

// Магазины, доступные текущему пользователю: продавец и управляющий —
// только свой, остальные роли — все.
function schShops(){
  // Раннер тоже сидит в одном магазине: чужие графики ему видеть незачем.
  return(CU.role==='seller'||CU.role==='manager'||isClockRole(CU.role)||CU.role==='streamer')?[CU.shop]:SHOPS;
}
// В графике участвуют продавцы и управляющие выбранного магазина.
function schVisibleUsers(shop){
  return USERS.filter(u=>STAFF_ROLES.indexOf(u.role)>=0&&u.shop===shop)
              .sort((a,b)=>a.name.localeCompare(b.name,'ru'));
}

// hasPlanMonth — есть ли у сотрудника хоть один план в этом месяце.
// Если плана нет вообще, факт без плана — это не «вышел вне графика»,
// а просто отработанная смена: нельзя нарушить график, которого нет.
function schCellHtml(u,dt,hasPlanMonth){
  const r=_sch[u.id+'|'+dt]||null;
  const t=r?schType(r.shift_type):null;
  const past=dt<today();
  const hasPlan=!!(r&&(r.planned_point||(t&&!schNeedsPoint(t))));
  const hasFact=!!(r&&r.actual_point);
  let bg='',txt='',col='#fff',cls='',ttl='';
  if(hasPlan){
    if(t&&!schNeedsPoint(t)){bg=t.color;txt=t.short;ttl=t.name}
    else{
      const p=schPoint(r.planned_point);
      bg=p?p.color:'#888780';
      txt=r.planned_point+(t&&t.code!=='full'?t.short:'');
      ttl=(p?p.name:r.planned_point)+' · '+(t?t.name:'');
    }
  }else if(hasFact){
    txt=r.actual_point;
    const pn=(schPoint(r.actual_point)||{}).name||r.actual_point;
    if(hasPlanMonth){
      col='var(--blue)';cls='extra';ttl='Вышел вне графика — '+pn;
    }else{
      col='var(--muted)';cls='noplan';ttl='Смена по факту, '+pn+' · план на месяц не заполнен';
    }
  }
  let fbg='transparent';
  if(hasFact){
    fbg='var(--green)';
    ttl+=r.actual_source==='manager-auto' ? ' · смена зачтена по графику'
        : r.actual_source==='runner'      ? ' · раннер отметился'
        : r.actual_source==='sales'       ? ' · смена подтверждена продажами'
        : ' · смена отмечена';
  }
  else if(hasPlan&&t&&t.counts_as_shift&&past){fbg='var(--red)';ttl+=' · факта нет'}
  // фон не пишем инлайном, когда его нет: иначе inline-стиль перебьёт
  // подсветку пустой клетки при наведении
  const st=bg?('background:'+bg+';color:'+col):('color:'+col);
  return '<td class="sch-day'+(schIsWe(dt)?' sch-we':'')+'">'
    +'<div class="sch-cell '+cls+'" title="'+ttl+'" onclick="schOpen(\''+u.id+'\',\''+dt+'\')">'
    +'<div class="sch-p" style="'+st+'">'+txt+'</div>'
    +'<div class="sch-f"'+(fbg==='transparent'?'':' style="background:'+fbg+'"')+'></div></div></td>';
}


// Смены раннеров за месяц: uid → { дата → минуты, всего минут, смен }.
// Графику и табелю нужны именно часы: у раннера клетка не равна смене,
// он мог отработать полсмены, и в оплату идёт доля.
let _schRun={};
async function schLoadRunners(mk,users){
  _schRun={};
  const ids=users.filter(u=>u.role==='runner').map(u=>u.id);
  if(!ids.length)return;
  let rows=[];
  try{
    rows=await schFetch('/runner_shifts?select=*&uid=in.'+encodeURIComponent(schInList(ids))
      +'&date=gte.'+mk+'-01&date=lte.'+mk+'-31')||[];
  }catch(e){ return; }
  const byUid={};
  rows.forEach(r=>{(byUid[r.uid]=byUid[r.uid]||[]).push(r)});
  Object.keys(byUid).forEach(uid=>{_schRun[uid]=runnerTotals(byUid[uid],roleOf(uid))});
}
function schRunTotal(uid){ return _schRun[uid]||{days:{},min:0,shifts:0}; }

// Каждое выбранное подразделение рисуется своим блоком: таблица графика
// у них разная по составу людей и точек, и склеить их в одну нельзя.
// Перерисовку запускает каждая галочка. Пока идёт одна, могла начаться
// вторая — и два прохода наперегонки писали в общий _schShop. В итоге
// под Карагандой оказывалась тревога про астанинскую точку, а сотрудники
// одного магазина — в блоке другого. Метка поколения гасит опоздавших.
let _schGen=0;
async function schRender(){
  const gen=++_schGen;
  const host=document.getElementById('sch-all');
  if(!host) return schRenderShop();
  const list=schPicked();
  host.innerHTML=list.map((sh,i)=>
    '<div style="margin-top:1rem">'
    +(list.length>1?'<div class="ct" style="margin-bottom:.4rem">'+esc(sh)+'</div>':'')
    +'<div id="scha-'+i+'"></div>'
    +'<div class="card" id="schb-'+i+'"><div class="spin" style="margin:1rem auto;display:block"></div></div>'
    +'</div>').join('');
  for(let i=0;i<list.length;i++){
    if(gen!==_schGen)return;
    _schShop=list[i]; _schBodyId='schb-'+i; _schAlertId='scha-'+i;
    await schRenderShop(gen);
    if(gen!==_schGen)return;
  }
  _schBodyId='sch-body'; _schAlertId='sch-alert';
}

async function schRenderShop(gen){
  const body=document.getElementById(_schBodyId),box=document.getElementById(_schAlertId);
  // Подразделение запоминаем на входе: пока идут запросы, глобальное
  // значение может смениться, и блок оказался бы про чужой магазин.
  const shop=_schShop;
  const stale=()=>gen!==undefined&&gen!==_schGen;
  if(!body)return;
  body.innerHTML='<div class="spin" style="margin:1rem auto;display:block"></div>';
  const users=schVisibleUsers(shop);
  if(!users.length){
    body.innerHTML='<div style="color:var(--muted)">В подразделении «'+shop+'» нет сотрудников.</div>';
    if(box)box.innerHTML='';return;
  }
  try{_sch=await schLoad(_schMk,users.map(u=>u.id)); await schLoadRunners(_schMk,users);}
  catch(e){body.innerHTML='<div class="alert ae">'+e.message+'</div>';return}

  const days=[];
  for(let d=1;d<=daysInMk(_schMk);d++)days.push(_schMk+'-'+String(d).padStart(2,'0'));

  let h='<div class="sch-wrap"><table class="sch"><thead><tr><th class="sch-name">Сотрудник</th>';
  days.forEach(dt=>{
    const d=new Date(dt+'T00:00:00');
    h+='<th class="sch-day'+(schIsWe(dt)?' sch-we':'')+'"><span class="sch-dn">'+d.getDate()
      +'</span><span class="sch-dw">'+SCH_DOW[d.getDay()]+'</span></th>';
  });
  h+='<th class="sch-tot">План</th><th class="sch-tot">Факт</th></tr></thead><tbody>';

  const rm=ROLE_LABELS;
  // у кого в этом месяце вообще есть план — от этого зависит,
  // считать ли факт без плана выходом вне графика
  const hasPlan={};
  users.forEach(u=>{
    hasPlan[u.id]=days.some(dt=>{
      const r=_sch[u.id+'|'+dt];if(!r)return false;
      const t=schType(r.shift_type);
      return !!(r.planned_point||(t&&!schNeedsPoint(t)));
    });
  });
  users.forEach(u=>{
    let pc=0,fc=0,row='';
    days.forEach(dt=>{
      const r=_sch[u.id+'|'+dt];
      if(r){
        const t=schType(r.shift_type);
        if(t&&t.counts_as_shift&&(r.planned_point||!schNeedsPoint(t)))pc++;
        if(r.actual_point)fc++;
      }
      row+=schCellHtml(u,dt,hasPlan[u.id]);
    });
    // У раннера клетка не равна смене: он мог отработать полсмены,
    // и в оплату идёт доля. Показываем её и часы рядом.
    const rt=u.role==='runner'?schRunTotal(u.id):null;
    const factCol=rt
      ? fmtSh(Math.round(rt.shifts*100)/100)
        +'<div style="font-size:10px;color:var(--muted)">'+hhmm(rt.min)+'</div>'
      : String(fc);
    h+='<tr><td class="sch-name"><b>'+esc(u.name)+'</b><div style="font-size:11px;color:var(--muted)">'
      +(rm[u.role]||u.role)+'</div></td>'+row
      +'<td class="sch-tot">'+pc+'</td><td class="sch-tot">'+factCol+'</td></tr>';
  });

  if(stale())return;
  const pts=schPointsForShop(shop),own=schPointOfShop(shop),uncov=[];
  pts.forEach(p=>{
    let tot=0,cells='';
    days.forEach(dt=>{
      let c=0;
      users.forEach(u=>{
        const r=_sch[u.id+'|'+dt];
        if(r&&r.planned_point===p.code){const t=schType(r.shift_type);if(t&&t.counts_as_shift)c++}
      });
      tot+=c;
      if(own&&p.code===own.code&&c===0)uncov.push(dt);
      cells+='<td class="sch-day'+(schIsWe(dt)?' sch-we':'')+'" style="text-align:center">'+(c||'')+'</td>';
    });
    h+='<tr class="sch-sum"><td class="sch-name">Итого · '+esc(p.name)+'</td>'+cells
      +'<td class="sch-tot">'+tot+'</td><td class="sch-tot"></td></tr>';
  });
  h+='</tbody></table></div><div class="sch-legend">';
  pts.forEach(p=>h+='<span><span class="sch-dot" style="background:'+esc(p.color)+'"></span>'
    +esc(p.code)+' — '+esc(p.name)+'</span>');
  h+='<span style="margin-left:auto"><span class="sch-dot" style="background:var(--green)"></span>смена подтверждена продажами</span>'
    +'<span><span class="sch-dot" style="background:var(--red)"></span>план был, факта нет</span>'
    +'<span><span class="sch-dot" style="border:2px dashed var(--blue)"></span>вышел вне графика</span></div>';
  h+=await schSignatureBar(_schMk,shop);
  if(stale())return;
  body.innerHTML=h;

  if(box){
    // Ближайшие дни выделяем отдельно: именно они блокируют ввод продаж
    const lim=schAddDays(today(),SCH_HORIZON_DAYS);
    const future=uncov.filter(d=>d>=today());
    const soon=future.filter(d=>d<=lim), later=future.filter(d=>d>lim);
    let h='';
    if(own&&soon.length)
      h+='<div class="alert" style="background:var(--al);color:var(--amber)">⚠️ Не закрыты ближайшие '
        +SCH_HORIZON_DAYS+' дней на точке «'+own.name+'»: '
        +schDatesLabel(soon)+'. Продажи это не останавливает, но продавец, которого нет в графике, ввести их не сможет'
        +(curMk()<SCH_ENFORCE_FROM?' (с '+schEnforceLabel()+')':'')+'.</div>';
    if(own&&later.length)
      h+='<div class="alert" style="background:var(--al);color:var(--amber)">⚠️ Дальше в месяце не закрыто: '
        +schDatesLabel(later.slice(0,20))+(later.length>20?' и ещё '+(later.length-20):'')+'</div>';
    box.innerHTML=h;
  }
}

  ov.innerHTML=`<div class="ovc" style="max-width:430px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.25rem">
      <div><b>${u?u.name:''}</b>
        <div style="font-size:12px;color:var(--muted)">${d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'long'})}</div></div>
      <button class="btn bsm" onclick="this.closest('.ov').remove()">✕</button>
    </div>
    <div class="fl">Точка</div>
    <div class="sch-opts" id="sch-pts">${pts.map(p=>
      `<button class="sch-opt ${curP===p.code?'sel':''}" data-p="${p.code}" onclick="schPick(this)">
        <span class="sch-dot" style="background:${p.color}"></span>${p.code} — ${p.name}</button>`).join('')}</div>
    <div class="fl">Тип смены</div>
    <div class="sch-opts" id="sch-tps">${SCH_TYPES.map(t=>
      `<button class="sch-opt ${curT===t.code?'sel':''}" data-t="${t.code}" onclick="schPick(this)">${t.name}</button>`).join('')}</div>
    <div id="sch-note" style="font-size:12px;color:var(--muted);margin-bottom:1rem;min-height:16px"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn bp" onclick="schSave('${uid}','${dt}')">Сохранить</button>
      ${r?`<button class="btn bd2" onclick="schClear('${uid}','${dt}')">Убрать смену</button>`:''}
      <button class="btn" onclick="this.closest('.ov').remove()">Отмена</button>
    </div>
    ${r&&r.actual_point?`<div style="margin-top:1rem;font-size:12px;color:var(--green)">
      ✓ Факт: ${r.actual_point}${
        r.actual_source==='sales'?' (проставлено автоматически по продажам)'
        :r.actual_source==='manager-auto'?' (зачтено по графику — управляющий продажи не подтверждает)'

        :''}</div>`:''}
  </div>`;
  document.body.appendChild(ov);

}
window.schPick=function(btn){
  btn.parentElement.querySelectorAll('.sch-opt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');schNote();
}
function schNote(){
  const ov=document.getElementById('sch-ov');if(!ov)return;
  const sel=ov.querySelector('#sch-tps .sel');
  const t=schType(sel?sel.dataset.t:'full');
  const pw=ov.querySelector('#sch-pts'),note=ov.querySelector('#sch-note');
  if(t&&!schNeedsPoint(t)){
    pw.style.opacity='.35';pw.style.pointerEvents='none';
    // Точка бывает не нужна по двум разным причинам: это выходной или
    // больничный, либо у подразделения точек нет вовсе. Смена при этом
    // засчитывается, и говорить обратное — врать в глаза.
    note.textContent=t.name+' — точка не нужна'
      +(t.counts_as_shift?', смена засчитывается.':', в число смен не входит.');
  }else{
    pw.style.opacity='1';pw.style.pointerEvents='auto';
    note.textContent=(t&&+t.k!==1)?('Коэффициент к окладу: '+t.k):'';
  }
}
window.schSave=async function(uid,dt){
  const ov=document.getElementById('sch-ov');
  const ts=ov.querySelector('#sch-tps .sel'),t=schType(ts?ts.dataset.t:'full');
  const ps=ov.querySelector('#sch-pts .sel');
  const u=USERS.find(x=>String(x.id)===String(uid));
  const need=schNeedsPoint(t,u?u.shop:_schShop);
  const pCode=need?(ps?ps.dataset.p:null):null;
  if(need&&!pCode){alert('Выберите точку');return}
  const prev=_sch[uid+'|'+dt]||{};
  L(true);
  try{
    await schFetch('/schedule',{method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify([{uid:String(uid),date:dt,shop:u?u.shop:_schShop,
        planned_point:pCode,actual_point:prev.actual_point||null,
        actual_source:prev.actual_source||null,shift_type:t.code,updated_by:CU.name}])});
  }catch(e){L(false);alert(e.message);return}
  L(false);ov.remove();await schRender();
}
window.schClear=async function(uid,dt){
  L(true);
  try{await schFetch('/schedule?uid=eq.'+encodeURIComponent(uid)+'&date=eq.'+dt,{method:'DELETE'})}
  catch(e){L(false);alert(e.message);return}
  L(false);
  const ov=document.getElementById('sch-ov');if(ov)ov.remove();
  await schRender();
}

// ── ЭКСПОРТ ТАБЕЛЯ ────────────────────────────────────────────────
// Три листа: План / Факт / Свод. План и факт разнесены по разным
// листам намеренно — в одну клетку два значения не положить, а
// расхождение между ними и есть самое интересное.
window.schExportExcel=function(){
  if(typeof XLSX==='undefined'){alert('Библиотека Excel не загрузилась. Обнови страницу.');return}
  const users=schVisibleUsers(_schShop);
  if(!users.length){alert('В этом магазине нет сотрудников.');return}
  const nd=daysInMk(_schMk),days=[];
  for(let d=1;d<=nd;d++)days.push(_schMk+'-'+String(d).padStart(2,'0'));
  const [yy,mm]=_schMk.split('-');
  const title=new Date(+yy,+mm-1,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  const rm=ROLE_LABELS;
  const pts=schPointsForShop(_schShop);
  const wb=XLSX.utils.book_new();

  // значение клетки: план (с пометкой типа) либо метка отпуска/больничного
  const planCell=(u,dt)=>{
    const r=_sch[u.id+'|'+dt];if(!r)return'';
    const t=schType(r.shift_type);
    if(t&&!t.needs_point)return t.short;
    return r.planned_point?r.planned_point+(t&&t.code!=='full'?t.short:''):'';
  };
  const factCell=(u,dt)=>{
    // Раннеру в табеле важны часы, а не буква точки: у него смена дробная.
    if(u.role==='runner'){
      const m=(schRunTotal(u.id).days||{})[dt];
      return m?Math.round(m/60*100)/100:'';
    }
    const r=_sch[u.id+'|'+dt];return r&&r.actual_point?r.actual_point:'';
  };
  // код точки для подсчёта итогов — берём из данных, а не разбираем текст клетки
  const planCode=(u,dt)=>{const r=_sch[u.id+'|'+dt];return r?r.planned_point:null};
  const factCode=(u,dt)=>{const r=_sch[u.id+'|'+dt];return r?r.actual_point:null};

  const sheet=(pick,label,code)=>{
    const aoa=[['ТАБЕЛЬ · '+label+' · '+_schShop+' · '+title],[],
      ['Сотрудник','Должность',...days.map(d=>+d.slice(-2)),'Итого']];
    users.forEach(u=>{
      let n=0;
      const row=days.map(dt=>{const v=pick(u,dt);if(v)n++;return v});
      aoa.push([u.name,rm[u.role]||u.role,...row,n]);
    });
    aoa.push([]);
    pts.forEach(p=>{
      let tot=0;
      const row=days.map(dt=>{
        let c=0;users.forEach(u=>{if(code(u,dt)===p.code)c++});
        tot+=c;return c||'';
      });
      aoa.push(['Итого · '+p.name,'',...row,tot]);
    });
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[{wch:26},{wch:14},...days.map(()=>({wch:4.5})),{wch:8}];
    ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:days.length+2}}];
    return ws;
  };
  XLSX.utils.book_append_sheet(wb,sheet(planCell,'ПЛАН',planCode),'План');
  XLSX.utils.book_append_sheet(wb,sheet(factCell,'ФАКТ',factCode),'Факт');

  // ── Свод: смены по типам + расхождение план/факт ──
  const aoa=[['СВОД ПО СМЕНАМ · '+_schShop+' · '+title],[],
    ['Сотрудник','Должность',...SCH_TYPES.map(t=>t.name),
     'Смен по плану','Смен подтверждено','Невыходов','Вне графика','СМЕН К ОПЛАТЕ','Часов']];
  users.forEach(u=>{
    const cnt={},row=[];let plan=0,fact=0,miss=0,extra=0,weighted=0;
    SCH_TYPES.forEach(t=>cnt[t.code]=0);
    days.forEach(dt=>{
      const r=_sch[u.id+'|'+dt];if(!r)return;
      const t=schType(r.shift_type);
      const hasPlan=!!(r.planned_point||(t&&!t.needs_point));
      if(hasPlan&&t)cnt[t.code]++;
      if(hasPlan&&t&&t.counts_as_shift){plan++;weighted+=(+t.k||1)}
      if(r.actual_point)fact++;
      if(hasPlan&&t&&t.counts_as_shift&&!r.actual_point&&dt<today())miss++;
      if(!hasPlan&&r.actual_point)extra++;
    });
    SCH_TYPES.forEach(t=>row.push(cnt[t.code]||''));
    // Раннеру смены к оплате считаем по отметкам прихода-ухода, а не по
    // клеткам графика: полсмены — это 0,6875, а не единица.
    let toPay=weighted, hours='';
    if(u.role==='runner'){
      const rt=schRunTotal(u.id);
      toPay=Math.round(rt.shifts*10000)/10000;
      hours=Math.round(rt.min/60*100)/100;
    }
    aoa.push([u.name,rm[u.role]||u.role,...row,plan,fact,miss||'',extra||'',toPay,hours]);
  });
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:26},{wch:14},...SCH_TYPES.map(t=>({wch:Math.max(11,t.name.length+2)})),
    {wch:14},{wch:18},{wch:12},{wch:13},{wch:16},{wch:9}];
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:SCH_TYPES.length+7}}];
  XLSX.utils.book_append_sheet(wb,ws,'Свод');

  XLSX.writeFile(wb,'FBSM_Табель_'+_schShop+'_'+_schMk+'.xlsx');
}

// ЗАКРЫТИЕ МЕСЯЦА И ЖУРНАЛ ИЗМЕНЕНИЙ
// ------------------------------------------------------------------
// Закрытый месяц — тот, по которому зарплата уже выдана. Править в нём
// продажи, планы и корректировки нельзя: начисление разъедется с тем,
// что реально получили на руки.
//
// Проверка идёт на клиенте, как и всё остальное разграничение прав
// в этой программе. От случайной правки защищает, от намеренной —
// нет; это чинится только переносом проверок в Edge Function.
// ══════════════════════════════════════════════════════════════════
let _closed=null;   // Set из '2026-07'

async function loadClosed(force){
  if(_closed&&!force)return _closed;
  try{
    const r=await schFetch('/closed_months?select=mk');
    _closed=new Set((r||[]).map(x=>x.mk));
  }catch(e){ _closed=new Set(); }   // таблицы ещё нет — ничего не блокируем
  return _closed;
}
function isClosed(mk){ return !!(_closed&&_closed.has(normMk(mk))); }

// Единая проверка перед любой правкой. Возвращает текст ошибки или null.
function closedGuard(mk){
  return isClosed(mk)
    ? 'Месяц '+normMk(mk)+' закрыт бухгалтером — зарплата по нему уже начислена. Правки запрещены.'
    : null;
}
function sayClosed(msg,elId){
  const m=elId?document.getElementById(elId):null;
  if(m){m.style.cssText='';m.className='alert ae';m.textContent='🔒 '+msg}
  else alert('🔒 '+msg);
}

// Журнал: пишем и забываем. Ошибка записи не должна ломать операцию —
// иначе журнал станет причиной сбоев вместо страховки.
function logAction(action,target,mk,details){
  try{
    schFetch('/audit_log',{method:'POST',body:JSON.stringify([{
      who:CU?CU.name:null, who_role:CU?CU.role:null,
      action, target:target||null, mk:mk?normMk(mk):null,
      details:details||null
    }])}).catch(()=>{});
  }catch(e){}
}

window.toggleMonthClosed=async function(mk){
  await loadClosed(true);
  const closing=!isClosed(mk);
  const q=closing
    ? 'Закрыть '+mk+'?\n\nПосле этого продажи, планы и корректировки за этот месяц править будет нельзя.\nДелайте это после того, как зарплата выдана.'
    : 'Открыть '+mk+' обратно?\n\nПравки снова станут возможны.';
  if(!confirm(q))return;
  L(true);
  try{
    if(closing){
      await schFetch('/closed_months',{method:'POST',
        headers:{'Prefer':'resolution=merge-duplicates'},
        body:JSON.stringify([{mk,closed_by:CU.name}])});
    }else{
      await schFetch('/closed_months?mk=eq.'+encodeURIComponent(mk),{method:'DELETE'});
    }
    logAction(closing?'closeMonth':'reopenMonth',null,mk,null);
    await loadClosed(true);
  }catch(e){L(false);alert('Не удалось: '+e.message+'\n\nВозможно, не выполнен скрипт 03_closed_months_audit.sql');return}
  L(false);
  loadPayroll();
}

// очереди, пока главный администратор не назначит роль и магазин.

// Иначе список сотрудников засорился бы служебными учётками 1С
// (Loyal, obmen, Prosystems, Менеджер ИМ) и людьми с другой
// мотивацией, а расчёт по магазинам поехал бы.

async function queuePending(){
  try{
    // Сначала те, кто реально продаёт: у них решение срочнее.
    // Остальных тоже показываем — среди них будущие кассиры и другие
    // роли, которым позже назначат свои должности и сетки.
    return await schFetch('/import_queue?select=*&status=eq.pending'
      +'&order=sales_amount.desc,name.asc')||[];
  }catch(e){ return []; }   // таблицы ещё нет — молчим
}

// Счётчик в боковом меню. Дорисовывается после отрисовки меню,
// потому что требует запроса, а меню строится сразу.
async function queueBadge(){
  if(!CU||CU.role!=='admin')return;
  const rows=await queuePending();
  const el=document.getElementById('n-pgQueue');
  if(!el)return;
  const old=el.querySelector('.qbadge'); if(old)old.remove();
  if(!rows.length)return;
  const b=document.createElement('span');
  b.className='qbadge';
  b.style.cssText='margin-left:auto;background:var(--amber);color:#fff;border-radius:100px;'
    +'font-size:11px;font-weight:700;padding:1px 7px';
  b.textContent=rows.length;
  el.appendChild(b);
}
