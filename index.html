// ПОДТВЕРЖДЕНИЕ ПРОДАЖ ИЗ 1С
// ------------------------------------------------------------------
// Данные из 1С попадают в предбанник sales_pending, а не сразу в
// расчёт. Консультант видит свои цифры за день, править не может,
// жмёт «Подтвердить» — и только тогда день уходит в sales и идёт
// в зарплату. Не подтвердил — дня нет, смены нет.
//
// Смысл не в контроле, а в том, чтобы человек каждый день видел свою
// выручку и процент плана, а не узнавал о них из расчётного листа.
//
// Подтверждать можно задним числом. Автоподтверждения нет намеренно.
// Если 1С позже поправит уже подтверждённый день — цифры обновятся
// тихо, повторно подтверждать не нужно.
// ══════════════════════════════════════════════════════════════════

// Ждут подтверждения у конкретного сотрудника
async function pendingFor(uid){
  try{
    return await schFetch('/sales_pending?select=*&uid=eq.'+encodeURIComponent(uid)
      +'&confirmed_at=is.null&order=date.desc')||[];
  }catch(e){ return []; }   // таблицы ещё нет — ведём себя как раньше
}
// Сколько неподтверждённых дней у продавцов магазина
async function pendingCount(uids, full){
  if(!uids.length)return [];
  try{
    return await schFetch('/sales_pending?select='+(full?'*':'uid,date')
      +'&confirmed_at=is.null&uid=in.'+encodeURIComponent(schInList(uids))
      +'&order=date')||[];
  }catch(e){ return []; }
}

window.confirmDay=async function(date,btn){
  const shut=closedGuard(date);
  if(shut){alert('🔒 '+shut);return}
  if(btn)btn.disabled=true;
  L(true);
  try{
    const rows=await schFetch('/sales_pending?select=*&uid=eq.'+encodeURIComponent(CU.id)
      +'&date=eq.'+date);
    const r=rows&&rows[0];
    if(!r){L(false);alert('Данные за '+date+' не найдены');return}
    // В расчёт данные попадают ровно здесь и только здесь
    await apiPost('saveSale',{uid:CU.id,date,
      sales:+r.sales||0,checks:+r.checks||0,units:+r.units||0,returns:+r.returns||0,
      source:'1c'});
    await schFetch('/sales_pending?uid=eq.'+encodeURIComponent(CU.id)+'&date=eq.'+date,
      {method:'PATCH',body:JSON.stringify({confirmed_at:new Date().toISOString(),confirmed_by:CU.name})});
    logAction('confirmSales',CU.name,date,{sales:+r.sales||0,checks:+r.checks||0,units:+r.units||0});
    // День, где только возврат, смену не создаёт — ни в зарплате, ни в
    // графике. На человека просто оформили возврат его прежней продажи,
    // работать в этот день он мог и не выходить.
    const retOnly=(+r.sales||0)===0&&(+r.checks||0)===0&&(+(r.returns||0))>0;
    if(!retOnly) schMarkActual(CU.id,date,CU.shop).catch(e=>schMarkFailed(CU.id,date,e.message));
    _sales=await api('getSales',{uid:CU.id});
  }catch(e){ L(false); if(btn)btn.disabled=false; alert('Не удалось подтвердить: '+e.message); return; }
  L(false);
  // Возвращаемся туда, откуда подтверждали: из истории — в историю
  if(_page==='pgHist') loadHist(); else pgEnter();
}




// 1С могла поправить документ задним числом — например, оформили
// возврат или перепровели чек. Подтверждённый день тогда обновляем
// ТИХО: человек уже подтвердил, что смена была, а сумма должна
// соответствовать 1С. Повторно дёргать его незачем.
//
// Закрытые месяцы не трогаем: там зарплата уже выдана.
// Месяц, за который переносим правки 1С. Ставится перед вызовом.
let _syncMk=null;
async function syncConfirmed(uids,mk){
  _syncMk=mk||curMk();
  if(!uids||!uids.length)return 0;
  let rows;
  try{
    // Только показываемый месяц: тащить всю историю ради трёх изменившихся
    // дней — это лишние сотни строк на каждом открытии начисления.
    rows=await schFetch('/sales_pending?select=*&confirmed_at=not.is.null&uid=in.'
      +encodeURIComponent(schInList(uids))
      +'&date=gte.'+_syncMk+'-01&date=lte.'+_syncMk+'-31');
  }catch(e){ return 0; }
  const stale=(rows||[]).filter(r=>{
    if(!r.src_updated_at||!r.confirmed_at)return false;
    if(isClosed(normMk(normDate(r.date))))return false;
    return Date.parse(r.src_updated_at)>Date.parse(r.confirmed_at);
  });
  let done=0;
  // Пачками по шесть: на десятке изменившихся дней это разница между
  // тремя секундами и половиной секунды, а сервер столько держит легко.
  const chunks=[];
  for(let i=0;i<stale.length;i+=6) chunks.push(stale.slice(i,i+6));
  for(const chunk of chunks){
  await Promise.all(chunk.map(async r=>{
    const date=normDate(r.date);
    try{
      await apiPost('saveSale',{uid:r.uid,date,
        sales:+r.sales||0,checks:+r.checks||0,units:+r.units||0,returns:+r.returns||0,
        source:'1c'});
      await schFetch('/sales_pending?uid=eq.'+encodeURIComponent(r.uid)+'&date=eq.'+date,
        {method:'PATCH',body:JSON.stringify({confirmed_at:new Date().toISOString()})});
      logAction('resyncFrom1C',r.uid,date,{sales:+r.sales||0,checks:+r.checks||0,units:+r.units||0});
      done++;
    }catch(e){ console.warn('Пересинхронизация',date,e); }
  }));
  }
  return done;
}


// Массовое подтверждение — для первой заливки и для случаев, когда
// продавцы затянули. Обычный путь всё равно через самого продавца:
// смысл подтверждения в том, чтобы человек увидел свои цифры.
// Поэтому кнопка только у бухгалтера и главного администратора.
async function confirmRows(rows, onProgress){
  let done=0, skipped=0, failed=[];
  for(const r of rows){
    const date=normDate(r.date);
    if(closedGuard(date)){ skipped++; continue; }
    try{
      await apiPost('saveSale',{uid:r.uid,date,
        sales:+r.sales||0,checks:+r.checks||0,units:+r.units||0,returns:+r.returns||0,
        source:'1c'});
      await schFetch('/sales_pending?uid=eq.'+encodeURIComponent(r.uid)+'&date=eq.'+date,
        {method:'PATCH',body:JSON.stringify({
          confirmed_at:new Date().toISOString(), confirmed_by:CU.name})});
      // День с одним лишь возвратом смены не создаёт — см. isReturnOnly1c
      const retOnly=(+r.sales||0)===0&&(+r.checks||0)===0&&(+(r.returns||0))>0;
      if(!retOnly){
        const u=USERS.find(x=>String(x.id)===String(r.uid));
        schMarkActual(r.uid,date,u?u.shop:null).catch(()=>{});
      }
      done++;
    }catch(e){ failed.push(date+' '+e.message); }
    if(onProgress) onProgress(done+skipped+failed.length, rows.length);
  }
  return {done,skipped,failed};
}

window.confirmAllPending=async function(btn){
  const sellers=getVisibleSellers();
  const all=await pendingCount(sellers.map(u=>u.id), true);
  // Сегодняшний день не трогаем: его продавец подтверждает сам, увидев
  // свои цифры. Массово закрываем только прошлые дни.
  const today_=today();
  const rows=all.filter(r=>normDate(r.date)<today_);
  const skipToday=all.length-rows.length;
  if(!rows.length){
    alert(skipToday?'Остались только сегодняшние дни — их подтверждают сами продавцы.'
                   :'Нечего подтверждать');
    return;
  }
  if(!confirm('Подтвердить данные из 1С за прошлые дни?\n\nДней: '+rows.length
    +(skipToday?'\nСегодняшних дней пропустим: '+skipToday+' — их подтвердят продавцы.':'')
    +'\n\nОни попадут в расчёт зарплаты и в график. Обычно это делает сам продавец — '
    +'массовое подтверждение нужно для первой заливки.'))return;
  if(btn){btn.disabled=true;btn.textContent='Подтверждаю…';}
  L(true);
  const res=await confirmRows(rows,(i,total)=>{
    if(btn)btn.textContent='Подтверждаю… '+i+' из '+total;
  });
  logAction('confirmAll',null,null,{done:res.done,skipped:res.skipped});
  L(false);
  let msg='✓ Подтверждено дней: '+res.done;
  if(res.skipped)msg+='. Пропущено из-за закрытых месяцев: '+res.skipped;
  if(res.failed.length)msg+='. Ошибок: '+res.failed.length;
  alert(msg);
  pgReport();
}

// Кто не подтвердил свои дни. Показывается управляющему, бухгалтеру и
// админу на «Сводке»: подтверждение — обязанность продавца, но следить
// за ним приходится тому, кто отвечает за магазин.
async function renderNotConfirmed(){
  const box=document.getElementById('notconf-box');
  if(!box)return;
  const sellers=getVisibleSellers();
  const rows=await pendingCount(sellers.map(u=>u.id));
  if(!rows.length){box.innerHTML='';return}
  const byUid={};
  rows.forEach(r=>{(byUid[r.uid]=byUid[r.uid]||[]).push(normDate(r.date))});
  const items=Object.entries(byUid).map(function(e){
    const uid=e[0], dates=e[1];
    const u=sellers.find(x=>String(x.id)===String(uid));
    dates.sort();
    return {name:u?u.name:uid, shop:u?u.shop:'', dates:dates};
  }).sort((a,b)=>b.dates.length-a.dates.length);
  const total=rows.length;
  box.innerHTML='<div class="card" style="border-color:var(--amber)">'
    +'<div class="ct">\u23F3 Не подтверждены данные из 1С — '+total+' дн.</div>'
    +'<div style="font-size:12.5px;color:var(--muted);margin-bottom:.75rem">'
    +'Пока продавец не подтвердит день, он не идёт в зарплату и смена не засчитывается.</div>'
    +((CU.role==='admin'||CU.role==='accountant')
       ?'<button class="btn bp" style="margin-bottom:.75rem" onclick="confirmAllPending(this)">'
        +'✓ Подтвердить все ('+total+')</button>':'')
    +'<div class="tw-wrap"><table><tr><th>Продавец</th><th>Магазин</th><th>Дней</th><th>Какие</th></tr>'
    +items.map(i=>'<tr><td><b>'+esc(i.name)+'</b></td><td>'+esc(i.shop)+'</td>'
      +'<td><span class="tag tw">'+i.dates.length+'</span></td>'
      +'<td style="font-size:12px">'+schDatesLabel(i.dates)+'</td></tr>').join('')
    +'</table></div></div>';
}

// ── ИНТЕГРАЦИЯ С ВВОДОМ ПРОДАЖ ────────────────────────────────────
// Горизонт планирования: график магазина должен быть закрыт на
// ближайшие 7 дней, считая от сегодня.
//
// Проверяем ПОКРЫТИЕ МАГАЗИНА, а не отдельного человека. Выходной в
// графике — это просто пустая клетка, поэтому «у продавца заполнены
// все дни» проверить невозможно: законный выходной неотличим от
// незаполненного дня. А вот «на точке в этот день кто-то стоит» —
// проверяется однозначно и совпадает по смыслу с алертом наверху
// вкладки «График».
const SCH_HORIZON_DAYS=7;

// С какого месяца блокировка работает жёстко. Раньше — только
// предупреждение, продажи сохраняются. Нужно, чтобы включение модуля
// не остановило ввод выручки в уже идущем месяце.
const SCH_ENFORCE_FROM='2026-08';

const SCH_MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function schAddDays(d,n){
  const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
}
// '2026-08' → «1 августа» — дата, с которой включается запрет
function schEnforceLabel(){
  const p=SCH_ENFORCE_FROM.split('-');
  return new Date(+p[0],+p[1]-1,1).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
}
// ['2026-07-31','2026-08-01'] → «31 июл · 1 авг»
function schDatesLabel(ds){
  const g={};
  ds.forEach(d=>{const p=d.split('-');(g[p[1]]=g[p[1]]||[]).push(+p[2])});
  return Object.keys(g).sort().map(m=>g[m].join(', ')+' '+SCH_MON[+m-1]).join(' · ');
}

// Дни ближайшего горизонта, на которые в магазине никто не поставлен.
// null — проверять нечего (у магазина нет торговой точки).
async function schUncoveredAhead(shop){
  await schLoadRefs();
  const own=schPointOfShop(shop);
  if(!own)return null;
  const a=today(),b=schAddDays(a,SCH_HORIZON_DAYS);
  const rows=await schFetch('/schedule?select=date,planned_point,shift_type&shop=eq.'
    +encodeURIComponent(shop)+'&date=gte.'+a+'&date=lte.'+b);
  const covered=new Set();
  (rows||[]).forEach(r=>{
    const t=schType(r.shift_type);
    if(r.planned_point===own.code&&t&&t.counts_as_shift)covered.add(normDate(r.date));
  });
  const miss=[];
  for(let d=a;d<=b;d=schAddDays(d,1))if(!covered.has(d))miss.push(d);
  return miss;
}

// Есть ли у человека смена в этот день. Продажи вводит тот, кто работал,
// и если его в графике нет — оплаченный день не попадёт в табель, а табель
// разойдётся с начислением. Раньше вместо этого останавливали весь магазин
// из-за пустого дня у кого угодно: страдали непричастные.
async function schGuardSelf(uid,date){
  // Пока месяц не наступил под правило — никого не держим.
  if(curMk()<SCH_ENFORCE_FROM)return{st:'ok'};
  let rows;
  // Модуль графика недоступен — не мешаем работать: выручка важнее.
  try{
    rows=await schFetch('/schedule?select=date,planned_point,actual_point,shift_type'
      +'&uid=eq.'+encodeURIComponent(uid)+'&date=eq.'+date);
  }catch(e){ return{st:'ok'}; }
  const r=(rows||[])[0];
  if(!r)return{st:'block',why:'нет'};
  const t=schType(r.shift_type);
  // Выходной и больничный — тоже «нет смены»: продаж в такой день быть
  // не должно, а если они есть, разбираться должен управляющий.
  if(t&&!t.counts_as_shift)return{st:'block',why:t.name.toLowerCase()};
  return{st:'ok'};
}

// {st:'ok'|'soft'|'block', miss:[даты]}
// Если модуль графика недоступен — всегда 'ok': поломка графика
// не должна мешать сохранять выручку.
async function schGuard(shop){
  let miss=null;
  try{miss=await schUncoveredAhead(shop)}catch(e){return{st:'ok'}}
  if(!miss||!miss.length)return{st:'ok'};
  // Дыра в графике магазина — повод сказать, а не повод остановить продажи.
  // Виноват в ней управляющий, а расплачивались бы продавцы.
  return{st:'soft',miss};
}
// saved=false — продажи не сохранены (жёсткая блокировка)
// saved=true  — сохранены, но график впереди дырявый (мягкий период)
function schSayGuard(g,saved,date){
  const days=schDatesLabel(g.miss||[]);
  const txt=saved
    ? '✓ Сохранено за '+date+'. Но в графике магазина пусто на ближайшие '
      +SCH_HORIZON_DAYS+' дней: '+days+'. Скажите управляющему — вкладка «📅 График».'
    : '⚠️ График магазина не закрыт на ближайшие '+SCH_HORIZON_DAYS+' дней. '
      +'Никто не поставлен: '+days+'. Продажи это не задерживает, но управляющему стоит проставить смены.';
  const m=document.getElementById('emsg');
  if(!m){alert(txt);return}
  m.style.cssText=saved?'background:var(--al);color:var(--amber)':'';
  m.className=saved?'alert':'alert ae';
  m.textContent=txt;
}
// Автоотметка факта смены по дате ввода продаж.
// Точка берётся из плана, если он есть; иначе — точка магазина.
// Если отметку поставить не удалось, день будет оплачен, но в табеле
// его не будет. Молчать об этом нельзя — пишем в журнал, там это
// увидит администратор.
async function schMarkFailed(uid,date,why){
  try{ logAction('schMarkFailed',uid,date,{why:String(why).slice(0,200)}); }catch(e){}
}
async function schMarkActual(uid,date,shop,src){
  await schLoadRefs();
  const rows=await schFetch('/schedule?select=*&uid=eq.'+encodeURIComponent(uid)+'&date=eq.'+date);
  const prev=(rows&&rows[0])||null;
  const own=schPointOfShop(shop);
  const pt=(prev&&prev.planned_point)||(own?own.code:null);
  if(!pt){ schMarkFailed(uid,date,'у магазина «'+(shop||'?')+'» нет точки в справочнике'); return; }
  await schFetch('/schedule',{method:'POST',
    headers:{'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{uid:String(uid),date,shop:shop||null,
      planned_point:prev?prev.planned_point:null,actual_point:pt,actual_source:src||'sales',
      shift_type:prev?prev.shift_type:'full',updated_by:CU?CU.name:null}])});
}
