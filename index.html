<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FBSM — Система учёта продаж</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f3;--surface:#fff;--s2:#f0eeea;
  --text:#1a1a1a;--muted:#6b6b68;--border:#e0ded8;
  --blue:#185FA5;--bl:#E6F1FB;--bd:#0C447C;
  --green:#3B6D11;--gl:#EAF3DE;
  --amber:#BA7517;--al:#FAEEDA;
  --red:#A32D2D;--rl:#FCEBEB;
  --r:10px;--rs:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
.screen{display:none;min-height:100vh}.screen.active{display:block}
.aw{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.ac{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:2rem;width:100%;max-width:360px}
.brand{font-size:28px;font-weight:700;letter-spacing:2px;color:var(--bd);text-align:center}
.sub{font-size:13px;color:var(--muted);text-align:center;margin:4px 0 1.5rem}
.layout{display:flex;min-height:100vh}
.sb{width:220px;background:var(--bd);color:#fff;flex-shrink:0;display:flex;flex-direction:column}
.sb-logo{padding:1.25rem 1rem;font-size:18px;font-weight:700;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-user{padding:.75rem 1rem;font-size:12px;color:rgba(255,255,255,.6);border-bottom:1px solid rgba(255,255,255,.1)}
.sb-user strong{display:block;color:#fff;font-size:13px;margin-bottom:2px}
.ni{display:flex;align-items:center;gap:10px;padding:.75rem 1rem;font-size:14px;color:rgba(255,255,255,.75);cursor:pointer;border:none;background:none;width:100%;text-align:left;border-left:3px solid transparent}
.ni:hover{background:rgba(255,255,255,.08);color:#fff}
.ni.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:#fff}
.sb-bot{margin-top:auto;padding:1rem;border-top:1px solid rgba(255,255,255,.1)}
.main{flex:1;overflow-y:auto}
.mh{background:var(--surface);border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.mt{font-size:17px;font-weight:600}
.cnt{padding:1.5rem}
@media(max-width:640px){
  .layout{flex-direction:column}.sb{width:100%;flex-direction:row;flex-wrap:wrap}
  .sb-logo{flex:1}.sb-user{display:none}
  .ni{padding:.5rem .75rem;font-size:12px;border-left:none;border-bottom:3px solid transparent}
  .ni.active{border-bottom-color:#fff;border-left:none}
  .sb-bot{padding:.5rem}.cnt{padding:1rem}
}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:1.25rem;margin-bottom:1rem}
.ct{font-size:15px;font-weight:600;margin-bottom:1rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
.metric{background:var(--s2);border-radius:var(--rs);padding:1rem;text-align:center}
.mv{font-size:20px;font-weight:700;margin-top:4px;line-height:1}
.ml{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.btn:hover{background:var(--s2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.bp{background:var(--blue);color:#fff;border-color:var(--blue)}.bp:hover{background:var(--bd)}
.bd2{color:var(--red);border-color:var(--red)}.bd2:hover{background:var(--rl)}
.bsm{padding:5px 10px;font-size:12px}.bbl{width:100%;justify-content:center}
.fg{margin-bottom:.75rem}
.fl{font-size:13px;color:var(--muted);display:block;margin-bottom:4px;font-weight:500}
.fc{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--rs);background:var(--surface);color:var(--text);font-size:14px}
.fc:focus{outline:none;border-color:var(--blue)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media(max-width:400px){.fr{grid-template-columns:1fr}}
.pb{background:var(--s2);border-radius:100px;height:8px;overflow:hidden;margin:6px 0}
.pf{height:100%;border-radius:100px;transition:width .5s}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600}
.ts{background:var(--gl);color:var(--green)}.tw{background:var(--al);color:var(--amber)}
.td{background:var(--rl);color:var(--red)}.ti{background:var(--bl);color:var(--bd)}
.tw-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--s2);padding:8px 10px;text-align:left;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--s2)}
.alert{padding:10px 14px;border-radius:var(--rs);font-size:13px;margin-bottom:.75rem}
.as{background:var(--gl);color:var(--green)}.ae{background:var(--rl);color:var(--red)}.ai{background:var(--bl);color:var(--bd)}
.motiv{background:var(--bl);border:1px solid #B5D4F4;border-radius:var(--r);padding:1rem;margin-bottom:1rem;font-size:14px;color:var(--bd)}
.zpr{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--border);font-size:13px;color:var(--muted)}
.zpr:last-child{border:none;font-weight:600;color:var(--text);font-size:14px}
.rank{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:600}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
.ovc{background:var(--surface);border-radius:var(--r);padding:1.5rem;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loader{position:fixed;inset:0;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;z-index:999;gap:10px;font-size:14px;color:var(--muted)}
.print-only{display:none}
@media print{.sb,.mh,.btn,.nav-item{display:none!important}.print-only{display:block}.cnt{padding:0}}
/* ══ ГРАФИК СМЕН (модуль sch*) ══ */
/* Селекторы намеренно вида «.sch td.xxx»: базовое правило .sch td
   имеет специфичность (0,1,1) и перебивало бы одиночные классы. */
.sch-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.sch{border-collapse:separate;border-spacing:0;font-size:12px;width:auto;min-width:100%}
.sch td,.sch th{padding:0;border:none}
.sch tbody tr:hover td{background:none}

.sch td.sch-name,.sch th.sch-name{position:sticky;left:0;z-index:2;background:var(--surface);
  min-width:200px;max-width:200px;padding:11px 16px;text-align:left;line-height:1.4;
  border-right:2px solid var(--border);border-bottom:1px solid var(--border)}
.sch thead th.sch-name{background:var(--s2);z-index:3;padding-top:9px;padding-bottom:9px}

.sch td.sch-day,.sch th.sch-day{width:38px;min-width:38px;
  border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.sch thead th.sch-day{background:var(--s2);padding:8px 0 7px;text-align:center}
.sch-dn{display:block;font-weight:700;font-size:11.5px;color:var(--text)}
.sch-dw{display:block;font-size:9.5px;color:var(--muted);margin-top:2px}
.sch td.sch-we{background:#faf8f4}
.sch thead th.sch-we{background:#eae2d6}
.sch thead th.sch-we .sch-dn{color:var(--amber)}

.sch td.sch-tot,.sch th.sch-tot{min-width:64px;text-align:center;background:var(--s2);
  font-weight:700;font-size:13px;border-bottom:1px solid var(--border);
  border-left:1px solid var(--border);padding:8px 6px}
.sch thead th.sch-tot{font-size:10.5px;color:var(--muted);letter-spacing:.4px;padding:9px 6px}

/* Клетка: цветная «плашка» с отступом от границ — это и даёт воздух */
.sch-cell{height:44px;padding:4px;display:flex;flex-direction:column;gap:3px;
  cursor:pointer;user-select:none}
.sch-cell.ro{cursor:default}
.sch-p{flex:1;display:flex;align-items:center;justify-content:center;border-radius:5px;
  font-weight:700;font-size:11px;line-height:1;letter-spacing:.2px;transition:box-shadow .12s}
.sch-cell:not(.ro):hover .sch-p{box-shadow:inset 0 0 0 2px var(--blue)}
.sch-cell:not(.ro):hover .sch-p:empty{background:var(--bl)}
.sch-f{height:4px;border-radius:2px;flex-shrink:0}
.sch-cell.extra .sch-p{box-shadow:inset 0 0 0 2px var(--blue);background:var(--bl)}
.sch-cell.noplan .sch-p{background:var(--s2);font-weight:600}

.sch tbody tr.sch-sum td{background:var(--s2);font-weight:600;font-size:11.5px;text-align:center;
  color:var(--muted);border-bottom:1px solid var(--border);padding:9px 0}
.sch tbody tr.sch-sum td.sch-name{background:var(--s2);font-weight:600;color:var(--muted);text-align:left}
.sch tbody tr.sch-sum:first-of-type td{border-top:2px solid var(--border)}

.sch-legend{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:1.1rem;padding:0 2px;
  font-size:12px;color:var(--muted);align-items:center}
.sch-dot{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}

.sch-opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 1.25rem}
.sch-opt{padding:10px 14px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);
  color:var(--text);cursor:pointer;font-size:13px;font-weight:500;text-align:left}
.sch-opt:hover{background:var(--s2)}
.sch-opt.sel{border-color:var(--blue);background:var(--bl);color:var(--bd);font-weight:600}
@media(max-width:640px){
  .sch td.sch-name,.sch th.sch-name{min-width:150px;max-width:150px;padding:9px 11px}
  .sch td.sch-day,.sch th.sch-day{width:34px;min-width:34px}
}
</style>

<div id="screen-login" class="screen">
  <div class="aw"><div class="ac">
    <div class="brand">FBSM</div>
    <div class="sub">Система учёта продаж</div>
    <div id="lerr" class="alert ae" style="display:none"></div>
    <div class="fg"><label class="fl">Выберите имя</label>
      <select id="lname" class="fc"><option value="">— выберите —</option></select>

</div>

<script>
const API='https://qeehxcnnuzuwskznhdyg.supabase.co/functions/v1/api';
const SUPABASE_ANON_KEY='sb_publishable_YPJerpA53QDpCgt69qB1Iw_3Ay0CaRY';
const SHOPS=['Караганда','Алматы','Асфендиярова','Манаса','Республика'];
const REPORTS_URL='https://umgroupkz-commits.github.io/fbsm-reports/';
const SHOP_TO_REPORT={
  'Караганда':   'ГрандСтор (Караганда)',
  'Алматы':      'Атакент (Алматы)',
  'Асфендиярова':'Асф. (Астана)',
  'Манаса':      'Манаса (Астана)',
  'Республика':  'Респ. (Астана)',
};
let CU=null,PARAMS={},USERS=[],_sales=[],_plans=[];

// ══ API (Supabase Edge Function) ══
// Интерфейс (названия action и параметры) сохранён таким же, каким был
// у Apps Script — вся остальная логика программы работает без изменений.
function delay(ms){return new Promise(res=>setTimeout(res,ms));}

async function callEdgeFn(action,data={},attempt=1){
  try{
    const r=await fetch(API,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+SUPABASE_ANON_KEY,
        'apikey':SUPABASE_ANON_KEY,
      },
      body:JSON.stringify({action,...data}),
    });
    const j=await r.json();
    if(j.error)throw new Error(j.error);
    return j;
  }catch(e){
    if(attempt<3){
      await delay(800*attempt);
      return callEdgeFn(action,data,attempt+1);
    }
    // Раньше ошибка просто улетала наверх, а её никто не ловил: оверлей
    // «Загрузка» оставался висеть навсегда, и человек не понимал,
    // сохранились данные или нет. Гасим оверлей и показываем причину.
    L(false);
    const msg='Сервер не отвечает. Данные не сохранены — попробуйте ещё раз или обновите страницу.';
    showFatal(msg+' ('+e.message+')');
    throw new Error(msg);
  }
}

// Единая плашка об ошибке поверх интерфейса. Сама гаснет через 8 секунд.
function showFatal(text){
  let box=document.getElementById('fatal');
  if(!box){
    box=document.createElement('div');
    box.id='fatal';
    box.style.cssText='position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:1000;'
      +'max-width:520px;background:var(--rl);color:var(--red);border:1px solid var(--red);'
      +'border-radius:var(--r);padding:12px 16px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.15)';
    document.body.appendChild(box);
  }
  box.textContent=text;
  box.style.display='block';
  clearTimeout(box._t);
  box._t=setTimeout(()=>{box.style.display='none'},8000);
}
async function api(action,data={}){ return callEdgeFn(action,data); }
async function apiPost(action,data={}){ return callEdgeFn(action,data); }

// ══ UTILS ══
const fmt=n=>Math.round(n||0).toLocaleString('ru-RU')+'₸';
const fmtN=n=>Math.round(n||0).toLocaleString('ru-RU');
function fmtUpdatedAt(iso){
  if(!iso) return 'Данные ещё не загружались — нажми «Обновить данные»';
  try{
    const d=new Date(iso);
    return 'Данные обновлены: '+d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  }catch(e){return '';}
}
// Дата по МЕСТНОМУ времени. Через toISOString() было бы UTC, а Казахстан
// UTC+5 — с полуночи до 5 утра функция возвращала вчерашний день, и ночная
// смена записывалась не в те сутки.
function today(){
  const n=new Date();
  return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
}
// Экранирование пользовательских данных перед вставкой в innerHTML.
// Имена сотрудников заводит управляющий — без этого имя вида
// <img src=x onerror=...> выполнялось бы у всех, кто открыл страницу.
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// JSON внутрь HTML-атрибута onclick='...'. Апостроф в фамилии (О'Нил)
// иначе разрывает атрибут и кнопка перестаёт работать.
const escAttr=o=>esc(JSON.stringify(o));

// Проверка ввода продаж. Раньше не было никакой: проходили отрицательные
// суммы (портили факт магазина и премию всей смене), экспонента 1e12,
// дробные тенге и даты из прошлого века.
const MAX_DAY_SALES=50000000;   // потолок дневной выручки одного продавца
function validateEntry({date,sales,checks,units,returns}){
  if(!date)return'Выберите дату';
  const d=new Date(date+'T00:00:00');
  if(isNaN(d))return'Некорректная дата';
  const now=new Date(today()+'T00:00:00');
  if(d>now)return'Дата в будущем — так нельзя';
  const limit=new Date(now); limit.setMonth(limit.getMonth()-3);
  if(d<limit)return'Дата старше трёх месяцев. Обратитесь к управляющему';
  const nums={'Сумма продаж':sales,'Чеки':checks,'Единицы':units,'Возврат':returns};
  for(const k in nums){
    const v=nums[k];
    if(!isFinite(v))return k+': не число';
    if(v<0)return k+': отрицательное значение';
    if(v>MAX_DAY_SALES)return k+': слишком большое значение';
  }
  if(!Number.isInteger(checks)||!Number.isInteger(units))return'Чеки и единицы — целые числа';
  if(checks===0&&sales>0)return'Указана выручка, но ноль чеков';
  if(sales===0&&checks>0)return'Указаны чеки, но нулевая выручка';
  return null;
}
function curMk(){
  const n=new Date();
  return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');
}
function daysInMk(mk){const[y,m]=mk.split('-');return new Date(+y,+m,0).getDate()}
function L(on){document.getElementById('loader').style.display=on?'flex':'none'}
function setTitle(t){document.getElementById('main-title').textContent=t}
function setBadge(h){document.getElementById('main-badge').innerHTML=h}
function setContent(h){document.getElementById('content').innerHTML=h}
function normDate(d){return String(d).slice(0,10)}
function normMk(v){const s=String(v);const m=s.match(/^(\d{4}-\d{2})/);return m?m[1]:s}

function barCol(p){if(p>=1.4)return'#639922';if(p>=1)return'#185FA5';if(p>=.8)return'#BA7517';return'#A32D2D'}
function getRank(p){
  if(p>=1.4)return{lbl:'Легенда', ic:'🏆',col:'#BA7517',bg:'#FAEEDA'}
  if(p>=1.0)return{lbl:'Мастер',  ic:'⭐',col:'#185FA5',bg:'#E6F1FB'}
  if(p>=0.8)return{lbl:'Самурай', ic:'⚔️',col:'#3B6D11',bg:'#EAF3DE'}
  if(p>=0.5)return{lbl:'Падаван', ic:'🌀',col:'#533F2E',bg:'#F1EFE8'}
  return           {lbl:'Искатель',ic:'🌱',col:'#888780',bg:'#F1EFE8'}
}
function rankChip(p){const r=getRank(p);return`<span class="rank" style="background:${r.bg};color:${r.col}">${r.ic} ${r.lbl}</span>`}
function motiv(p){
  if(p>=1.4)return'🏆 Легенда! Невероятный результат — ты вошёл в историю этого месяца!'
  if(p>=1.2)return'⭐ Мастер не останавливается! До звания Легенды — совсем чуть-чуть!'
  if(p>=1.0)return'✅ Самурай выполнил план! Каждая продажа теперь — +3% к зарплате!'
  if(p>=0.8)return'⚔️ Уровень Самурая! Следующая цель — 100% и звание Мастера!'
  if(p>=0.5)return'🌀 Падаван на пути! До уровня Самурая — рукой подать.'
  return'🌱 Путь Искателя начался! Введи продажи и наблюдай, как растёт зарплата!'
}

// Базовые параметры сетки продавца (использовались как магические числа
// в старом коде — теперь одно место истины, аналогично MGR_DEFAULTS ниже).
// Подписи ролей — одно место истины вместо четырёх копий карты.
const ROLE_LABELS={admin:'Гл. Админ',manager:'Управляющий',seller:'Продавец',accountant:'Бухгалтер'};
// Итоги по записям продаж за период. Этот подсчёт был скопирован дословно
// в шести местах: дашборд, история, история продавцов, рейтинг, сводка,
// начисление. Правка в одном из них разъехалась бы с остальными.
// net — выручка за вычетом возвратов, не ниже нуля.
function sumEntries(ents){
  let sales=0,checks=0,units=0,returns=0;
  (ents||[]).forEach(e=>{sales+=+e.sales;checks+=+e.checks;units+=+e.units;returns+=+(e.returns||0)});
  return {sales,checks,units,returns,net:Math.max(0,sales-returns)};
}
const SELLER_DEFAULTS={rate:6000,shifts:15,base:0.01,p80:0.005,p100:0.015,p140:0.03,bMag:10000,bKpi:10000,avgNorm:15000,uptNorm:2.5};

// Общее ядро расчёта ЗП — "лестница" бонусов 80/100/140% и KPI,
// на которой строятся все варианты (прогноз / факт / с корректировкой,
// для продавца и для управляющего). Различия между вызывающими функциями
// передаются через params/opts, а не дублируют формулы заново.
//
// opts:
//   defaults     — объект с дефолтными значениями ставок (SELLER_DEFAULTS/MGR_DEFAULTS)
//   hasShopBonus — есть ли отдельный бонус за план магазина (да у продавца, нет у управляющего)
//   capUpt       — ограничивать ли uptNorm потолком 100 (сохранено как в оригинале:
//                  прогнозная calcZP этого не делала, остальные — делали)
//   capAvgAt     — потолок для avgNorm, или null если без ограничения (сохранено:
//                  у управляющего исторически стоял потолок 999999, у продавца — нет)
function computeZPCore(amountForTiers,avgAmount,checks,units,pct,p,opts){
  const d=opts.defaults;
  const rate=parseFloat(p.rate)||d.rate;
  const base=amountForTiers*(parseFloat(p.base)||d.base);
  const a80=pct>=0.8?amountForTiers*(parseFloat(p.p80)||d.p80):0;
  const a100=pct>=1?amountForTiers*(parseFloat(p.p100)||d.p100):0;
  const a140=pct>=1.4?amountForTiers*(parseFloat(p.p140)||d.p140):0;

  const avg=checks>0?avgAmount/checks:0;
  const upt=checks>0?units/checks:0;
  const avgN=opts.capAvgAt!=null?Math.min(parseFloat(p.avgNorm)||d.avgNorm,opts.capAvgAt):(parseFloat(p.avgNorm)||d.avgNorm);
  const uptNraw=parseFloat(p.uptNorm)||d.uptNorm;
  const uptN=opts.capUpt?Math.min(uptNraw,100):uptNraw;
  const bk1=avg>=avgN?(parseFloat(p.bKpi)||d.bKpi):0;
  const bk2=upt>=uptN?(parseFloat(p.bKpi)||d.bKpi):0;

  const bMag=opts.hasShopBonus?(opts.shopBonusOn?(parseFloat(p.bMag)||d.bMag):0):0;

  const base_total=rate*opts.shifts+base+a80+a100+a140+bMag+bk1+bk2;
  const result={oklad:rate*opts.shifts,base,a80,a100,a140,bk1,bk2,total:base_total,avg,upt};
  if(opts.hasShopBonus) result.bMag=bMag;
  return result;
}

function calcZP(sales,checks,units,pct,p){
  p=p||PARAMS;
  const shifts=parseFloat(p.shifts)||SELLER_DEFAULTS.shifts;
  // Фактические смены = количество дней с продажами (передаётся отдельно)
  // В прогнозе используем норму смен
  return computeZPCore(sales,sales,checks,units,pct,p,{
    defaults:SELLER_DEFAULTS,shifts,hasShopBonus:true,shopBonusOn:pct>=1,
    capUpt:false,capAvgAt:null, // как в оригинале: прогноз без ограничения uptNorm
  });
}

function calcZPActual(sales,checks,units,pct,actualShifts,shopPlanMet,p){
  if(typeof shopPlanMet==='object'&&shopPlanMet!==null&&!p){p=shopPlanMet;shopPlanMet=undefined;}
  p=p||PARAMS;
  const shopBonusOn=shopPlanMet!==undefined?shopPlanMet:(pct>=1);
  return computeZPCore(sales,sales,checks,units,pct,p,{
    defaults:SELLER_DEFAULTS,shifts:actualShifts,hasShopBonus:true,shopBonusOn,
    capUpt:true,capAvgAt:null,
  });
}

// ЗП с корректировкой перед начислением: скорректированная сумма продаж
// влияет ТОЛЬКО на % от продаж и пороговые бонусы (80/100/140%,бонус плана),
// а KPI (средний чек, UPT) считаются от РЕАЛЬНЫХ данных — они не меняются.
function calcZPCorrected(realSales,checks,units,correctedSales,plan,actualShifts,shopPlanMet,p){
  p=p||PARAMS;
  const salesForTiers=(correctedSales!==null&&correctedSales!==undefined&&correctedSales!=='')
    ?parseFloat(correctedSales):realSales;
  const pct=plan>0?salesForTiers/plan:0;
  const shopBonusOn=shopPlanMet!==undefined?shopPlanMet:(pct>=1);
  const r=computeZPCore(salesForTiers,realSales,checks,units,pct,p,{
    defaults:SELLER_DEFAULTS,shifts:actualShifts,hasShopBonus:true,shopBonusOn,
    capUpt:true,capAvgAt:null,
  });
  r.pctUsed=pct;r.salesForTiers=salesForTiers;
  return r;
}

// Аналог для управляющих — то же общее ядро computeZPCore, но без
// бонуса за план магазина (у управляющего его нет) и со своими
// дефолтными ставками (MGR_DEFAULTS определён ниже в файле).
function calcMgrZPCorrected(realFact,checks,units,correctedFact,plan,shifts,p){
  p=p||MGR_PARAMS;
  const factForTiers=(correctedFact!==null&&correctedFact!==undefined&&correctedFact!=='')
    ?parseFloat(correctedFact):realFact;
  const pct=plan>0?factForTiers/plan:0;
  const sh=shifts!==undefined?shifts:(parseFloat(p.shifts)||MGR_DEFAULTS.shifts);
  const r=computeZPCore(factForTiers,realFact,checks,units,pct,p,{
    defaults:MGR_DEFAULTS,shifts:sh,hasShopBonus:false,shopBonusOn:false,
    capUpt:true,capAvgAt:999999,
  });
  r.pctUsed=pct;r.factForTiers=factForTiers;
  return r;
}

function getPlan(uid,mk){
  const r=_plans.find(p=>String(p.uid)===String(uid)&&normMk(p.mk)===normMk(mk));
  return r?parseFloat(r.amount)||0:0;
}
function getEntriesFor(uid,mk){
  return _sales.filter(s=>String(s.uid)===String(uid)&&normDate(s.date).startsWith(mk));
}
// Продавцы, видимые текущему пользователю: управляющий видит только
// своих (по магазину), администратор и бухгалтер — всех. Раньше эти
// две строки были продублированы в трёх разных местах.
function getVisibleSellers(){
  let sellers=USERS.filter(u=>u.role==='seller');
  // Ограничиваем магазином и продавца тоже. Сегодня он на эти страницы не
  // попадает, но раньше фильтр стоял только для управляющего — стоило бы
  // добавить продавцу любую страницу со списком, и утекла бы вся сеть.
  if(CU.role==='manager'||CU.role==='seller') sellers=sellers.filter(u=>u.shop===CU.shop);
  return sellers;
}

// ══ MONTHS SELECT ══
function monthsOpts(past=6,future=0){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth();
  const cur=y+'-'+String(m+1).padStart(2,'0');
  let html='';
  for(let i=future;i>=1;i--){
    const d=new Date(y,m+i,1);
    const mk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    html+=`<option value="${mk}">${d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</option>`;
  }
  html+=`<option value="${cur}" selected>${n.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</option>`;
  for(let i=1;i<past;i++){
    const d=new Date(y,m-i,1);
    const mk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    html+=`<option value="${mk}">${d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</option>`;
  }
  return html;
}

window.doLogin=async function(){
  const id=document.getElementById('lname').value;
  const pass=document.getElementById('lpass').value;
  const err=document.getElementById('lerr');
  err.style.display='none';
  if(!id){err.textContent='Выберите имя';err.style.display='block';return}
  // Пароль проверяется НА СЕРВЕРЕ. Раньше сверка шла здесь, в браузере,
  // а значит getUsers обязан был присылать пароли всех сотрудников —
  // любой продавец видел пароль администратора через F12.
  let user=null;
  L(true);
  const r=await api('login',{id,pass});
  L(false);
  if(!r||r.ok!==true){
    err.textContent=(r&&r.reason)||'Неверное имя или пароль';
    err.style.display='block';return;
  }
  user=r.user; window._authToken=r.token;
  document.getElementById('lpass').value='';
  CU=user;
  document.getElementById('sb-name').textContent=CU.name;
  document.getElementById('sb-shop').textContent=CU.shop||'Администратор';
  L(true);
  [_plans,PARAMS]=await Promise.all([api('getPlans',{}),api('getParams')]);
  await loadClosed(true);   // какие месяцы уже закрыты бухгалтером
  _sales=[]; // подгружается отдельно на каждой странице, отфильтровано по месяцу
  L(false);
  setupSidebar();showScreen('app');
}
window.doLogout=function(){CU=null;showScreen('login')}

window.pgDash=async function(){
  nav('pgDash');setTitle('Мой дашборд');
  setContent('<div style="padding:2rem;text-align:center"><div class="spin"></div></div>');
  L(true);
  const mk=curMk();
  const bundle=await api('getBundle',{uid:CU.id,mk,needShopStats:1});
  _sales=bundle.sales;_plans=bundle.plans;PARAMS=bundle.params;window._shopStats=bundle.shopStats;
  await schLoadWeights(mk,[CU.id]); // ГРАФИК: коэффициенты смен
  L(false);
  const plan=getPlan(CU.id,mk);
  const entries=getEntriesFor(CU.id,mk);
  const {checks:tc,units:tu,returns:tr,net:ts}=sumEntries(entries);
  // Дней с продажами, взвешенных по типу смены из графика (полсмены = 0.5)
  const actualShifts=schShifts(CU.id,entries);
  const pct=plan>0?ts/plan:0;
  // Shop plan bonus
  const shopStats=(window._shopStats||{})[CU.shop]||{fact:0,plan:0,pct:0};
  const shopPlanMet=shopStats.plan>0 && shopStats.fact>=shopStats.plan;
  const zp=calcZPActual(ts,tc,tu,pct,actualShifts,shopPlanMet);
  const normShifts=parseFloat(PARAMS.shifts)||15;
  setBadge(rankChip(pct));

  // Прогресс к целям с ЗП при каждом пороге
  let stages='';
  [{p:.8,lbl:'80% — Самурай',col:'#BA7517'},{p:1,lbl:'100% — Мастер',col:'#185FA5'},{p:1.4,lbl:'140% — Легенда',col:'#639922'}]
  .forEach(st=>{
    const need=Math.max(0,plan*st.p-ts);
    const bar=Math.min(100,plan>0?ts/(plan*st.p)*100:0);
    const scenSales=plan>0?plan*st.p:ts;
    const scenZP=calcZP(scenSales,tc,tu,st.p); // norm shifts for prognosis
    stages+=`<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">
        <span style="color:${st.col};font-weight:600">${st.lbl}</span>
        <span style="color:var(--muted)">${need>0?'ещё '+fmt(need):'✓ Выполнено'}</span>
      </div>
      <div class="pb"><div class="pf" style="width:${bar}%;background:${st.col}"></div></div>
      <div style="font-size:12px;color:${st.col};margin-top:3px">ЗП при этом уровне: <b>${fmt(scenZP.total)}</b></div>
    </div>`;
  });

  // Расшифровка ЗП
  let zpHtml='';
  [['Оклад ('+fmtSh(actualShifts)+' смен × '+fmt(parseFloat(PARAMS.rate)||6000)+')',zp.oklad],
   ['% от продаж',zp.base],['Доб.% 80%',zp.a80],['Доб.% 100%',zp.a100],
   ['Доб.% 140%',zp.a140],['Бонус план',zp.bMag],['Бонус KPI (ср.чек)',zp.bk1],
   ['Бонус KPI (UPT)',zp.bk2],['ИТОГО',zp.total]
  ].forEach(([l,v])=>zpHtml+=`<div class="zpr"><span>${l}</span><span>${fmt(v)}</span></div>`);

  // Нужно продавать — с учётом смен
  const now=new Date();
  const dLeft=daysInMk(mk)-now.getDate(); // календарных дней до конца месяца
  const shiftsLeft=Math.min(dLeft, normShifts-actualShifts); // смен осталось (минимум из двух)
  let daily='';
  if(plan>0){
    [{p:1,l:'100% плана'},{p:1.4,l:'140% плана'}].forEach(t=>{
      const need=Math.max(0,plan*t.p-ts);
      const perDay=shiftsLeft>0?need/shiftsLeft:0;
      daily+=`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px">
        <span>До ${t.l}</span><b>${need>0?fmt(perDay)+'/смену':'✓ Готово'}</b></div>`;
    });
    daily+=`<div style="font-size:11px;color:var(--muted);margin-top:6px">
      Отработано смен: ${fmtSh(actualShifts)} из ${normShifts} | Осталось смен: ${Math.max(0,shiftsLeft)} (календарных дней: ${dLeft})
    </div>`;
  }else daily='<span style="color:var(--muted);font-size:13px">План не установлен</span>';

  // Сценарий ЗП — поле ввода %
  const avg=tc>0?ts/tc:0;const upt=tc>0?tu/tc:0;

  setContent(`
    <div class="motiv">${motiv(pct)}</div>
    <div class="g4" style="margin-bottom:1rem">
      <div class="metric"><div class="ml">Продажи</div><div class="mv" style="font-size:17px">${fmt(ts)}</div></div>
      <div class="metric"><div class="ml">Выполнение</div><div class="mv" style="color:${barCol(pct)}">${Math.round(pct*100)}%</div></div>
      <div class="metric"><div class="ml">ЗП сейчас</div><div class="mv" style="font-size:17px;color:var(--blue)">${fmt(zp.total)}</div></div>
      <div class="metric"><div class="ml">План месяца</div><div class="mv" style="font-size:17px">${plan>0?fmt(plan):'—'}</div></div>
    </div>
    ${(shopStats&&shopStats.plan>0)?`
    <div class="card" style="margin-bottom:1rem;border-left:3px solid #185FA5">
      <div style="font-size:13px;font-weight:600;color:var(--bd);margin-bottom:8px">📊 План магазина ${CU.shop}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px">
        <div style="background:var(--s2);border-radius:var(--rs);padding:8px;text-align:center"><div style="font-size:11px;color:var(--muted)">Консультанты</div><div style="font-weight:700;font-size:14px">${fmt(shopStats.consultants!==undefined?shopStats.consultants:shopStats.fact)}</div></div>
        <div style="background:var(--s2);border-radius:var(--rs);padding:8px;text-align:center"><div style="font-size:11px;color:var(--muted)">Остальное</div><div style="font-weight:700;font-size:14px">${fmt(shopStats.other||0)}</div></div>
        <div style="background:var(--bl);border-radius:var(--rs);padding:8px;text-align:center"><div style="font-size:11px;color:var(--bd)">Итого факт</div><div style="font-weight:700;font-size:14px;color:var(--bd)">${fmt(shopStats.fact)}</div></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>План: <b>${fmt(shopStats.plan)}</b></span><span>Вып: <b style="color:${barCol(shopStats.pct)}">${Math.round(shopStats.pct*100)}%</b> ${shopPlanMet?'✅':'❌'}</span></div>
      <div class="pb"><div class="pf" style="width:${Math.min(100,shopStats.pct*100)}%;background:#185FA5"></div></div>

        <div id="scen-result" style="font-size:14px;font-weight:600;color:var(--blue)"></div>
      </div>
    </div>`);

  // Store for scen calc
  window._dashData={ts,tc,tu,plan,pct,actualShifts};
}

window.calcScen=function(){
  const pctVal=parseFloat(document.getElementById('scen-pct').value)||0;
  const p=pctVal/100;
  const d=window._dashData||{};
  const scenSales=d.plan>0?d.plan*p:d.ts;
  const z=calcZP(scenSales,d.tc||0,d.tu||0,p); // norm shifts for scenario
  document.getElementById('scen-result').textContent=`ЗП при ${Math.round(pctVal)}%: ${fmt(z.total)}`;
}

// Смена без продаж: сохраняем нулевую запись за дату. Оклад считается
// как rate × (число дней с записями), поэтому нулевая запись = +1 смена.
window.saveZeroShift=async function(){
  const date=document.getElementById('ed').value;
  if(!date){alert('Выберите дату');return}
  if(!confirm('Отметить '+date+' как смену без продаж?\n\nБудет сохранена нулевая запись: смена засчитается, выручка не изменится.'))return;
  document.getElementById('es').value=0;
  document.getElementById('ec').value=0;
  document.getElementById('eu').value=0;
  const er=document.getElementById('er');if(er)er.value=0;
  await saveEntry();
}

window.loadForEdit=async function(){
  const date=document.getElementById('ed').value;if(!date)return;
  L(true);
  const all=await api('getSales',{uid:CU.id});
  _sales=all;L(false);
  const e=all.find(s=>normDate(s.date)===date);
  if(e){
    document.getElementById('es').value=e.sales||0;
    document.getElementById('ec').value=e.checks||0;
    document.getElementById('eu').value=e.units||0;
    document.getElementById('er').value=e.returns||0;
  }else{
    const m=document.getElementById('emsg');
    m.className='alert ai';m.textContent=`Записей за ${date} не найдено`;
    setTimeout(()=>m.textContent='',2000);
  }

window.saveEntry=async function(){
  const date=document.getElementById('ed').value;
  const sales=parseFloat(document.getElementById('es').value)||0;
  const checks=parseInt(document.getElementById('ec').value)||0;
  const units=parseInt(document.getElementById('eu').value)||0;
  const returns=parseFloat(document.getElementById('er')?.value)||0;
  const shut=closedGuard(date);
  if(shut){sayClosed(shut,'emsg');return}
  const bad=validateEntry({date,sales,checks,units,returns});
  if(bad){
    const m=document.getElementById('emsg');
    if(m){m.style.cssText='';m.className='alert ae';m.textContent='⛔ '+bad}else alert(bad);
    return;
  }
  // ГРАФИК: не даём вводить продажи, пока график на месяц не заполнен
  L(true);
  const schSt=await schGuard(CU.shop);
  if(schSt.st==='block'){L(false);schSayGuard(schSt,false);return}
  await apiPost('saveSale',{uid:CU.id,date,sales,checks,units,returns});
  logAction('saveSale',CU.name,date,{sales,checks,units,returns});
  // ГРАФИК: помечаем факт смены. Ошибка здесь не должна ломать сохранение продаж.
  schMarkActual(CU.id,date,CU.shop).catch(e=>console.warn('График:',e));
  _sales=await api('getSales',{uid:CU.id});
  L(false);
  const m=document.getElementById('emsg');
  m.style.cssText='';
  if(schSt.st==='soft'){
    schSayGuard(schSt,true,date);   // сохранено, но график впереди дырявый
  }else{
    m.className='alert as';m.textContent=`✓ Сохранено за ${date}`;
  }
  document.getElementById('es').value='';
  document.getElementById('ec').value='';
  document.getElementById('eu').value='';
  document.getElementById('er').value='';
  setTimeout(()=>{m.textContent='';m.style.cssText=''},schSt.st==='soft'?7000:3000);
}

window.loadReport=async function(forceRefresh){
  const mk=document.getElementById('repMk').value;
  L(true);
  const bundle=await api('getBundle',{mk,needShopStats:1,forceRefresh:forceRefresh?1:0});
  _sales=bundle.sales;_plans=bundle.plans;PARAMS=bundle.params;window._shopStats=bundle.shopStats;
  L(false);
  const uaEl=document.getElementById('repUpdatedAt');
  if(uaEl) uaEl.textContent=fmtUpdatedAt(bundle.shopStatsUpdatedAt);
  const sellers=getVisibleSellers();
  await schLoadWeights(mk,sellers.map(u=>u.id)); // ГРАФИК: коэффициенты смен
  const byShop={};
  sellers.forEach(u=>{
    if(!byShop[u.shop])byShop[u.shop]=[];
    const ents=getEntriesFor(u.id,mk);
    const {checks:tc,units:tu,returns:tr,net:ts}=sumEntries(ents);
    const actualShifts=schShifts(u.id,ents);
    const plan=getPlan(u.id,mk);
    const pct=plan>0?ts/plan:0;
    const ss=(window._shopStats||{})[u.shop]||{pct:0,plan:0};
    const shopMet=ss.plan>0&&ss.fact>=ss.plan;
    const zp=calcZPActual(ts,tc,tu,pct,actualShifts,shopMet);
    byShop[u.shop].push({...u,ts,tc,tu,plan,pct,zp:zp.total,actualShifts,shopMet,shopPlan:ss.plan,shopFact:ss.fact,shopPct:ss.pct});
  });
  // Shop plan summary block
  let html='';
  const shopStatsFiltered = CU.role==='manager' ? Object.fromEntries(Object.entries(window._shopStats||{}).filter(([s])=>s===CU.shop)) : (window._shopStats||{});
  const shopSummaryRows=Object.keys(shopStatsFiltered);
  if(shopSummaryRows.length>0){
    html+=`<div class="card" style="margin-bottom:1rem">
      <div class="ct">План / Факт по магазинам</div>
      <div class="tw-wrap"><table>
        <tr><th>Магазин</th><th>Консультанты</th><th>Остальное</th><th>Итого факт</th><th>План</th><th>%</th></tr>
        ${Object.entries(shopStatsFiltered).map(([shop,ss])=>`<tr>
          <td><b>${shop}</b></td>
          <td>${fmt(ss.consultants!==undefined?ss.consultants:ss.fact)}</td>
          <td>${fmt(ss.other||0)}</td>
          <td><b>${fmt(ss.fact)}</b></td>
          <td>${ss.plan?fmt(ss.plan):"—"}</td>
          <td style="color:${barCol(ss.pct)};font-weight:700">${ss.plan?Math.round(ss.pct*100)+"%":"—"}</td>
        </tr>`).join("")}
      </table></div>
    </div>`;
  }
  Object.entries(byShop).forEach(([shop,rows])=>{
    rows.sort((a,b)=>b.pct-a.pct);
    let shopTotal=0;
    html+=`<div class="card"><div class="ct">${shop}</div>
      <div class="tw-wrap"><table>
      <tr><th>Продавец</th><th>Продажи</th><th>План</th><th>%</th><th>Смен</th><th>Ср.чек</th><th>UPT</th><th>ЗП</th><th>Ранг</th></tr>`;
    rows.forEach(r=>{
      shopTotal+=r.ts;
      const avg=r.tc>0?r.ts/r.tc:0;const upt=r.tc>0?r.tu/r.tc:0;
      html+=`<tr>
        <td>${esc(r.name)}</td><td>${fmt(r.ts)}</td><td>${r.plan?fmt(r.plan):'—'}</td>
        <td style="color:${barCol(r.pct)};font-weight:700">${Math.round(r.pct*100)}%</td>
        <td>${fmtSh(r.actualShifts)}</td>
        <td>${avg>0?fmt(avg):'—'}</td><td>${upt>0?upt.toFixed(2):'—'}</td>
        <td style="font-weight:700;color:var(--blue)">${fmt(r.zp)}</td>
        <td>${rankChip(r.pct)}</td>
      </tr>`;
    });
    html+=`</table></div>
      <div style="font-size:13px;color:var(--muted);margin-top:8px">Итого продаж: <b style="color:var(--text)">${fmt(shopTotal)}</b></div>
    </div>`;
  });
  document.getElementById('repBody').innerHTML=html||'<div style="color:var(--muted)">Нет данных</div>';
}

  const fines=parseFloat(document.getElementById('adj-fines').value)||0;

window.admDelRow=async function(uid,date,btn){
  const shut=closedGuard(date);
  if(shut){alert('🔒 '+shut);return}
  if(!confirm(`Удалить ${date}?`))return;
  L(true);await apiPost('deleteSale',{uid,date});L(false);
  btn.closest('tr').remove();loadPayroll();
}

window.admSaveAll=async function(uid,btn){
  const inputs=btn.closest('.ovc').querySelectorAll('input[data-date]');
  const byDate={};
  inputs.forEach(inp=>{
    const d=inp.dataset.date;
    if(!byDate[d])byDate[d]={uid,date:d,sales:0,checks:0,units:0};
    byDate[d][inp.dataset.f]=parseFloat(inp.value)||0;
  });
  const dates=Object.keys(byDate);
  const shut=dates.map(closedGuard).find(Boolean);
  if(shut){alert('🔒 '+shut);return}
  L(true);
  const schU=USERS.find(x=>String(x.id)===String(uid));
  for(const data of Object.values(byDate)){
    await apiPost('saveSale',data);
    logAction('saveSale',schU?schU.name:uid,data.date,{sales:data.sales,checks:data.checks,units:data.units});
    // ГРАФИК: помечаем факт смены и при вводе продаж управляющим/админом
    schMarkActual(uid,data.date,schU?schU.shop:null).catch(e=>console.warn('График:',e));
  }
  L(false);
  const msg=btn.parentElement.querySelector('#emsg2');
  msg.textContent='✓ Сохранено';msg.style.color='var(--green)';
  setTimeout(()=>loadPayroll(),400);
}

function buildShopPlansTable(){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth();
  const months=[];
  for(let i=-1;i<5;i++){const d=new Date(y,m+i,1);months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));}
  let html=`<table><tr><th>Магазин</th>${months.map(mk=>`<th>${mk}</th>`).join('')}</tr>`;
  SHOPS.forEach(shop=>{
    const uid='shop_'+shop;
    html+=`<tr><td>${shop}</td>`;
    months.forEach(mk=>{const p=getPlan(uid,mk);html+=`<td style="font-size:12px">${p?fmtN(p):'—'}</td>`;});
    html+='</tr>';
  });
  return html+'</table>';
}

function buildPlansTable(sellers){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth();
  const months=[];
  for(let i=-1;i<5;i++){const d=new Date(y,m+i,1);months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));}
  let html=`<table><tr><th>Продавец</th>${months.map(mk=>`<th>${mk}</th>`).join('')}</tr>`;
  sellers.forEach(u=>{
    html+=`<tr><td>${esc(u.name)}</td>`;
    months.forEach(mk=>{const p=getPlan(u.id,mk);html+=`<td style="font-size:12px">${p?fmtN(p):'—'}</td>`;});
    html+='</tr>';
  });
  return html+'</table>';
}

const MGR_DEFAULTS={rate:30000,shifts:22,base:0.005,p80:0.0025,p100:0.0025,p140:0.005,bKpi:20000,avgNorm:15000,uptNorm:2.5};
// Норма смен управляющего. Раньше в начислении стояло зашитое 22, а на
// странице «Моя ЗП» — настраиваемый параметр: стоило поменять норму в

const mgrShifts=()=>parseFloat(MGR_PARAMS.shifts)||MGR_DEFAULTS.shifts;
let MGR_PARAMS={...MGR_DEFAULTS};

function getMgrRank(p){
  if(p>=1.4)return{lbl:'Император',ic:'👑',col:'#BA7517',bg:'#FAEEDA'}
  if(p>=1.0)return{lbl:'Сёгун',ic:'🏯',col:'#185FA5',bg:'#E6F1FB'}
  if(p>=0.8)return{lbl:'Полководец',ic:'⚜️',col:'#3B6D11',bg:'#EAF3DE'}
  if(p>=0.5)return{lbl:'Советник',ic:'📜',col:'#533F2E',bg:'#F1EFE8'}
  return{lbl:'Чиновник',ic:'🎌',col:'#888780',bg:'#F1EFE8'}
}
function mgrChip(p){const r=getMgrRank(p);return '<span class="rank" style="background:'+r.bg+';color:'+r.col+'">'+r.ic+' '+r.lbl+'</span>';}
function mgrMotiv(p){
  if(p>=1.4)return'👑 Император! Магазин покорил 140%+. Абсолютная победа!';
  if(p>=1.2)return'🏯 Сёгун в силе! До звания Императора — один рывок!';
  if(p>=1.0)return'🏯 План выполнен! Каждый процент сверх — это дополнительный бонус!';
  if(p>=0.8)return'⚜️ Полководец! Следующая цель — 100% и звание Сёгуна!';
  if(p>=0.5)return'📜 Советник держит курс! До Полководца — рукой подать.';
  return'🎌 Путь Чиновника начался. Магазин набирает обороты.';
}
function calcMgrZP(fact,checks,units,pct,shifts,p){
  p=p||MGR_PARAMS;
  const sh=shifts!==undefined?shifts:(parseFloat(p.shifts)||MGR_DEFAULTS.shifts);
  return computeZPCore(fact,fact,checks,units,pct,p,{
    defaults:MGR_DEFAULTS,shifts:sh,hasShopBonus:false,shopBonusOn:false,
    capUpt:true,capAvgAt:999999,
  });
}

  html+='<div class="card" style="margin:0"><div class="ct">KPI магазина</div>';

// ── Экспорт начислений в Excel ────────────────────────────────────
// Выгружается не итог, а весь расчёт: каждая сумма — живая формула
// Excel, ссылающаяся на исходные данные и ставки в том же файле.
// Бухгалтер может пересчитать и проверить любую цифру, не заходя в
// программу. Четыре листа: Свод / Продавцы / Управляющие / Параметры.

// Номер колонки → буква (0→A, 26→AA)
function xlCol(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26}return s}
const XL_MONEY='#,##0 ₸',XL_PCT='0.0%',XL_RATE='0.000%';

// Записать формулу с числовым форматом
function xlF(ws,addr,formula,z){ws[addr]={t:'n',f:formula,z:z||XL_MONEY}}
function xlZ(ws,addr,z){if(ws[addr])ws[addr].z=z}

window.exportPayrollExcel=function(){
  const all=window._payrollRows||[];
  if(all.length===0){alert('Нет данных для экспорта. Сначала открой начисление ЗП.');return;}
  if(typeof XLSX==='undefined'){alert('Библиотека Excel не загрузилась. Обнови страницу.');return;}
  const mk=document.getElementById('payMk')?document.getElementById('payMk').value:curMk();
  const sellers=all.filter(r=>r.kind!=='manager');
  const mgrs=all.filter(r=>r.kind==='manager');
  const wb=XLSX.utils.book_new();
  const R0=5; // первая строка данных на листах расчёта

  // ══ ЛИСТЫ РАСЧЁТА ═════════════════════════════════════════════
  // Каждая денежная ячейка — формула от исходных данных и ставок,
  // которые лежат в той же строке слева. Зашитых сумм нет ни одной:
  // бухгалтер меняет ставку — пересчитывается вся строка.
  const KEYS=['name','shop','realSales','sales','plan','pct','shifts','rate','oklad',
    'kBase','vBase','k80','v80','k100','v100','k140','v140','commTotal',
    'checks','units','avg','avgNorm','kpiRate','vKpi1','upt','uptNorm','vKpi2'];
  const KEYS_SHOP=['shopMet','bMagRate','vMag'];
  const KEYS_TAIL=['bonusTotal','accrued','advance','pension','fines','payout'];
  const FORMULA_KEYS=['pct','oklad','vBase','v80','v100','v140','commTotal',
    'avg','vKpi1','upt','vKpi2','vMag','bonusTotal','accrued','payout'];
  const HEAD={
    name:'Сотрудник',shop:'Магазин',
    realSales:'Продажи реальные',sales:'Продажи для расчёта',plan:'План',pct:'% выполнения',
    shifts:'Смен',rate:'Ставка за смену',oklad:'ОКЛАД',
    kBase:'База, ставка',vBase:'База, ₸',
    k80:'Порог 80%, ставка',v80:'Доплата 80%, ₸',
    k100:'Порог 100%, ставка',v100:'Доплата 100%, ₸',
    k140:'Порог 140%, ставка',v140:'Доплата 140%, ₸',
    commTotal:'ИТОГО % ОТ ПРОДАЖ',
    checks:'Чеков',units:'Единиц',
    avg:'Средний чек',avgNorm:'Норма ср. чека',kpiRate:'Ставка премии KPI',vKpi1:'ПРЕМИЯ за ср. чек',
    upt:'UPT',uptNorm:'Норма UPT',vKpi2:'ПРЕМИЯ за UPT',
    shopMet:'План магазина',bMagRate:'Ставка премии за магазин',vMag:'ПРЕМИЯ за план магазина',
    bonusTotal:'ИТОГО ПРЕМИИ',accrued:'НАЧИСЛЕНО',
    advance:'Аванс',pension:'Пенсия',fines:'Штрафы',payout:'К ВЫПЛАТЕ'};

  const detail=(rows,sheet,isMgr)=>{
    if(!rows.length)return null;
    const keys=KEYS.concat(isMgr?[]:KEYS_SHOP).concat(KEYS_TAIL);
    const C={};keys.forEach((k,i)=>C[k]=xlCol(i));
    const aoa=[[(isMgr?'РАСЧЁТ ЗП · УПРАВЛЯЮЩИЕ · ':'РАСЧЁТ ЗП · ПРОДАВЦЫ · ')+mk],
      ['Каждая сумма — формула. Меняешь исходные данные или ставку слева — пересчитывается вся строка.'],[],
      keys.map(k=>HEAD[k])];
    rows.forEach(r=>aoa.push(keys.map(k=>{
      if(FORMULA_KEYS.includes(k))return null;   // заполнится формулой ниже
      if(k==='shopMet')return r.shopMet?'да':'нет';
      if(k==='kpiRate')return r.bKpiRate;
      return r[k]!==undefined?r[k]:null;
    })));
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    rows.forEach((r,i)=>{
      const n=i+R0,a=k=>C[k]+n;
      xlF(ws,a('pct'),      'IF('+a('plan')+'>0,'+a('sales')+'/'+a('plan')+',0)',XL_PCT);
      xlF(ws,a('oklad'),    a('shifts')+'*'+a('rate'));
      xlF(ws,a('vBase'),    a('sales')+'*'+a('kBase'));
      xlF(ws,a('v80'),      'IF('+a('pct')+'>=0.8,'+a('sales')+'*'+a('k80')+',0)');
      xlF(ws,a('v100'),     'IF('+a('pct')+'>=1,'+a('sales')+'*'+a('k100')+',0)');
      xlF(ws,a('v140'),     'IF('+a('pct')+'>=1.4,'+a('sales')+'*'+a('k140')+',0)');
      xlF(ws,a('commTotal'),a('vBase')+'+'+a('v80')+'+'+a('v100')+'+'+a('v140'));
      // KPI считаются от РЕАЛЬНЫХ продаж — корректировка на них не влияет
      xlF(ws,a('avg'),      'IF('+a('checks')+'>0,'+a('realSales')+'/'+a('checks')+',0)');
      xlF(ws,a('vKpi1'),    'IF('+a('avg')+'>='+a('avgNorm')+','+a('kpiRate')+',0)');
      xlF(ws,a('upt'),      'IF('+a('checks')+'>0,'+a('units')+'/'+a('checks')+',0)','0.00');
      xlF(ws,a('vKpi2'),    'IF('+a('upt')+'>='+a('uptNorm')+','+a('kpiRate')+',0)');
      if(isMgr){
        xlF(ws,a('bonusTotal'),a('vKpi1')+'+'+a('vKpi2'));
      }else{
        xlF(ws,a('vMag'),      'IF('+a('shopMet')+'="да",'+a('bMagRate')+',0)');
        xlF(ws,a('bonusTotal'),a('vKpi1')+'+'+a('vKpi2')+'+'+a('vMag'));
      }
      xlF(ws,a('accrued'),  a('oklad')+'+'+a('commTotal')+'+'+a('bonusTotal'));
      xlF(ws,a('payout'),   a('accrued')+'-'+a('advance')+'-'+a('pension')+'-'+a('fines'));
      ['realSales','sales','plan','rate','avgNorm','kpiRate','advance','pension','fines']
        .concat(isMgr?[]:['bMagRate']).forEach(k=>xlZ(ws,a(k),XL_MONEY));
      ['kBase','k80','k100','k140'].forEach(k=>xlZ(ws,a(k),XL_RATE));
    });
    const t=rows.length+R0;
    ws[C.name+t]={t:'s',v:'ИТОГО'};
    ['realSales','sales','plan','oklad','vBase','v80','v100','v140','commTotal',
      'vKpi1','vKpi2','bonusTotal','accrued','advance','pension','fines','payout']
      .concat(isMgr?[]:['vMag'])
      .forEach(k=>xlF(ws,C[k]+t,'SUM('+C[k]+R0+':'+C[k]+(t-1)+')'));
    xlF(ws,C.shifts+t,'SUM('+C.shifts+R0+':'+C.shifts+(t-1)+')','0.0');
    ws['!ref']='A1:'+C.payout+t;
    ws['!cols']=keys.map((k,i)=>({wch:i<2?24:Math.max(12,Math.min(22,HEAD[k].length+3))}));
    ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:keys.length-1}},{s:{r:1,c:0},e:{r:1,c:keys.length-1}}];
    ws['!freeze']={xSplit:'2',ySplit:'4'};
    XLSX.utils.book_append_sheet(wb,ws,sheet);
    return C;
  };
  const Cs=detail(sellers,'Продавцы',false);
  const Cm=detail(mgrs,'Управляющие',true);

  // ══ СВОД — все числа ссылаются на листы расчёта ════════════════
  const ordered=sellers.concat(mgrs);
  const sv=[['СВОД НАЧИСЛЕНИЙ · '+mk],
    ['Каждое число — ссылка на лист расчёта. Правится там, здесь пересчитывается само.'],[],
    ['Сотрудник','Роль','Магазин','Смен','Оклад','% от продаж','ПРЕМИИ','НАЧИСЛЕНО','Аванс','Пенсия','Штрафы','К ВЫПЛАТЕ']];
  ordered.forEach(r=>sv.push([r.name,r.role,r.shop,null,null,null,null,null,null,null,null,null]));
  const wsSv=XLSX.utils.aoa_to_sheet(sv);

// ══════════════════════════════════════════════════════════════════
// МОДУЛЬ «ГРАФИК СМЕН»
// ------------------------------------------------------------------
// Полностью изолирован от расчёта ЗП: все функции с префиксом sch*,
// данные лежат в отдельных таблицах (schedule / schedule_points /
// shift_types) и читаются напрямую через PostgREST, минуя Edge
// Function. Ни computeZPCore, ни calcZP* не затрагиваются.
//
// В ячейке графика ДВА слоя:
//   planned_point — что поставили заранее (ПЛАН)
//   actual_point  — что проставилось по вводу продаж (ФАКТ)
// Раздельно специально: иначе автоотметка затирала бы план и
// невыход стал бы невидимым.
// ══════════════════════════════════════════════════════════════════
const SB_REST=API.replace('/functions/v1/api','/rest/v1');
const SCH_DOW=['вс','пн','вт','ср','чт','пт','сб'];
let SCH_POINTS=[],SCH_TYPES=[],_sch={},_schMk=null,_schShop=null;

async function schFetch(path,opts={}){
  const r=await fetch(SB_REST+path,{...opts,headers:{
    'Content-Type':'application/json',
    'Authorization':'Bearer '+SUPABASE_ANON_KEY,
    'apikey':SUPABASE_ANON_KEY,
    ...(opts.headers||{}),
  }});
  if(!r.ok)throw new Error('График: '+(await r.text()).slice(0,180));
  if(r.status===204)return null;
  const t=await r.text();
  return t?JSON.parse(t):null;
}

async function schLoadRefs(){
  if(SCH_POINTS.length)return;
  const [p,t]=await Promise.all([
    schFetch('/schedule_points?select=*&active=is.true&order=sort'),
    schFetch('/shift_types?select=*&order=sort'),
  ]);
  SCH_POINTS=p||[];SCH_TYPES=t||[];
}
const schPoint=c=>SCH_POINTS.find(p=>p.code===c);
const schType =c=>SCH_TYPES.find(t=>t.code===c)||SCH_TYPES[0];
// У каждого магазина ровно одна торговая точка. Склад привязки не имеет.
const schPointOfShop=s=>SCH_POINTS.find(p=>p.shop===s);
// Для выбора доступны все точки того же города — так работает подмена
// между точками (плюс склад, он в том же городе).
function schPointsForShop(shop){
  const own=schPointOfShop(shop);
  return own?SCH_POINTS.filter(p=>p.city===own.city):SCH_POINTS;
}
function schIsWe(d){const n=new Date(d+'T00:00:00').getDay();return n===0||n===6}
function schMonthRange(mk){return[mk+'-01',mk+'-'+String(daysInMk(mk)).padStart(2,'0')]}
function schInList(arr){return'('+arr.map(v=>'"'+String(v).replace(/"/g,'')+'"').join(',')+')'}

async function schLoad(mk,uids){
  if(!uids.length)return{};
  const [a,b]=schMonthRange(mk);
  const rows=await schFetch('/schedule?select=*&date=gte.'+a+'&date=lte.'+b
    +'&uid=in.'+encodeURIComponent(schInList(uids)));
  const map={};
  (rows||[]).forEach(r=>{map[r.uid+'|'+normDate(r.date)]=r});
  return map;
}

// ── ВЕС СМЕНЫ → ОКЛАДНАЯ ЧАСТЬ ────────────────────────────────────
// Окладная часть = ставка × сумма весов отработанных смен.
// Вес берётся из типа смены в графике: полная = 1, полсмены = 0.5.
//
// Дни по-прежнему определяются записями о продажах (в т.ч. нулевыми) —
// график только уточняет, полная это была смена или половина.
//
// Если день в графике не отмечен ИЛИ график недоступен — вес 1,
// то есть ровно прежнее поведение. Модуль не может урезать оклад
// из-за собственной поломки.
let _schW={};
function schShiftWeight(uid,date){
  const r=_schW[uid+'|'+normDate(date)];
  if(!r)return 1;
  const t=schType(r.shift_type);
  // Отпуск/больничный, но продажи введены — данные противоречат друг
  // другу. Считаем как обычную смену, в пользу сотрудника.
  return(t&&t.counts_as_shift)?(+t.k||1):1;
}
function schShifts(uid,ents){
  return ents.reduce((s,e)=>s+schShiftWeight(uid,e.date),0);
}
async function schLoadWeights(mk,uids){
  try{await schLoadRefs();_schW=await schLoad(mk,uids)}
  catch(e){_schW={};console.warn('График недоступен, все смены считаются полными:',e)}
}
// 12 → "12", 12.5 → "12,5"
const fmtSh=n=>Number.isInteger(n)?String(n):String(Math.round(n*10)/10).replace('.',',');

// Магазины, доступные текущему пользователю: продавец и управляющий —
// только свой, остальные роли — все.
function schShops(){
  return(CU.role==='seller'||CU.role==='manager')?[CU.shop]:SHOPS;
}
// В графике участвуют продавцы и управляющие выбранного магазина.
function schVisibleUsers(shop){
  return USERS.filter(u=>(u.role==='seller'||u.role==='manager')&&u.shop===shop)
              .sort((a,b)=>a.name.localeCompare(b.name,'ru'));
}

// hasPlanMonth — есть ли у сотрудника хоть один план в этом месяце.
// Если плана нет вообще, факт без плана — это не «вышел вне графика»,
// а просто отработанная смена: нельзя нарушить график, которого нет.
function schCellHtml(u,dt,hasPlanMonth){
  const r=_sch[u.id+'|'+dt]||null;
  const t=r?schType(r.shift_type):null;
  const past=dt<today();
  const hasPlan=!!(r&&(r.planned_point||(t&&!t.needs_point)));
  const hasFact=!!(r&&r.actual_point);
  let bg='',txt='',col='#fff',cls='',ttl='';
  if(hasPlan){
    if(t&&!t.needs_point){bg=t.color;txt=t.short;ttl=t.name}
    else{
      const p=schPoint(r.planned_point);
      bg=p?p.color:'#888780';
      txt=r.planned_point+(t&&t.code!=='full'?t.short:'');
      ttl=(p?p.name:r.planned_point)+' · '+(t?t.name:'');
    }
  }else if(hasFact){
    txt=r.actual_point;
    const pn=(schPoint(r.actual_point)||{}).name||r.actual_point;
    if(hasPlanMonth){
      col='var(--blue)';cls='extra';ttl='Вышел вне графика — '+pn;
    }else{
      col='var(--muted)';cls='noplan';ttl='Смена по факту, '+pn+' · план на месяц не заполнен';
    }
  }
  let fbg='transparent';
  if(hasFact){fbg='var(--green)';ttl+=' · смена подтверждена продажами'}
  else if(hasPlan&&t&&t.counts_as_shift&&past){fbg='var(--red)';ttl+=' · факта нет'}
  // фон не пишем инлайном, когда его нет: иначе inline-стиль перебьёт
  // подсветку пустой клетки при наведении
  const st=bg?('background:'+bg+';color:'+col):('color:'+col);
  return '<td class="sch-day'+(schIsWe(dt)?' sch-we':'')+'">'
    +'<div class="sch-cell '+cls+'" title="'+ttl+'" onclick="schOpen(\''+u.id+'\',\''+dt+'\')">'
    +'<div class="sch-p" style="'+st+'">'+txt+'</div>'
    +'<div class="sch-f"'+(fbg==='transparent'?'':' style="background:'+fbg+'"')+'></div></div></td>';
}

async function schRender(){
  const body=document.getElementById('sch-body'),box=document.getElementById('sch-alert');
  if(!body)return;
  body.innerHTML='<div class="spin" style="margin:1rem auto;display:block"></div>';
  const users=schVisibleUsers(_schShop);
  if(!users.length){
    body.innerHTML='<div class="card">В магазине «'+_schShop+'» нет продавцов и управляющих.</div>';
    if(box)box.innerHTML='';return;
  }
  try{_sch=await schLoad(_schMk,users.map(u=>u.id))}
  catch(e){body.innerHTML='<div class="alert ae">'+e.message+'</div>';return}

  const days=[];
  for(let d=1;d<=daysInMk(_schMk);d++)days.push(_schMk+'-'+String(d).padStart(2,'0'));

  let h='<div class="sch-wrap"><table class="sch"><thead><tr><th class="sch-name">Сотрудник</th>';
  days.forEach(dt=>{
    const d=new Date(dt+'T00:00:00');
    h+='<th class="sch-day'+(schIsWe(dt)?' sch-we':'')+'"><span class="sch-dn">'+d.getDate()
      +'</span><span class="sch-dw">'+SCH_DOW[d.getDay()]+'</span></th>';
  });
  h+='<th class="sch-tot">План</th><th class="sch-tot">Факт</th></tr></thead><tbody>';

  const rm=ROLE_LABELS;
  // у кого в этом месяце вообще есть план — от этого зависит,
  // считать ли факт без плана выходом вне графика
  const hasPlan={};
  users.forEach(u=>{
    hasPlan[u.id]=days.some(dt=>{
      const r=_sch[u.id+'|'+dt];if(!r)return false;
      const t=schType(r.shift_type);
      return !!(r.planned_point||(t&&!t.needs_point));
    });
  });
  users.forEach(u=>{
    let pc=0,fc=0,row='';
    days.forEach(dt=>{
      const r=_sch[u.id+'|'+dt];
      if(r){
        const t=schType(r.shift_type);
        if(t&&t.counts_as_shift&&(r.planned_point||!t.needs_point))pc++;
        if(r.actual_point)fc++;
      }
      row+=schCellHtml(u,dt,hasPlan[u.id]);
    });
    h+='<tr><td class="sch-name"><b>'+esc(u.name)+'</b><div style="font-size:11px;color:var(--muted)">'
      +(rm[u.role]||u.role)+'</div></td>'+row
      +'<td class="sch-tot">'+pc+'</td><td class="sch-tot">'+fc+'</td></tr>';
  });

  const pts=schPointsForShop(_schShop),own=schPointOfShop(_schShop),uncov=[];
  pts.forEach(p=>{
    let tot=0,cells='';
    days.forEach(dt=>{
      let c=0;
      users.forEach(u=>{
        const r=_sch[u.id+'|'+dt];
        if(r&&r.planned_point===p.code){const t=schType(r.shift_type);if(t&&t.counts_as_shift)c++}
      });
      tot+=c;
      if(own&&p.code===own.code&&c===0)uncov.push(dt);
      cells+='<td class="sch-day'+(schIsWe(dt)?' sch-we':'')+'" style="text-align:center">'+(c||'')+'</td>';
    });
    h+='<tr class="sch-sum"><td class="sch-name">Итого · '+p.name+'</td>'+cells
      +'<td class="sch-tot">'+tot+'</td><td class="sch-tot"></td></tr>';
  });
  h+='</tbody></table></div><div class="sch-legend">';
  pts.forEach(p=>h+='<span><span class="sch-dot" style="background:'+p.color+'"></span>'+p.code+' — '+p.name+'</span>');
  h+='<span style="margin-left:auto"><span class="sch-dot" style="background:var(--green)"></span>смена подтверждена продажами</span>'
    +'<span><span class="sch-dot" style="background:var(--red)"></span>план был, факта нет</span>'
    +'<span><span class="sch-dot" style="border:2px dashed var(--blue)"></span>вышел вне графика</span></div>';
  body.innerHTML=h;

  if(box){
    // Ближайшие дни выделяем отдельно: именно они блокируют ввод продаж
    const lim=schAddDays(today(),SCH_HORIZON_DAYS);
    const future=uncov.filter(d=>d>=today());
    const soon=future.filter(d=>d<=lim), later=future.filter(d=>d>lim);
    let h='';
    if(own&&soon.length)
      h+='<div class="alert ae">⛔ Не закрыты ближайшие '+SCH_HORIZON_DAYS+' дней на точке «'+own.name+'»: '
        +schDatesLabel(soon)+'. Пока не закроете — продавцы не смогут вносить продажи'
        +(curMk()<SCH_ENFORCE_FROM?' (с '+schEnforceLabel()+')':'')+'.</div>';
    if(own&&later.length)
      h+='<div class="alert" style="background:var(--al);color:var(--amber)">⚠️ Дальше в месяце не закрыто: '
        +schDatesLabel(later.slice(0,20))+(later.length>20?' и ещё '+(later.length-20):'')+'</div>';
    box.innerHTML=h;
  }
}

    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.25rem">
      <div><b>${u?u.name:''}</b>
        <div style="font-size:12px;color:var(--muted)">${d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'long'})}</div></div>
      <button class="btn bsm" onclick="this.closest('.ov').remove()">✕</button>
    </div>
    <div class="fl">Точка</div>

      `<button class="sch-opt ${curP===p.code?'sel':''}" data-p="${p.code}" onclick="schPick(this)">
        <span class="sch-dot" style="background:${p.color}"></span>${p.code} — ${p.name}</button>`).join('')}</div>
    <div class="fl">Тип смены</div>
    <div class="sch-opts" id="sch-tps">${SCH_TYPES.map(t=>
      `<button class="sch-opt ${curT===t.code?'sel':''}" data-t="${t.code}" onclick="schPick(this)">${t.name}</button>`).join('')}</div>
    <div id="sch-note" style="font-size:12px;color:var(--muted);margin-bottom:1rem;min-height:16px"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn bp" onclick="schSave('${uid}','${dt}')">Сохранить</button>
      ${r?`<button class="btn bd2" onclick="schClear('${uid}','${dt}')">Убрать смену</button>`:''}
      <button class="btn" onclick="this.closest('.ov').remove()">Отмена</button>
    </div>
    ${r&&r.actual_point?`<div style="margin-top:1rem;font-size:12px;color:var(--green)">
      ✓ Факт: ${r.actual_point}${r.actual_source==='sales'?' (проставлено автоматически по продажам)':''}</div>`:''}
  </div>`;
  document.body.appendChild(ov);
  schNote();
}
window.schPick=function(btn){
  btn.parentElement.querySelectorAll('.sch-opt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');schNote();
}
function schNote(){
  const ov=document.getElementById('sch-ov');if(!ov)return;
  const sel=ov.querySelector('#sch-tps .sel');
  const t=schType(sel?sel.dataset.t:'full');
  const pw=ov.querySelector('#sch-pts'),note=ov.querySelector('#sch-note');
  if(t&&!t.needs_point){
    pw.style.opacity='.35';pw.style.pointerEvents='none';
    note.textContent=t.name+' — точка не нужна, в число смен не входит.';
  }else{
    pw.style.opacity='1';pw.style.pointerEvents='auto';
    note.textContent=(t&&+t.k!==1)?('Коэффициент к окладу: '+t.k):'';
  }
}
window.schSave=async function(uid,dt){
  const ov=document.getElementById('sch-ov');
  const ts=ov.querySelector('#sch-tps .sel'),t=schType(ts?ts.dataset.t:'full');
  const ps=ov.querySelector('#sch-pts .sel');
  const pCode=t.needs_point?(ps?ps.dataset.p:null):null;
  if(t.needs_point&&!pCode){alert('Выберите точку');return}
  const u=USERS.find(x=>String(x.id)===String(uid));
  const prev=_sch[uid+'|'+dt]||{};
  L(true);
  try{
    await schFetch('/schedule',{method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify([{uid:String(uid),date:dt,shop:u?u.shop:_schShop,
        planned_point:pCode,actual_point:prev.actual_point||null,
        actual_source:prev.actual_source||null,shift_type:t.code,updated_by:CU.name}])});
  }catch(e){L(false);alert(e.message);return}
  L(false);ov.remove();await schRender();
}
window.schClear=async function(uid,dt){
  L(true);
  try{await schFetch('/schedule?uid=eq.'+encodeURIComponent(uid)+'&date=eq.'+dt,{method:'DELETE'})}
  catch(e){L(false);alert(e.message);return}
  L(false);
  const ov=document.getElementById('sch-ov');if(ov)ov.remove();
  await schRender();
}

// ── ЭКСПОРТ ТАБЕЛЯ ────────────────────────────────────────────────
// Три листа: План / Факт / Свод. План и факт разнесены по разным
// листам намеренно — в одну клетку два значения не положить, а
// расхождение между ними и есть самое интересное.
window.schExportExcel=function(){
  if(typeof XLSX==='undefined'){alert('Библиотека Excel не загрузилась. Обнови страницу.');return}
  const users=schVisibleUsers(_schShop);
  if(!users.length){alert('В этом магазине нет сотрудников.');return}
  const nd=daysInMk(_schMk),days=[];
  for(let d=1;d<=nd;d++)days.push(_schMk+'-'+String(d).padStart(2,'0'));
  const [yy,mm]=_schMk.split('-');
  const title=new Date(+yy,+mm-1,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  const rm=ROLE_LABELS;
  const pts=schPointsForShop(_schShop);
  const wb=XLSX.utils.book_new();

  // значение клетки: план (с пометкой типа) либо метка отпуска/больничного
  const planCell=(u,dt)=>{
    const r=_sch[u.id+'|'+dt];if(!r)return'';
    const t=schType(r.shift_type);
    if(t&&!t.needs_point)return t.short;
    return r.planned_point?r.planned_point+(t&&t.code!=='full'?t.short:''):'';
  };
  const factCell=(u,dt)=>{const r=_sch[u.id+'|'+dt];return r&&r.actual_point?r.actual_point:''};
  // код точки для подсчёта итогов — берём из данных, а не разбираем текст клетки
  const planCode=(u,dt)=>{const r=_sch[u.id+'|'+dt];return r?r.planned_point:null};
  const factCode=(u,dt)=>{const r=_sch[u.id+'|'+dt];return r?r.actual_point:null};

  const sheet=(pick,label,code)=>{
    const aoa=[['ТАБЕЛЬ · '+label+' · '+_schShop+' · '+title],[],
      ['Сотрудник','Должность',...days.map(d=>+d.slice(-2)),'Итого']];
    users.forEach(u=>{
      let n=0;
      const row=days.map(dt=>{const v=pick(u,dt);if(v)n++;return v});
      aoa.push([u.name,rm[u.role]||u.role,...row,n]);
    });
    aoa.push([]);
    pts.forEach(p=>{
      let tot=0;
      const row=days.map(dt=>{
        let c=0;users.forEach(u=>{if(code(u,dt)===p.code)c++});
        tot+=c;return c||'';
      });
      aoa.push(['Итого · '+p.name,'',...row,tot]);
    });
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[{wch:26},{wch:14},...days.map(()=>({wch:4.5})),{wch:8}];
    ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:days.length+2}}];
    return ws;
  };
  XLSX.utils.book_append_sheet(wb,sheet(planCell,'ПЛАН',planCode),'План');
  XLSX.utils.book_append_sheet(wb,sheet(factCell,'ФАКТ',factCode),'Факт');

  // ── Свод: смены по типам + расхождение план/факт ──
  const aoa=[['СВОД ПО СМЕНАМ · '+_schShop+' · '+title],[],
    ['Сотрудник','Должность',...SCH_TYPES.map(t=>t.name),
     'Смен по плану','Смен подтверждено','Невыходов','Вне графика','СМЕН К ОПЛАТЕ']];
  users.forEach(u=>{
    const cnt={},row=[];let plan=0,fact=0,miss=0,extra=0,weighted=0;
    SCH_TYPES.forEach(t=>cnt[t.code]=0);
    days.forEach(dt=>{
      const r=_sch[u.id+'|'+dt];if(!r)return;
      const t=schType(r.shift_type);
      const hasPlan=!!(r.planned_point||(t&&!t.needs_point));
      if(hasPlan&&t)cnt[t.code]++;
      if(hasPlan&&t&&t.counts_as_shift){plan++;weighted+=(+t.k||1)}
      if(r.actual_point)fact++;
      if(hasPlan&&t&&t.counts_as_shift&&!r.actual_point&&dt<today())miss++;
      if(!hasPlan&&r.actual_point)extra++;
    });
    SCH_TYPES.forEach(t=>row.push(cnt[t.code]||''));
    aoa.push([u.name,rm[u.role]||u.role,...row,plan,fact,miss||'',extra||'',weighted]);
  });
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:26},{wch:14},...SCH_TYPES.map(t=>({wch:Math.max(11,t.name.length+2)})),
    {wch:14},{wch:18},{wch:12},{wch:13},{wch:16}];
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:SCH_TYPES.length+6}}];
  XLSX.utils.book_append_sheet(wb,ws,'Свод');

  XLSX.writeFile(wb,'FBSM_Табель_'+_schShop+'_'+_schMk+'.xlsx');
}

// ══════════════════════════════════════════════════════════════════
// ЗАКРЫТИЕ МЕСЯЦА И ЖУРНАЛ ИЗМЕНЕНИЙ
// ------------------------------------------------------------------
// Закрытый месяц — тот, по которому зарплата уже выдана. Править в нём
// продажи, планы и корректировки нельзя: начисление разъедется с тем,
// что реально получили на руки.
//
// Проверка идёт на клиенте, как и всё остальное разграничение прав
// в этой программе. От случайной правки защищает, от намеренной —
// нет; это чинится только переносом проверок в Edge Function.
// ══════════════════════════════════════════════════════════════════
let _closed=null;   // Set из '2026-07'

async function loadClosed(force){
  if(_closed&&!force)return _closed;
  try{
    const r=await schFetch('/closed_months?select=mk');
    _closed=new Set((r||[]).map(x=>x.mk));
  }catch(e){ _closed=new Set(); }   // таблицы ещё нет — ничего не блокируем
  return _closed;
}
function isClosed(mk){ return !!(_closed&&_closed.has(normMk(mk))); }

// Единая проверка перед любой правкой. Возвращает текст ошибки или null.
function closedGuard(mk){
  return isClosed(mk)
    ? 'Месяц '+normMk(mk)+' закрыт бухгалтером — зарплата по нему уже начислена. Правки запрещены.'
    : null;
}
function sayClosed(msg,elId){
  const m=elId?document.getElementById(elId):null;
  if(m){m.style.cssText='';m.className='alert ae';m.textContent='🔒 '+msg}
  else alert('🔒 '+msg);
}

// Журнал: пишем и забываем. Ошибка записи не должна ломать операцию —
// иначе журнал станет причиной сбоев вместо страховки.
function logAction(action,target,mk,details){
  try{
    schFetch('/audit_log',{method:'POST',body:JSON.stringify([{
      who:CU?CU.name:null, who_role:CU?CU.role:null,
      action, target:target||null, mk:mk?normMk(mk):null,
      details:details||null
    }])}).catch(()=>{});
  }catch(e){}
}

window.toggleMonthClosed=async function(mk){
  await loadClosed(true);
  const closing=!isClosed(mk);
  const q=closing
    ? 'Закрыть '+mk+'?\n\nПосле этого продажи, планы и корректировки за этот месяц править будет нельзя.\nДелайте это после того, как зарплата выдана.'
    : 'Открыть '+mk+' обратно?\n\nПравки снова станут возможны.';
  if(!confirm(q))return;
  L(true);
  try{
    if(closing){
      await schFetch('/closed_months',{method:'POST',
        headers:{'Prefer':'resolution=merge-duplicates'},
        body:JSON.stringify([{mk,closed_by:CU.name}])});
    }else{
      await schFetch('/closed_months?mk=eq.'+encodeURIComponent(mk),{method:'DELETE'});
    }
    logAction(closing?'closeMonth':'reopenMonth',null,mk,null);
    await loadClosed(true);
  }catch(e){L(false);alert('Не удалось: '+e.message+'\n\nВозможно, не выполнен скрипт 03_closed_months_audit.sql');return}
  L(false);
  loadPayroll();
}

// ── ИНТЕГРАЦИЯ С ВВОДОМ ПРОДАЖ ────────────────────────────────────
// Горизонт планирования: график магазина должен быть закрыт на
// ближайшие 7 дней, считая от сегодня.
//
// Проверяем ПОКРЫТИЕ МАГАЗИНА, а не отдельного человека. Выходной в
// графике — это просто пустая клетка, поэтому «у продавца заполнены
// все дни» проверить невозможно: законный выходной неотличим от
// незаполненного дня. А вот «на точке в этот день кто-то стоит» —
// проверяется однозначно и совпадает по смыслу с алертом наверху
// вкладки «График».
const SCH_HORIZON_DAYS=7;

// С какого месяца блокировка работает жёстко. Раньше — только
// предупреждение, продажи сохраняются. Нужно, чтобы включение модуля
// не остановило ввод выручки в уже идущем месяце.
const SCH_ENFORCE_FROM='2026-08';

const SCH_MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function schAddDays(d,n){
  const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
}
// '2026-08' → «1 августа» — дата, с которой включается запрет
function schEnforceLabel(){
  const p=SCH_ENFORCE_FROM.split('-');
  return new Date(+p[0],+p[1]-1,1).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
}
// ['2026-07-31','2026-08-01'] → «31 июл · 1 авг»
function schDatesLabel(ds){
  const g={};
  ds.forEach(d=>{const p=d.split('-');(g[p[1]]=g[p[1]]||[]).push(+p[2])});
  return Object.keys(g).sort().map(m=>g[m].join(', ')+' '+SCH_MON[+m-1]).join(' · ');
}

// Дни ближайшего горизонта, на которые в магазине никто не поставлен.
// null — проверять нечего (у магазина нет торговой точки).
async function schUncoveredAhead(shop){
  await schLoadRefs();
  const own=schPointOfShop(shop);
  if(!own)return null;
  const a=today(),b=schAddDays(a,SCH_HORIZON_DAYS);
  const rows=await schFetch('/schedule?select=date,planned_point,shift_type&shop=eq.'
    +encodeURIComponent(shop)+'&date=gte.'+a+'&date=lte.'+b);
  const covered=new Set();
  (rows||[]).forEach(r=>{
    const t=schType(r.shift_type);
    if(r.planned_point===own.code&&t&&t.counts_as_shift)covered.add(normDate(r.date));
  });
  const miss=[];
  for(let d=a;d<=b;d=schAddDays(d,1))if(!covered.has(d))miss.push(d);
  return miss;
}

// {st:'ok'|'soft'|'block', miss:[даты]}
// Если модуль графика недоступен — всегда 'ok': поломка графика
// не должна мешать сохранять выручку.
async function schGuard(shop){
  let miss=null;
  try{miss=await schUncoveredAhead(shop)}catch(e){return{st:'ok'}}
  if(!miss||!miss.length)return{st:'ok'};
  return{st:curMk()<SCH_ENFORCE_FROM?'soft':'block',miss};
}
// saved=false — продажи не сохранены (жёсткая блокировка)
// saved=true  — сохранены, но график впереди дырявый (мягкий период)
function schSayGuard(g,saved,date){
  const days=schDatesLabel(g.miss||[]);
  const txt=saved
    ? '✓ Сохранено за '+date+'. Но график магазина не закрыт на ближайшие '
      +SCH_HORIZON_DAYS+' дней — пусто: '+days+'. Заполните вкладку «📅 График».'
    : '⛔ График магазина не закрыт на ближайшие '+SCH_HORIZON_DAYS+' дней. '
      +'Никто не поставлен: '+days+'. Откройте «📅 График», проставьте смены — после этого продажи сохранятся.';
  const m=document.getElementById('emsg');
  if(!m){alert(txt);return}
  m.style.cssText=saved?'background:var(--al);color:var(--amber)':'';
  m.className=saved?'alert':'alert ae';
  m.textContent=txt;
}
// Автоотметка факта смены по дате ввода продаж.
// Точка берётся из плана, если он есть; иначе — точка магазина.
async function schMarkActual(uid,date,shop){
  await schLoadRefs();
  const rows=await schFetch('/schedule?select=*&uid=eq.'+encodeURIComponent(uid)+'&date=eq.'+date);
  const prev=(rows&&rows[0])||null;
  const own=schPointOfShop(shop);
  const pt=(prev&&prev.planned_point)||(own?own.code:null);
  if(!pt)return;
  await schFetch('/schedule',{method:'POST',
    headers:{'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{uid:String(uid),date,shop:shop||null,
      planned_point:prev?prev.planned_point:null,actual_point:pt,actual_source:'sales',
      shift_type:prev?prev.shift_type:'full',updated_by:CU?CU.name:null}])});
}
